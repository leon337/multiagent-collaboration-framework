schema_version: 1

capability:
  id: mcf.remotion.video.local.v1
  provider_project_id: remotion-mcp-local
  consumer_project_ids:
    - multiagent-collaboration-framework
  mode: SCOPED_WRITE

contract:
  protocol: MCP_STREAMABLE_HTTP
  allowed_operations:
    - remotion_health
    - remotion_list_compositions
    - remotion_get_project
    - remotion_list_jobs
    - remotion_job_status
  candidate_write_operations:
    - remotion_create_project
    - remotion_edit_scene
    - remotion_enqueue_job
    - remotion_cancel_job
  prohibited_operations:
    - production.publish
    - shell.execute
    - runtime.config.mutate
    - arbitrary_file_write
    - ungoverned_tool_dispatch

scope:
  environments: [local-lab]
  resources:
    - workstation/remotion-mcp
  endpoint: http://127.0.0.1:4777/mcp

governance:
  authority_human: LEANDRO
  orchestrator: MESTRE
  permission_profile: SCOPED_WRITE
  write_gate: HDF_PERMISSION_ENGINE_REQUIRED
  write_enabled_in_mcf_adapter: false
  production_deploy: false

lifecycle:
  implementation_state: IMPLEMENTED_LOCAL_ADAPTER
  connection_state: CONNECTED_LOCAL_READ_ONLY
  runtime_state: INACTIVE
  verification_state: LOCALLY_VERIFIED
  registration_state: CANDIDATE

evidence:
  - kind: executable
    source_ref: repo://leon337/multiagent-collaboration-framework/tools/remotion-mcf-adapter
  - kind: local-e2e
    video_id: primeiro-video-mcf
    job_id: a4dad723-1524-4af1-93bd-63e0ac7110e7
