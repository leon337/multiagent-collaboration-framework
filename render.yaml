services:
  - type: web
    name: rsa-api-free
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/leon337/multiagent-collaboration-framework
    branch: main
    dockerfilePath: ./apps/rede-social-agentes/deploy/server.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      - key: BODY_LIMIT_BYTES
        value: "262144"
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: MCF_RECEIPT_SECRET
        generateValue: true
      - key: MCF_RUNTIME_TOKEN
        generateValue: true
      - key: MCF_MISSION_CONTROL_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REGISTRATION_ALLOWLIST
        sync: false
      - key: RESERVED_HUMAN_AUTHORITY_ACCOUNT_ID
        sync: false

  - type: web
    name: mcf-human-authority-bootstrap-staging
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/leon337/multiagent-collaboration-framework
    branch: feat/human-authority-bootstrap-004
    dockerfilePath: ./apps/rede-social-agentes/deploy/server.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: MCF_BOOTSTRAP_ISSUER
        value: "true"
      - key: DATABASE_URL
        fromService:
          type: web
          name: mcf-runtime-staging-api
          envVarKey: DATABASE_URL
      - key: BOOTSTRAP_SEAL_PUBLIC_JWK
        sync: false
      - key: BOOTSTRAP_SUBJECT_PEPPER
        generateValue: true
      - key: BOOTSTRAP_OIDC_AUDIENCE
        value: mcf-human-authority-bootstrap
      - key: BOOTSTRAP_ALLOWED_REPOSITORY
        value: leon337/multiagent-collaboration-framework
      - key: BOOTSTRAP_ALLOWED_REPOSITORY_ID
        value: "1316814482"
      - key: BOOTSTRAP_ALLOWED_REPOSITORY_OWNER_ID
        value: "25374535"
      - key: BOOTSTRAP_ALLOWED_REF
        value: refs/heads/feat/human-authority-bootstrap-004
      - key: BOOTSTRAP_ALLOWED_WORKFLOW_REF
        value: leon337/multiagent-collaboration-framework/.github/workflows/human-authority-bootstrap-staging.yml@refs/heads/feat/human-authority-bootstrap-004
      - key: BOOTSTRAP_ALLOWED_WORKFLOW_SHA
        sync: false
      - key: BOOTSTRAP_ALLOWED_ENVIRONMENT
        value: mcf-human-authority-staging
      - key: BOOTSTRAP_RUNTIME_BASE_URL
        sync: false
      - key: BOOTSTRAP_EXPECTED_RUNTIME_SHA
        value: a7b2016cd7705f37acb949ba77de31833cf62521

  - type: web
    name: rsa-web-free
    runtime: static
    repo: https://github.com/leon337/multiagent-collaboration-framework
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.17.0 --activate &&
      cd apps/rede-social-agentes &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @rsa/contracts build &&
      pnpm --filter @rsa/web build
    staticPublishPath: ./apps/rede-social-agentes/apps/web/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
