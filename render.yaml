services:
  - type: web
    name: rsa-api-free
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/leon337/multiagent-collaboration-framework
    branch: main
    dockerfilePath: ./apps/rede-social-agentes/deploy/server.Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "true"
      - key: BODY_LIMIT_BYTES
        value: "262144"
      - key: RATE_LIMIT_KEY_SECRET
        generateValue: true
      - key: MCF_RECEIPT_SECRET
        generateValue: true
      - key: MCF_RUNTIME_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REGISTRATION_ALLOWLIST
        sync: false

  - type: web
    name: rsa-web-free
    runtime: static
    repo: https://github.com/leon337/multiagent-collaboration-framework
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@11.17.0 --activate &&
      cd apps/rede-social-agentes &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @rsa/contracts build &&
      pnpm --filter @rsa/web build
    staticPublishPath: ./apps/rede-social-agentes/apps/web/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
