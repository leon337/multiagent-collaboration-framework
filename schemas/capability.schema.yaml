schema_version: 1
name: capability

fields:
  identity:
    required: true
  ownership:
    required: true
  implementation:
    values: [DECLARED, DESIGNED, IMPLEMENTED, TESTED]
  connection:
    values: [DISCONNECTED, CONNECTED, DEGRADED]
  authorization:
    values: [NONE, READ_ONLY, LIMITED_WRITE, FULL_WRITE, PRODUCTION_CONTROLLED]
  runtime:
    values: [UNKNOWN, AVAILABLE, UNAVAILABLE, FAILED]
  verification:
    values: [UNVERIFIED, VERIFIED, STALE]
  provenance:
    required: true
  freshness:
    required: true
