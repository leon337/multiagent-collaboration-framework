policy:
  name: MCF Plugin Permissions
  version: 1.0.0
  status: ACTIVE
  authority_human: Leandro
  authority_operational: Leo

profiles:
  READ_ONLY:
    read: allowed_when_relevant
    draft: allowed
    reversible_write: forbidden
    destructive_write: forbidden
    public_action: forbidden

  READ_AND_PROPOSE:
    read: allowed_when_relevant
    draft: allowed
    reversible_write: requires_internal_gate
    destructive_write: forbidden
    public_action: requires_human_gate

  SCOPED_WRITE:
    read: allowed_when_relevant
    draft: allowed
    reversible_write: allowed_inside_authorized_scope
    destructive_write: requires_human_gate
    public_action: requires_human_gate

  SENSITIVE_CONTROLLED:
    read: minimum_necessary
    draft: allowed_with_redaction
    reversible_write: explicit_authorization
    destructive_write: requires_human_gate
    public_action: requires_human_gate
    secrets: never_expose

  HUMAN_GATE:
    read: minimum_necessary
    any_write: confirm_with_Leandro

plugin_overrides:
  GitHub:
    profile: SCOPED_WRITE
    read: allowed
    create_branch: allowed_inside_scope
    create_commit: allowed_inside_scope
    create_pr: allowed_inside_scope
    comment: allowed_inside_scope
    merge: requires_Leo_gate_and_green_CI
    force_push: forbidden_without_Leandro
    delete_repository: forbidden
    required_evidence: [repository, branch, commit_sha, pr_number, ci_status]

  Linear:
    profile: SCOPED_WRITE
    read: allowed
    create_or_update_issue: allowed_inside_scope
    close_or_cancel_issue: requires_Leo_gate
    required_evidence: [issue_id, changed_fields]

  Asana:
    profile: SCOPED_WRITE
    read: allowed
    create_or_update_task: allowed_inside_scope
    delete_task: requires_human_gate
    required_evidence: [task_id, changed_fields]

  Gmail:
    profile: SENSITIVE_CONTROLLED
    search_and_read: allowed_when_requested_or_required
    create_draft: allowed
    send: requires_human_gate
    delete_or_trash: requires_human_gate
    required_evidence: [message_or_thread_reference, intended_recipient]

  Google_Calendar:
    profile: SENSITIVE_CONTROLLED
    search_and_read: allowed_when_relevant
    create_or_update_event: requires_human_gate
    delete_event: requires_human_gate
    required_evidence: [calendar, event_id, attendees, time]

  Google_Contacts:
    profile: SENSITIVE_CONTROLLED
    search_and_read: allowed_when_needed
    create_or_update: requires_human_gate
    required_evidence: [contact_reference]

  Google_Drive:
    profile: SCOPED_WRITE
    search_and_read: allowed_when_relevant
    create_document: allowed_inside_scope
    modify_shared_document: requires_internal_gate
    delete_or_change_sharing: requires_human_gate
    required_evidence: [file_id_or_reference, operation]

  Notion:
    profile: SCOPED_WRITE
    search_and_read: allowed_when_relevant
    create_page: allowed_inside_scope
    update_page: allowed_inside_scope
    delete_or_public_share: requires_human_gate
    required_evidence: [page_reference, operation]

  Figma:
    profile: READ_AND_PROPOSE
    read: allowed
    create_or_update_design: allowed_inside_scope
    publish_library_or_replace_production_asset: requires_human_gate
    required_evidence: [file_or_node_reference]

  Canva:
    profile: READ_AND_PROPOSE
    create_or_update_design: allowed_inside_scope
    publish_or_share_publicly: requires_human_gate
    required_evidence: [design_reference]

  Product_Design:
    profile: READ_AND_PROPOSE
    prototype: allowed_inside_scope
    production_publish: forbidden
    required_evidence: [prototype_reference_or_specification]

  Mermaid_Chart:
    profile: READ_AND_PROPOSE
    validate_and_render: allowed
    overwrite_shared_diagram: requires_internal_gate
    required_evidence: [diagram_source_or_reference]

  PostHog:
    profile: SENSITIVE_CONTROLLED
    read_analytics: allowed_when_relevant
    create_insight: allowed_inside_scope
    change_feature_flag_or_experiment: requires_human_gate
    delete_data: forbidden
    required_evidence: [project, query_or_insight_reference]

  Amplitude:
    profile: SENSITIVE_CONTROLLED
    read_analytics: allowed_when_relevant
    create_chart_or_dashboard: allowed_inside_scope
    destructive_changes: requires_human_gate
    required_evidence: [project, chart_or_query_reference]

  Mixpanel:
    profile: SENSITIVE_CONTROLLED
    read_analytics: allowed_when_relevant
    create_analysis: allowed_inside_scope
    destructive_changes: requires_human_gate
    required_evidence: [project, query_reference]

  Sentry:
    profile: SCOPED_WRITE
    read_issues_and_events: allowed
    comment_or_assign: allowed_inside_scope
    resolve_issue: requires_internal_gate
    delete_project_or_data: forbidden
    required_evidence: [organization, project, issue_or_event_id]

  Codex_Security:
    profile: READ_AND_PROPOSE
    scan: allowed
    propose_fix: allowed
    apply_fix: requires_authorized_implementation_scope
    required_evidence: [repository, finding, severity]

  MCP_Precheck:
    profile: READ_ONLY
    inspect_server: allowed
    connect_or_authorize_server: requires_human_gate
    required_evidence: [server_reference, verdict, findings]

  AccessOwl:
    profile: SENSITIVE_CONTROLLED
    browse_available_apps: allowed
    request_access: requires_human_gate
    grant_or_revoke_access: forbidden_unless_explicitly_authorized
    required_evidence: [application, requested_access, requester]

  Neura_Relay_MCP:
    profile: SENSITIVE_CONTROLLED
    review_proposed_action: allowed
    downstream_execution: not_performed_by_plugin
    required_evidence: [decision_receipt, trace_reference]

  PrivacyHawk:
    profile: HUMAN_GATE
    inspect_privacy_options: allowed
    submit_deletion_or_opt_out: requires_human_gate
    required_evidence: [target_company, requested_action]

  Supabase:
    profile: SENSITIVE_CONTROLLED
    read_schema_and_data: allowed_when_required
    create_or_update_nonproduction: allowed_inside_scope
    production_schema_change: requires_human_gate
    destructive_query: requires_human_gate
    required_evidence: [project, database, query_or_migration]

  Neon_Postgres:
    profile: SENSITIVE_CONTROLLED
    read_schema_and_data: allowed_when_required
    branch_database: allowed_inside_scope
    production_change_or_delete: requires_human_gate
    required_evidence: [project, branch, database, query_or_change]

  Vercel:
    profile: SCOPED_WRITE
    inspect_projects_and_deployments: allowed
    preview_deploy: allowed_inside_scope
    production_deploy_or_env_change: requires_human_gate
    required_evidence: [project, deployment_id, target]

  Render:
    profile: SCOPED_WRITE
    inspect_services_and_logs: allowed
    trigger_nonproduction_deploy: allowed_inside_scope
    production_deploy_or_env_change: requires_human_gate
    required_evidence: [service, deployment_id, target]

  Cloudflare:
    profile: SENSITIVE_CONTROLLED
    inspect_configuration: allowed
    change_dns_security_or_production_routing: requires_human_gate
    required_evidence: [account, zone, operation]

  OpenAI_Developers:
    profile: SENSITIVE_CONTROLLED
    inspect_documentation_and_configuration: allowed
    create_or_reveal_api_key: requires_human_gate
    required_evidence: [project_or_resource_reference]

  Granola:
    profile: SENSITIVE_CONTROLLED
    read_meeting_context: allowed_when_relevant
    share_or_export: requires_human_gate
    required_evidence: [meeting_reference]

  Fireflies:
    profile: SENSITIVE_CONTROLLED
    search_and_read_transcript: allowed_when_relevant
    share_or_export: requires_human_gate
    required_evidence: [meeting_reference]

  MeetGeek:
    profile: SENSITIVE_CONTROLLED
    search_and_read_transcript: allowed_when_relevant
    share_or_export: requires_human_gate
    required_evidence: [meeting_reference]

  Consensus:
    profile: READ_ONLY
    academic_search: allowed
    required_evidence: [query, cited_papers]

  Sider_Scholar:
    profile: READ_ONLY
    academic_search_and_read: allowed
    save_to_knowledge_base: requires_internal_gate
    required_evidence: [query, paper_references]

  Documents:
    profile: SCOPED_WRITE
    create_artifact: allowed_inside_scope
    overwrite_user_document: requires_internal_gate
    required_evidence: [artifact_path_or_reference]

  PDF:
    profile: SCOPED_WRITE
    create_or_edit_artifact: allowed_inside_scope
    required_evidence: [artifact_path_or_reference]

  Presentations:
    profile: SCOPED_WRITE
    create_or_edit_artifact: allowed_inside_scope
    required_evidence: [artifact_path_or_reference]

  Spreadsheets:
    profile: SCOPED_WRITE
    create_or_edit_artifact: allowed_inside_scope
    destructive_overwrite: requires_internal_gate
    required_evidence: [artifact_path_or_reference]

global_rules:
  installed_does_not_mean_approved: true
  unavailable_tool_must_not_be_simulated: true
  minimum_necessary_access: true
  evidence_after_every_external_action: true
  human_gate_for_public_financial_legal_destructive_actions: true
  Leo_may_approve_reversible_internal_actions_inside_scope: true
