<style>

.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9ca9c2}.title{font-size:20px;font-weight:800;margin-top:4px}.sub{font-size:12px;color:#aeb9cf;margin-top:4px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn,.chip{border:1px solid var(--line);background:#121c30;color:#ecf2ff;border-radius:12px;min-height:42px;padding:8px 12px;font-weight:650;cursor:pointer}.btn:hover,.chip:hover{border-color:#5571a9}.btn.primary{background:#1a2c51;border-color:#476bb5}.btn:disabled{opacity:.35;cursor:not-allowed}.volume{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#111a2b;padding:6px 9px;border-radius:12px}.volume input{width:82px}.chapters{display:flex;gap:7px;overflow:auto;padding:2px 0 9px}.chip{white-space:nowrap;min-height:36px;padding:6px 10px;font-size:12px}.chip.active{background:#20345d;border-color:#668be2}.progress{height:4px;border-radius:99px;background:#172238;overflow:hidden;margin-bottom:10px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#6f9cff,#9e7cff);transition:width .25s}.stage{position:relative;perspective:2200px;border:1px solid #202b41;border-radius:22px;min-height:650px;background:radial-gradient(circle at 50% 12%,rgba(72,100,160,.17),transparent 48%),linear-gradient(#0b1220,#080d17);overflow:hidden;touch-action:pan-y;outline:none}.desk{position:absolute;left:5%;right:5%;bottom:4%;height:34px;background:radial-gradient(ellipse at center,rgba(0,0,0,.48),transparent 68%);filter:blur(3px);pointer-events:none}.bookWrap{position:absolute;inset:38px 24px 52px;display:grid;place-items:center}.book{position:relative;width:var(--book-w);height:var(--page-h);transform-style:preserve-3d;transition:transform .35s}.book.peekNext{transform:rotateX(1deg) rotateY(-.6deg)}.book.peekPrev{transform:rotateX(1deg) rotateY(.6deg)}.pages{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;transform-style:preserve-3d;filter:drop-shadow(0 28px 25px rgba(0,0,0,.35))}.page{position:relative;min-width:0;background:linear-gradient(90deg,var(--paper),var(--paper2));border:1px solid #cec1a7;color:var(--ink);overflow:hidden}.page.left{border-radius:16px 3px 3px 16px;background:linear-gradient(90deg,var(--paper2),var(--paper))}.page.right{border-radius:3px 16px 16px 3px}.page.blank{opacity:0;pointer-events:none}.pageContent{height:100%;padding:32px 30px 44px;overflow:auto;user-select:text;-webkit-user-select:text;font-size:calc(15px * var(--font-scale));line-height:1.62;font-family:Georgia,serif}.pageContent::-webkit-scrollbar{width:6px}.pageContent::-webkit-scrollbar-thumb{background:#b9ae98;border-radius:99px}.kicker{font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#756e61;margin-bottom:12px}.page h2{font-family:Georgia,serif;font-size:clamp(24px,3vw,36px);line-height:1.08;margin:0 0 15px}.page p{margin:0 0 14px}.callout{border-left:3px solid #607aa8;background:rgba(80,104,145,.08);padding:12px 14px;border-radius:0 10px 10px 0;margin:15px 0;font-size:.92em}.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 10px;border:1px solid rgba(0,0,0,.08);background:rgba(0,0,0,.035);border-radius:10px;font-family:Inter,system-ui,sans-serif;font-size:.88em}.num{width:28px;height:28px;border-radius:50%;background:#263b61;color:#fff;display:grid;place-items:center;font-weight:800}.fact{border:1px solid rgba(0,0,0,.17);background:rgba(255,255,255,.48);color:#28344e;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:750;cursor:pointer;margin:4px 4px 0 0}.folio{position:absolute;bottom:14px;font-family:Inter,system-ui,sans-serif;font-size:10px;letter-spacing:.08em;color:#8a8375}.left .folio{left:26px}.right .folio{right:26px}.spine{position:absolute;z-index:12;left:50%;top:8px;bottom:8px;width:3px;transform:translateX(-1px);background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.2),rgba(0,0,0,.28));box-shadow:0 0 18px rgba(0,0,0,.3);pointer-events:none}.page.left:after,.page.right:before{content:"";position:absolute;top:0;bottom:0;width:36px;pointer-events:none;z-index:5}.page.left:after{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14))}.page.right:before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.15),transparent)}

.coverStyle{height:100%;margin:-32px -30px -44px;padding:44px 38px;background:linear-gradient(145deg,#16233d,#2b4775 65%,#101827);color:#f6f8ff;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:inset 0 0 0 5px rgba(235,210,148,.22),inset 0 0 0 7px rgba(0,0,0,.22)}.coverStyle h2,.coverStyle p{color:#f6f8ff}.coverStyle .kicker{color:#bfd2f7}.coverMark{width:78px;height:78px;border-radius:50%;border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:32px;margin-bottom:28px;box-shadow:inset 0 0 30px rgba(255,255,255,.05)}.backCover{background:linear-gradient(145deg,#101827,#24395d 55%,#111a2b)}
.grip{position:absolute;z-index:40;top:0;bottom:0;width:13%;cursor:grab;touch-action:none}.grip:active{cursor:grabbing}.grip.next{right:0}.grip.prev{left:0}.grip.disabled{pointer-events:none;opacity:0}.grip::after{content:"";position:absolute;width:54px;height:54px;bottom:8px;opacity:0;transition:.18s;pointer-events:none}.grip.next::after{right:8px;border-radius:100% 0 0 0;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(0,0,0,.08))}.grip.prev::after{left:8px;border-radius:0 100% 0 0;background:linear-gradient(225deg,rgba(255,255,255,.42),rgba(0,0,0,.08))}.grip:hover::after,.grip.lift::after{opacity:.7;transform:translateY(-4px)}
.turnLayer{display:none;position:absolute;z-index:30;top:0;bottom:0;width:50%;transform-style:preserve-3d;pointer-events:none}.turnLayer.active{display:block}.turnLayer.next{right:0}.turnLayer.prev{left:0}.slice{position:absolute;top:0;bottom:0;width:5.5556%;transform-style:preserve-3d;will-change:transform;backface-visibility:visible}.sliceFace{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border-top:1px solid #cec1a7;border-bottom:1px solid #cec1a7}.sliceFace.back{transform:rotateY(180deg)}.sliceInner{position:absolute;top:0;bottom:0;width:1800%;overflow:hidden}.sliceInner .slicePage{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(90deg,var(--paper),var(--paper2));color:var(--ink)}.curlShadow{position:absolute;z-index:29;top:0;bottom:0;width:50%;pointer-events:none;opacity:0;filter:blur(7px);transition:opacity .08s}.curlShadow.next{left:50%;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 42%)}.curlShadow.prev{right:50%;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent 42%)}.stage.dragging .dragHint{opacity:0}.dragHint{position:absolute;z-index:60;left:50%;bottom:18px;transform:translateX(-50%);font-size:11px;color:#d9e3f8;background:rgba(11,16,28,.76);border:1px solid rgba(255,255,255,.12);padding:7px 11px;border-radius:999px;pointer-events:none;transition:opacity .2s}.info{margin-top:10px;border:1px solid var(--line);background:#10192a;border-radius:14px;padding:12px 14px;color:#dbe5f8;font-size:13px;line-height:1.5}.bookmarkFlag{position:absolute;z-index:20;right:24px;top:-2px;width:24px;height:62px;background:#b23e53;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);display:none}.bookmarkFlag.on{display:block}.jumping{animation:fan .38s ease}.jumping .stack{filter:blur(.5px)}@keyframes fan{0%{transform:rotateX(0)}40%{transform:rotateX(2deg) scale(.995)}100%{transform:rotateX(0)}}
.contrast .page,.contrast .slicePage{--paper:#fff;--paper2:#fff;--ink:#000}.contrast .pageContent{font-weight:500}
@media(max-width:740px){:root{--page-h:620px}.stage{min-height:690px}.bookWrap{inset:26px 12px 50px}.pages{display:block}.page{display:none;width:100%;height:100%;border-radius:16px!important}.page.mobile{display:block}.spine{display:none}.stack{display:none}.turnLayer{width:100%;left:0!important;right:0!important}.curlShadow{width:100%;left:0!important;right:0!important}.grip{width:18%}.toolbar{align-items:stretch}.controls{width:100%}.controls .btn{flex:1}.volume{flex:1}.chapters{padding-bottom:7px}.pageContent{padding:28px 23px 44px}.coverStyle{margin:-28px -23px -44px;padding:34px 28px}.bookmarkFlag{right:18px}}

<body>
<div id="app">
  <header class="toolbar">
    <div><div class="eyebrow">MCF • V3 Physical Book Engine</div><div class="title">ChatGPT Android — Livro Interativo</div><div class="sub" id="status">Inicializando…</div></div>
    <div class="controls">
      <button class="btn" id="sound">🔊 Som</button>
      <label class="volume">Vol. <input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume"></label>
      <button class="btn" id="fontDown" aria-label="Diminuir texto">A−</button>
      <button class="btn" id="fontUp" aria-label="Aumentar texto">A+</button>
      <button class="btn" id="contrast">◐ Contraste</button>

      <div class="book" id="book">
        <div class="stack leftStack" id="leftStack"></div><div class="stack rightStack" id="rightStack"></div>
        <div class="pages"><article class="page left" id="leftPage"></article><article class="page right" id="rightPage"></article><div class="spine"></div></div>
        <div class="bookmarkFlag" id="bookmarkFlag"></div>
        <div class="curlShadow next" id="curlShadow"></div>
        <div class="turnLayer next" id="turnLayer"></div>
        <div class="grip prev" id="prevGrip" aria-label="Arraste para voltar a página"></div>
        <div class="grip next" id="nextGrip" aria-label="Arraste para avançar a página"></div>
      </div>
    </div>
    <div class="desk"></div><div class="dragHint">Pegue a borda/canto da folha e arraste ↔</div>
  </main>
  <div class="info" id="info">O livro abre na capa. Arraste pela borda direita para começar.</div>
</div>
<script>
(()=>{
const pages=[
 {type:'cover',chapter:'Capa',title:'ChatGPT Android',kicker:'Guia interativo',html:`<div class="coverMark">◎</div><h2>ChatGPT Android</h2><p>Por que o navegador padrão interfere no login — e como configurar corretamente.</p><div class="callout">V3 • Physical Book Engine</div>`},
 {chapter:'Introdução',title:'Como usar este livro',kicker:'Navegação',html:`<h2>Leia como um livro físico</h2><p>O conteúdo é selecionável. Para virar a folha, pegue apenas a <strong>borda</strong> ou o <strong>canto</strong> e arraste.</p><p>A dobra acompanha seu gesto. Se você soltar cedo, a página retorna; passando do limiar, ela completa a virada.</p><button class="fact" data-info="A zona de leitura fica livre para seleção de texto. A zona de manipulação fica restrita às bordas.">Por que só pelas bordas?</button>`},
 {chapter:'Conceito',title:'Por que o navegador importa?',kicker:'Conceito',html:`<h2>O navegador faz parte do login</h2><p>O aplicativo ChatGPT para Android usa um navegador compatível durante o processo de autenticação.</p><div class="callout">Pense nele como uma ponte temporária entre o aplicativo e o sistema de autenticação.</div><button class="fact" data-info="App → navegador → autenticação → retorno ao app. Se a ponte falhar, o fluxo pode não terminar corretamente.">Ver fluxo</button>`},
 {chapter:'Conceito',title:'O que pode dar errado?',kicker:'Dependência',html:`<h2>Uma ponte incompatível quebra o caminho</h2><p>Se não houver navegador compatível instalado ou definido adequadamente, o login pode falhar.</p><p>O sintoma aparece no ChatGPT, mas a causa pode estar na configuração do Android.</p>`},
 {chapter:'Compatibilidade',title:'Chrome e Brave',kicker:'Compatibilidade',html:`<h2>Navegadores compatíveis</h2><div class="steps"><div class="step"><div class="num">✓</div><div><strong>Google Chrome</strong><br>Recomendado.</div></div><div class="step"><div class="num">✓</div><div><strong>Brave</strong><br>Compatível.</div></div><div class="step"><div class="num">!</div><div><strong>Outros</strong><br>Podem causar falhas.</div></div></div>`},
 {chapter:'Compatibilidade',title:'Qual escolher?',kicker:'Decisão',html:`<h2>Chrome é a opção preferencial</h2><p>O Brave também funciona, mas a orientação oficial recomenda o <strong>Google Chrome</strong> como navegador padrão.</p><button class="fact" data-info="Compatível = aceito pelo fluxo. Recomendado = opção priorizada pela orientação oficial.">Compatível × recomendado</button>`},
 {chapter:'Configuração',title:'Como alterar',kicker:'Configuração',html:`<h2>Defina o Chrome como padrão</h2><div class="steps"><div class="step"><div class="num">1</div><div><strong>Configurações</strong></div></div><div class="step"><div class="num">2</div><div><strong>Apps</strong> ou Apps e notificações</div></div><div class="step"><div class="num">3</div><div><strong>Apps padrão</strong></div></div></div>`},
 {chapter:'Configuração',title:'Escolha o navegador',kicker:'Configuração',html:`<h2>Quem abre os links?</h2><div class="steps"><div class="step"><div class="num">4</div><div><strong>App de navegador</strong></div></div><div class="step"><div class="num">5</div><div><strong>Chrome</strong></div></div></div><div class="callout">Em alguns aparelhos, “Apps padrão” fica dentro de “Avançado”.</div>`},
 {chapter:'Autenticação',title:'Fluxo simplificado',kicker:'Autenticação',html:`<h2>App → navegador → app</h2><div class="steps"><div class="step"><div class="num">A</div><div>O ChatGPT inicia o login.</div></div><div class="step"><div class="num">B</div><div>O navegador conduz a autenticação.</div></div><div class="step"><div class="num">C</div><div>O fluxo retorna ao aplicativo.</div></div></div>`},
 {chapter:'Problemas',title:'Chrome não aparece',kicker:'Solução de problemas',html:`<h2>Verifique a instalação</h2><p>Se o Chrome não aparecer como opção, confirme se ele está instalado no dispositivo.</p><div class="callout">A orientação é verificar pela Google Play Store.</div>`},
 {chapter:'Problemas',title:'MIUI e One UI',kicker:'Interfaces personalizadas',html:`<h2>O caminho pode mudar</h2><p>Algumas interfaces Android reorganizam os menus.</p><div class="steps"><div class="step"><div class="num">1</div><div>Configurações → Apps → Gerenciar apps</div></div><div class="step"><div class="num">2</div><div>Abra o navegador padrão atual.</div></div><div class="step"><div class="num">3</div><div>Use <strong>Limpar padrões</strong> e tente novamente.</div></div></div>`},
 {chapter:'Diagnóstico',title:'Diagnóstico rápido',kicker:'Interativo',html:`<h2>Qual é seu cenário?</h2><button class="fact" data-info="Se o Chrome já é padrão, a configuração central recomendada está correta.">Chrome já é padrão</button><button class="fact" data-info="Brave é compatível. Confirme se está definido como padrão.">Uso Brave</button><button class="fact" data-info="Outro navegador pode ser a causa. Teste o Chrome como padrão.">Uso outro navegador</button><button class="fact" data-info="Se o Chrome não aparece, verifique primeiro a instalação pela Play Store.">Chrome não aparece</button>`},
 {chapter:'Resumo',title:'Resumo final',kicker:'Conclusão',html:`<h2>O essencial em quatro pontos</h2><div class="steps"><div class="step"><div class="num">1</div><div>O login depende de navegador compatível.</div></div><div class="step"><div class="num">2</div><div>Chrome é recomendado; Brave é compatível.</div></div><div class="step"><div class="num">3</div><div>Outros podem causar erro.</div></div><div class="step"><div class="num">4</div><div>Redefina o navegador padrão quando necessário.</div></div></div>`},
 {chapter:'Fontes',title:'Fonte e versão',kicker:'Referência',html:`<h2>Fonte do conteúdo</h2><p>Conteúdo educacional baseado no artigo oficial da Central de Ajuda da OpenAI sobre definir o Google Chrome como navegador padrão para o app ChatGPT no Android.</p><div class="callout">Esta V3 testa a experiência física do livro: page curl segmentado, gestos, áudio, pilhas de páginas, marcador e acessibilidade.</div><p><strong>Versão do protótipo:</strong> V3 / 2026-09-14</p>`},
 {type:'back',chapter:'Fim',title:'Fim',kicker:'Contracapa',html:`<div class="coverMark">✓</div><h2>Fim da leitura</h2><p>Protótipo V3 pronto para validação da experiência.</p><div class="callout">A publicação externa continua bloqueada até autorização humana.</div>`}
];
const N=18, app=document.getElementById('app'), stage=document.getElementById('stage'), book=document.getElementById('book'), left=document.getElementById('leftPage'), right=document.getElementById('rightPage'), layer=document.getElementById('turnLayer'), shadow=document.getElementById('curlShadow'), prevGrip=document.getElementById('prevGrip'), nextGrip=document.getElementById('nextGrip'), progress=document.getElementById('progress'), status=document.getElementById('status'), info=document.getElementById('info'), leftStack=document.getElementById('leftStack'), rightStack=document.getElementById('rightStack'), bookmarkFlag=document.getElementById('bookmarkFlag');
let index=Number(localStorage.getItem('ibv3:last')||0), gesture=null, flip=null, busy=false, soundOn=true, audioCtx=null, master=null, rustle=null, fontScale=Number(localStorage.getItem('ibv3:font')||1), bookmark=Number(localStorage.getItem('ibv3:bookmark')||-1), contrastOn=localStorage.getItem('ibv3:contrast')==='1';
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
const mobile=()=>matchMedia('(max-width:740px)').matches;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const step=()=>mobile()?1:2;
function pageBody(i){const p=pages[i];if(!p)return'';const body=`<div class="kicker">${p.kicker}</div>${p.html}`;if(p.type==='cover')return `<div class="coverStyle">${body}</div>`;if(p.type==='back')return `<div class="coverStyle backCover">${body}</div>`;return body}
function markup(i){if(i<0||i>=pages.length)return'';return `<div class="pageContent">${pageBody(i)}</div><div class="folio">${i+1} / ${pages.length}</div>`}
function normalize(){index=clamp(index,0,pages.length-1);if(!mobile()&&index>0&&index<pages.length-1&&index%2===0)index-=1}
function isClosed(){return index===0} function isBack(){return index===pages.length-1}
function render(){normalize();document.documentElement.style.setProperty('--font-scale',fontScale);app.classList.toggle('contrast',contrastOn);bookmarkFlag.classList.toggle('on',bookmark===index);const s=step();
 if(mobile()){left.className='page left mobile';right.className='page right';left.innerHTML=markup(index);right.innerHTML='';}
 else if(isClosed()){left.className='page left blank';right.className='page right';left.innerHTML='';right.innerHTML=markup(0);}
 else if(isBack()){left.className='page left blank';right.className='page right';left.innerHTML='';right.innerHTML=markup(index);}
 else{left.className='page left';right.className='page right';left.innerHTML=markup(index);right.innerHTML=markup(index+1)}
 const shown=isClosed()||isBack()?1:Math.min(s,pages.length-index);status.textContent=isClosed()?'Capa fechada':isBack()?'Contracapa':mobile()?`Página ${index+1} de ${pages.length}`:`Páginas ${index+1}–${Math.min(index+2,pages.length)} de ${pages.length}`;progress.style.width=((index+shown)/pages.length*100)+'%';
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===pages.length-1;prevGrip.classList.toggle('disabled',index===0);nextGrip.classList.toggle('disabled',index===pages.length-1);localStorage.setItem('ibv3:last',String(index));updateStacks();updateChapters();}
function updateStacks(){const ratio=index/(pages.length-1);leftStack.style.width=(4+ratio*18)+'px';rightStack.style.width=(4+(1-ratio)*18)+'px'}
function chapterTarget(name){const i=pages.findIndex(p=>p.chapter===name);return i<0?0:i}
const chapterNames=[...new Set(pages.map(p=>p.chapter))];const chapters=document.getElementById('chapters');chapterNames.forEach(name=>{const b=document.createElement('button');b.className='chip';b.textContent=name;b.dataset.target=chapterTarget(name);b.onclick=()=>jumpTo(Number(b.dataset.target));chapters.appendChild(b)});
function updateChapters(){[...chapters.children].forEach(b=>b.classList.toggle('active',pages[index]?.chapter===b.textContent))}
function target(dir){if(dir==='next'){if(index===0)return 1;if(mobile())return Math.min(index+1,pages.length-1);return Math.min(index+2,pages.length-1)}else{if(index<=1)return 0;if(mobile())return index-1;return Math.max(1,index-2)}}
function can(dir){return dir==='next'?index<pages.length-1:index>0}
function buildSlices(dir,to){layer.innerHTML='';layer.className='turnLayer active '+dir;shadow.className='curlShadow '+dir;const frontIndex=dir==='next'?(index===0?0:(mobile()?index:index+1)):(mobile()?index:index);const backIndex=dir==='next'?to:(mobile()?to:(to===0?0:to+1));
 for(let i=0;i<N;i++){const sl=document.createElement('div');sl.className='slice';sl.style.left=(i*100/N)+'%';const front=document.createElement('div'),back=document.createElement('div');front.className='sliceFace front';back.className='sliceFace back';front.innerHTML=`<div class="sliceInner" style="left:-${i*100}%"><div class="slicePage"><div class="pageContent">${pageBody(frontIndex)}</div></div></div>`;back.innerHTML=`<div class="sliceInner" style="left:-${i*100}%"><div class="slicePage"><div class="pageContent">${pageBody(backIndex)}</div></div></div>`;sl.append(front,back);layer.appendChild(sl)} }
function prep(dir){if(!can(dir))return false;const to=target(dir);flip={dir,to,p:0};buildSlices(dir,to);if(mobile()){left.innerHTML=markup(to)}else if(dir==='next'){if(index===0){left.className='page left';left.innerHTML=markup(1);right.innerHTML=markup(2)}else{right.innerHTML=markup(Math.min(to+1,pages.length-1))}}else{if(to===0){left.className='page left blank';left.innerHTML='';right.innerHTML=markup(0)}else{left.innerHTML=markup(to)}}startRustle();return true}
function applyCurl(p,speed=0){if(!flip)return;p=clamp(p);flip.p=p;const slices=[...layer.children];slices.forEach((sl,i)=>{const x=i/(N-1);const lead=flip.dir==='next'?x:1-x;const lp=clamp((p-(1-lead)*.17)/.83);const angle=(flip.dir==='next'?-180:180)*lp;const bow=Math.sin(Math.PI*lp)*18*(flip.dir==='next'?-1:1);const lift=Math.sin(Math.PI*lp)*7;sl.style.transform=`translateX(${bow}px) translateZ(${lift}px) rotateY(${angle}deg)`;sl.style.filter=`brightness(${1-.13*Math.sin(Math.PI*lp)})`;});shadow.style.opacity=String(Math.sin(Math.PI*p)*.9);updateRustle(speed,p)}
function cleanup(commit){if(commit)index=flip.to;flip=null;layer.className='turnLayer next';layer.innerHTML='';shadow.style.opacity='0';stage.classList.remove('dragging');busy=false;stopRustle(commit);render();if(commit&&isBack())playClose()}
function settle(commit){if(!flip)return;const start=flip.p,end=commit?1:0,dur=reduced?1:Math.max(130,320*Math.abs(end-start)),t0=performance.now();function frame(t){if(!flip)return;const q=clamp((t-t0)/dur),e=1-Math.pow(1-q,3);applyCurl(start+(end-start)*e,.45);if(q<1)requestAnimationFrame(frame);else cleanup(commit)}requestAnimationFrame(frame)}
function animate(dir){if(busy||!can(dir))return;unlockAudio();busy=true;if(!prep(dir)){busy=false;return}const t0=performance.now(),dur=reduced?1:620;function frame(t){if(!flip)return;const q=clamp((t-t0)/dur),e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;applyCurl(e,.7);if(q<1)requestAnimationFrame(frame);else cleanup(true)}requestAnimationFrame(frame)}
function gestureWidth(){return mobile()?book.clientWidth:book.clientWidth/2}
function startGesture(e,dir){if(busy||!can(dir))return;unlockAudio();busy=true;gesture={id:e.pointerId,dir,startX:e.clientX,lastX:e.clientX,lastT:performance.now(),p:0};stage.classList.add('dragging');book.classList.remove('peekNext','peekPrev');prep(dir);try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}}
function moveGesture(e){if(!gesture||gesture.id!==e.pointerId||!flip)return;const dx=e.clientX-gesture.startX,signed=gesture.dir==='next'?-dx:dx,p=clamp(signed/gestureWidth()),now=performance.now(),speed=Math.abs(e.clientX-gesture.lastX)/Math.max(8,now-gesture.lastT);gesture.p=p;applyCurl(p,speed);gesture.lastX=e.clientX;gesture.lastT=now}
function endGesture(e){if(!gesture||gesture.id!==e.pointerId)return;const commit=gesture.p>=.35;gesture=null;settle(commit)}
[nextGrip,prevGrip].forEach(g=>{const dir=g===nextGrip?'next':'prev';g.addEventListener('pointerdown',e=>startGesture(e,dir));g.addEventListener('pointermove',moveGesture);g.addEventListener('pointerup',endGesture);g.addEventListener('pointercancel',endGesture);g.addEventListener('pointerenter',()=>{if(!busy){book.classList.add(dir==='next'?'peekNext':'peekPrev');g.classList.add('lift');playHover()}});g.addEventListener('pointerleave',()=>{if(!gesture){book.classList.remove('peekNext','peekPrev');g.classList.remove('lift')}})});
function jumpTo(to){if(busy||to===index)return;unlockAudio();playFan();book.classList.add('jumping');setTimeout(()=>{index=to;render();book.classList.remove('jumping')},reduced?1:360)}
stage.addEventListener('click',e=>{const f=e.target.closest('.fact');if(f){playClick();info.textContent=f.dataset.info||'Informação complementar.'}});stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();animate('next')}if(e.key==='ArrowLeft'){e.preventDefault();animate('prev')}});
document.getElementById('next').onclick=()=>animate('next');document.getElementById('prev').onclick=()=>animate('prev');
document.getElementById('bookmark').onclick=()=>{bookmark=bookmark===index?-1:index;if(bookmark<0)localStorage.removeItem('ibv3:bookmark');else localStorage.setItem('ibv3:bookmark',String(bookmark));bookmarkFlag.classList.toggle('on',bookmark===index);playClick();info.textContent=bookmark<0?'Marcador removido.':`Página ${index+1} marcada.`};
const savedBookmark=Number(localStorage.getItem('ibv3:bookmark')||-1);if(savedBookmark>=0)bookmark=savedBookmark;
document.getElementById('fontUp').onclick=()=>{fontScale=clamp(fontScale+.08,.86,1.28);localStorage.setItem('ibv3:font',fontScale);render();playClick()};document.getElementById('fontDown').onclick=()=>{fontScale=clamp(fontScale-.08,.86,1.28);localStorage.setItem('ibv3:font',fontScale);render();playClick()};document.getElementById('contrast').onclick=()=>{contrastOn=!contrastOn;localStorage.setItem('ibv3:contrast',contrastOn?'1':'0');render();playClick()};
function AC(){return window.AudioContext||window.webkitAudioContext}function unlockAudio(){if(!soundOn)return null;if(!audioCtx){const C=AC();if(!C)return null;audioCtx=new C();master=audioCtx.createGain();master.gain.value=Number(document.getElementById('volume').value)/100;master.connect(audioCtx.destination)}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}
document.getElementById('volume').oninput=e=>{if(master)master.gain.setTargetAtTime(Number(e.target.value)/100,audioCtx.currentTime,.02)};document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 Som':'🔇 Mudo';if(soundOn){unlockAudio();playClick()}else stopRustle(false)};
function noiseBuffer(){const c=unlockAudio();if(!c)return null;const b=c.createBuffer(1,Math.floor(c.sampleRate*.8),c.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=last*.64+w*.36;d[i]=last}return b}
function tone(freq,dur,vol,end=freq){const c=unlockAudio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.frequency.setValueAtTime(freq,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),n+dur);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.008);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g).connect(master);o.start(n);o.stop(n+dur+.02)}
function burst(dur=.1,vol=.06,freq=1600){const c=unlockAudio();if(!c)return;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),n=c.currentTime;s.buffer=noiseBuffer();f.type='bandpass';f.frequency.value=freq;f.Q.value=.7;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol,n+.007);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.connect(f).connect(g).connect(master);s.start(n);s.stop(n+dur+.03)}
function startRustle(){const c=unlockAudio();if(!c||rustle)return;const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noiseBuffer();s.loop=true;f.type='bandpass';f.frequency.value=1500;f.Q.value=.55;g.gain.value=.0001;s.connect(f).connect(g).connect(master);s.start();rustle={s,f,g}}
function updateRustle(speed,p){if(!rustle||!audioCtx)return;const n=audioCtx.currentTime,v=.004+Math.min(1.8,speed)*.018+Math.sin(Math.PI*p)*.009;rustle.g.gain.setTargetAtTime(Math.min(.055,v),n,.025);rustle.f.frequency.setTargetAtTime(900+p*2300,n,.04)}function stopRustle(drop){if(rustle&&audioCtx){const r=rustle;rustle=null;const n=audioCtx.currentTime;r.g.gain.setTargetAtTime(.0001,n,.02);try{r.s.stop(n+.09)}catch(_){}}if(drop){setTimeout(()=>{burst(.08,.065,1250);tone(118,.07,.025,78)},35)}}
function playClick(){tone(630,.045,.018,760)}function playHover(){if(soundOn)tone(340,.025,.008,420)}function playFan(){burst(.16,.035,1900)}function playClose(){burst(.15,.05,850);tone(92,.15,.03,58)}
window.addEventListener('resize',()=>{if(!busy)render()});
render();
})();
