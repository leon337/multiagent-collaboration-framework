<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clínica Agenda — R2</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}.side{width:230px;background:#101827;color:#fff;padding:24px 16px}.brand{font-size:20px;font-weight:800;margin-bottom:30px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b9c3d4;padding:12px;border-radius:10px;margin:5px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#263449;color:#fff}.main{flex:1;padding:28px;max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.muted{color:#69758a}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel,.item{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:18px}.num{font-size:30px;font-weight:800;margin-top:8px}.panel{margin-top:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.btn{border:0;background:#315efb;color:#fff;padding:10px 15px;border-radius:9px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef2f8;color:#263247}.btn.danger{background:#e5484d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0f4}.badge{padding:5px 9px;border-radius:99px;background:#e8efff;color:#315efb;font-size:12px;font-weight:700}.badge.cancelled{background:#feecef;color:#c92b43}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d8dee8;border-radius:9px;margin-top:5px;background:#fff}.full{grid-column:1/-1}.empty{text-align:center;padding:35px;color:#788398}.notice{margin:14px 0;padding:12px;border-radius:10px;background:#eef7ff;color:#1c5a9c}.error{background:#fff0f1;color:#a82132}.success{background:#edf9f0;color:#216b32}.modal{position:fixed;inset:0;background:#0b122080;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;width:min(700px,100%);border-radius:18px;padding:24px}.hidden{display:none}@media(max-width:900px){.side{width:180px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{width:100%}.main{padding:16px}.cards,.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">🏥 Clínica Agenda</div><div class="nav">
<button data-page="dashboard" class="active">Dashboard</button><button data-page="agenda">Agenda</button><button data-page="patients">Pacientes</button><button data-page="professionals">Profissionais</button><button data-page="services">Serviços</button>
</div><div style="margin-top:35px;font-size:12px;color:#8e9bb0">MVP R2 • PostgreSQL</div></aside>
<main class="main"><div id="app"></div></main>
</div><div id="modal" class="hidden"></div>
<script>
const app=document.getElementById("app"),modal=document.getElementById("modal");
let state={patients:[],professionals:[],services:[],appointments:[],loading:false,error:null};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
const name=(xs,id)=>xs.find(x=>x.id===id)?.name||"—";
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"content-type":"application/json",...(opts.headers||{})}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(b?.error?.message||"Falha na API"),{code:b?.error?.code,status:r.status});return b.data}
async function loadLists(){state.loading=true;state.error=null;render("dashboard");try{[state.patients,state.professionals,state.services]=await Promise.all([api("/api/v1/patients"),api("/api/v1/professionals"),api("/api/v1/services")]);state.loading=false;render(location.hash.slice(1)||"dashboard")}catch(e){state.loading=false;state.error=e.message;render(location.hash.slice(1)||"dashboard")}}
async function loadSchedule(){const p=state.professionals[0]?.id;if(!p){state.appointments=[];return}state.appointments=await api("/api/v1/schedule?professionalId="+encodeURIComponent(p)+"&localDate="+today())}
function layout(title,body,action=""){return '<div class="top"><div><h1>'+title+'</h1><div class="muted">Sistema de agendamento R2.</div></div>'+action+'</div>'+body}
function notice(){if(state.loading)return '<div class="notice">Carregando dados…</div>';if(state.error)return '<div class="notice error">'+esc(state.error)+'</div>';return ""}
async function dashboard(){try{await loadSchedule()}catch(e){state.error=e.message}return layout("Visão geral",notice()+'<div class="cards"><div class="card">Pacientes<div class="num">'+state.patients.length+'</div></div><div class="card">Profissionais<div class="num">'+state.professionals.length+'</div></div><div class="card">Serviços<div class="num">'+state.services.length+'</div></div><div class="card">Hoje<div class="num">'+state.appointments.length+'</div></div></div><div class="panel"><h2>Agenda de hoje</h2>'+agendaTable(state.appointments)+'</div>','<button class="btn" onclick="openAppointment()">+ Novo agendamento</button>')}
function agendaTable(list){if(!list.length)return '<div class="empty">Nenhum agendamento para a data selecionada.</div>';return '<table class="table"><tr><th>Início</th><th>Paciente</th><th>Profissional</th><th>Serviço</th><th>Status</th><th>Ações</th></tr>'+list.map(a=>'<tr><td>'+fmt(a.start_at_utc)+'</td><td>'+esc(name(state.patients,a.patient_id))+'</td><td>'+esc(name(state.professionals,a.professional_id))+'</td><td>'+esc(name(state.services,a.service_id))+'</td><td><span class="badge">'+a.status+'</span></td><td>'+actions(a)+'</td></tr>').join("")+'</table>'}
function actions(a){if(a.status==="CANCELLED"||a.status==="COMPLETED")return "—";return '<button class="btn secondary" onclick="reschedule(\''+a.id+'\')">Reagendar</button> <button class="btn danger" onclick="cancelA(\''+a.id+'\')">Cancelar</button>'}
async function agenda(){return layout("Agenda",notice()+'<div class="panel"><div class="toolbar"><label>Profissional<select id="profFilter">'+state.professionals.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select></label><label>Data<input id="dateFilter" type="date" value="'+today()+'"></label><button class="btn" onclick="filterSchedule()">Consultar</button><button class="btn secondary" onclick="openAppointment()">Novo</button></div><div id="agendaResult" style="margin-top:18px">'+agendaTable(state.appointments)+'</div></div>')}
async function filterSchedule(){const p=document.getElementById("profFilter").value,d=document.getElementById("dateFilter").value;const result=document.getElementById("agendaResult");result.innerHTML='<div class="notice">Carregando…</div>';try{const list=await api("/api/v1/schedule?professionalId="+encodeURIComponent(p)+"&localDate="+encodeURIComponent(d));result.innerHTML=agendaTable(list)}catch(e){result.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function listPage(title,items,kind){return layout(title,notice()+'<div class="grid">'+(items.length?items.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+(kind==="service"?esc(x.duration_minutes)+" min":"Clínica")+'</div></div>').join(""):'<div class="empty">Nenhum registro.</div>')+'</div>','<button class="btn" onclick="openForm(\''+kind+'\')">+ Cadastrar</button>')}
function patients(){return listPage("Pacientes",state.patients,"patient")}
function professionals(){return listPage("Profissionais",state.professionals,"professional")}
function services(){return listPage("Serviços",state.services,"service")}
function render(page){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));let v=page==="agenda"?agenda:page==="patients"?patients:page==="professionals"?professionals:page==="services"?services:dashboard;Promise.resolve(v()).then(x=>app.innerHTML=x)}
function openForm(kind){const cfg={patient:["Paciente","Nome"],professional:["Profissional","Nome"],service:["Serviço","Nome"]}[kind];modal.className="modal";modal.innerHTML='<div class="modalbox"><h2>Novo '+cfg[0]+'</h2><form id="form" class="form"><label class="full">'+cfg[1]+'<input name="name" required></label>'+(kind==="service"?'<label>Duração (min)<input name="durationMinutes" type="number" min="1" value="30" required></label>':'')+'<div class="full"><button class="btn">Salvar</button> <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button></div></form></div>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(kind==="service")data.durationMinutes=Number(data.durationMinutes);try{await api("/api/v1/"+(kind==="patient"?"patients":kind==="professional"?"professionals":"services"),{method:"POST",body:JSON.stringify(data)});closeModal();await loadLists()}catch(err){document.querySelector(".modalbox").insertAdjacentHTML("afterbegin",'<div class="notice error">'+esc(err.message)+'</div>')}}}
function openAppointment(){modal.className="modal";modal.innerHTML='<div class="modalbox"><h2>Novo agendamento</h2><form id="form" class="form"><label>Paciente<select name="patientId" required>'+state.patients.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Profissional<select name="professionalId" required>'+state.professionals.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select></label><label>Serviço<select name="serviceId" required>'+state.services.map(x=>'<option value="'+x.id+'">'+esc(x.name)+" • "+x.duration_minutes+" min</option>").join("")+'</select></label><label>Data<input type="date" name="date" value="'+today()+'" required></label><label>Hora<input type="time" name="time" value="09:00" required></label><div class="full"><button class="btn">Agendar</button> <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button></div></form></div>';document.getElementById("form").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api("/api/v1/appointments",{method:"POST",body:JSON.stringify({patientId:d.patientId,professionalId:d.professionalId,serviceId:d.serviceId,startAt:new Date(d.date+"T"+d.time+":00").toISOString()})});closeModal();await loadLists();location.hash="agenda";render("agenda")}catch(err){document.querySelector(".modalbox").insertAdjacentHTML("afterbegin",'<div class="notice error">'+esc(err.code?err.code+": ":"")+esc(err.message)+'</div>')}}}
async function cancelA(id){if(!confirm("Cancelar este agendamento?"))return;try{await api("/api/v1/appointments/"+id+"/cancel",{method:"POST",body:JSON.stringify({reason:"Cancelado pela clínica"})});await loadLists();render("agenda")}catch(e){alert(e.message)}}
async function reschedule(id){const date=prompt("Nova data (AAAA-MM-DD):",today());if(!date)return;const time=prompt("Novo horário (HH:MM):","10:00");if(!time)return;try{await api("/api/v1/appointments/"+id+"/reschedule",{method:"POST",body:JSON.stringify({newStartAt:new Date(date+"T"+time+":00").toISOString()})});await loadLists();render("agenda")}catch(e){alert(e.code?e.code+": "+e.message:e.message)}}
function closeModal(){modal.className="hidden";modal.innerHTML=""}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.page;render(b.dataset.page)})
loadLists();
</script>
</body></html>
