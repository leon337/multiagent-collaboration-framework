<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCF World Projection v0.1</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0b0f15;color:#eef2f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:2px}.app{max-width:1400px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid #2b3647;padding-bottom:14px}.top h1{margin:3px 0;font-size:clamp(28px,4vw,50px)}.ey{font-size:11px;letter-spacing:.12em;color:#94a2b7;font-weight:800}.flag,.badge{border:1px solid #697a92;border-radius:999px;padding:5px 8px;font-size:11px}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#94a2b7;padding:10px 0}.tabs{display:flex;gap:8px;margin:8px 0 16px}.tabs button{background:transparent;border:1px solid #2b3647;border-radius:999px;padding:8px 13px;cursor:pointer}.tabs button.on{background:#eef2f8;color:#0b0f15}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.panel{border:1px solid #2b3647;background:#121924;border-radius:13px;padding:16px}.inspector{position:sticky;top:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.row{border:1px solid #2b3647;background:#17202c;border-radius:10px;padding:12px}.muted{color:#94a2b7}.entity{background:transparent;border:1px solid #3b4a61;border-radius:8px;padding:8px;text-align:left;cursor:pointer}.entity small{display:block;color:#94a2b7}.timeline{list-style:none;padding:0}.timeline li{display:grid;grid-template-columns:160px 1fr;gap:10px;margin-bottom:10px}.timeline button{background:#17202c;border:1px solid #2b3647;border-radius:9px;text-align:left;padding:10px;cursor:pointer}.linear{display:grid;gap:8px}.linear .row{display:grid;grid-template-columns:220px 1fr auto;gap:10px;align-items:center}.graph{position:relative;height:580px;border:1px solid #2b3647;border-radius:10px;overflow:hidden;background:#0e141d}.graph svg{position:absolute;inset:0;width:100%;height:100%}.graph line{stroke:#45536b;stroke-width:1.5}.node{position:absolute;transform:translate(-50%,-50%);width:130px;background:#182231;border:1px solid #60708a;border-radius:9px;padding:8px;cursor:pointer;text-align:left}.node.sel{border:3px solid white}.node small{display:block;color:#94a2b7}.fresh:before{content:"✓ "}.stale:before{content:"△ "}.unknown:before{content:"? "}dl{display:grid;grid-template-columns:95px 1fr;gap:7px}dt{color:#94a2b7}dd{margin:0;overflow-wrap:anywhere}code{font-size:12px}.rels{padding-left:18px}.rels li{margin:6px 0}input{background:#0e141d;border:1px solid #2b3647;border-radius:8px;padding:9px;width:min(340px,100%)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.inspector{position:static}.cards{grid-template-columns:1fr}.linear .row{grid-template-columns:1fr}.timeline li{grid-template-columns:1fr}.graph{height:720px}.top{align-items:start;flex-direction:column}}
</style></head><body><div id="app" class="app"></div>
<script type="module">
const data=await fetch("./fixture.json",{cache:"no-store"}).then(r=>r.json());
const byId=new Map(data.entities.map(e=>[e.id,e]));
if(byId.size!==data.entities.length) throw new Error("duplicate_entity");
for(const e of data.entities) if(!e.canonicalRef) throw new Error("missing_canonical_ref");
for(const r of data.relations) if(!byId.has(r.from)||!byId.has(r.to)) throw new Error("broken_relation");
const state={view:"cockpit",selected:"mission:world",q:""};
const app=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=e=>'<span class="badge '+e.freshness.toLowerCase()+'">'+esc(e.freshness)+" · "+esc(e.state)+"</span>";
const btn=e=>'<button class="entity" data-sel="'+esc(e.id)+'"><small>'+esc(e.kind)+'</small><strong>'+esc(e.label)+'</strong></button>';
function rels(id){return data.relations.filter(r=>r.from===id||r.to===id)}
function inspector(){const e=byId.get(state.selected)||byId.get("mission:world");return '<aside class="panel inspector"><div class="ey">SELEÇÃO</div><h2>'+esc(e.label)+'</h2>'+badge(e)+'<p>'+esc(e.summary)+'</p><dl><dt>WorldRef</dt><dd><code>'+esc(e.id)+'</code></dd><dt>Kind</dt><dd>'+esc(e.kind)+'</dd><dt>Canonical</dt><dd><code>'+esc(e.canonicalRef)+'</code></dd><dt>Trust</dt><dd>'+esc(e.trust)+'</dd></dl><h3>Relações</h3><ul class="rels">'+rels(e.id).map(r=>{const pid=r.from===e.id?r.to:r.from,p=byId.get(pid);return '<li><code>'+esc(r.type)+'</code> '+(p?btn(p):esc(pid))+'</li>'}).join("")+'</ul></aside>'}
function baseline(){const q=state.q.toLowerCase(),items=data.entities.filter(e=>!q||[e.label,e.kind,e.summary,e.canonicalRef].some(v=>String(v).toLowerCase().includes(q)));return '<section class="panel"><div class="ey">CONDIÇÃO A</div><h2>Baseline linear</h2><input id="q" aria-label="Buscar entidade" placeholder="Buscar entidade…" value="'+esc(state.q)+'"><p class="muted">Mesmo dataset, navegação por lista e busca.</p><div class="linear">'+items.map(e=>'<div class="row">'+btn(e)+'<span>'+esc(e.summary)+'</span>'+badge(e)+'</div>').join("")+'</div></section>'}
function cockpit(){const m=byId.get("mission:world"),last=data.events.at(-1),unk=data.entities.filter(e=>e.freshness==="UNKNOWN").length,st=data.entities.filter(e=>e.freshness==="STALE").length;return '<section class="panel"><div class="ey">CONDIÇÃO B · AGORA</div><h2>Cockpit</h2><div class="cards"><div class="card"><div class="ey">MISSÃO</div>'+btn(m)+'<p>'+badge(m)+'</p></div><div class="card"><div class="ey">ÚLTIMO EVENTO</div><strong>'+esc(last.type)+'</strong><p>'+esc(last.summary)+'</p></div><div class="card"><div class="ey">INCERTEZA</div><strong>'+unk+' UNKNOWN · '+st+' STALE</strong><p>Incerteza nunca vira sucesso presumido.</p></div></div><h3>Equipe</h3>'+["agent:leonardo","agent:laura","agent:sofia","agent:emily"].map(id=>btn(byId.get(id))).join(" ")+'</section>'}
function timeline(){return '<section class="panel"><div class="ey">CAUSALIDADE TEMPORAL</div><h2>Timeline</h2><ol class="timeline">'+data.events.map(ev=>'<li><time>'+esc(ev.at)+'</time><button data-sel="'+esc(ev.subject)+'"><small>'+esc(ev.type)+'</small><strong>'+esc(byId.get(ev.subject)?.label||ev.subject)+'</strong><p>'+esc(ev.summary)+'</p></button></li>').join("")+'</ol></section>'}
const pos={"project:mcf":[12,12],"mission:world":[42,12],"agent:mestre":[72,10],"agent:leonardo":[15,42],"agent:laura":[35,47],"agent:sofia":[58,44],"agent:emily":[80,42],"artifact:wpp":[58,72],"gate:read-only":[81,72],"effect:pr380":[90,15],"evidence:rebuild":[28,90],"gate:future":[86,91]};
function graph(){const lines=data.relations.map(r=>{const a=pos[r.from],b=pos[r.to];return '<line x1="'+a[0]+'%" y1="'+a[1]+'%" x2="'+b[0]+'%" y2="'+b[1]+'%"><title>'+esc(r.type)+'</title></line>'}).join("");const nodes=data.entities.map(e=>{const p=pos[e.id]||[50,50];return '<button class="node '+(e.id===state.selected?'sel':'')+'" data-sel="'+esc(e.id)+'" style="left:'+p[0]+'%;top:'+p[1]+'%"><small>'+esc(e.kind)+'</small><strong>'+esc(e.label)+'</strong><small>'+esc(e.freshness)+'</small></button>'}).join("");return '<section class="panel"><div class="ey">RELAÇÕES TIPADAS · FOCO</div><h2>Grafo</h2><p class="muted">Layout é apresentação; relações vêm do fixture.</p><div class="graph"><svg aria-hidden="true">'+lines+'</svg>'+nodes+'</div></section>'}
function surface(){return state.view==="baseline"?baseline():state.view==="timeline"?timeline():state.view==="graph"?graph():cockpit()}
function render(){app.innerHTML='<header class="top"><div><div class="ey">MCF-WORLD-PROJECTION-001</div><h1>World Projection v0.1</h1></div><div class="flag">REPRESENTATIVE FIXTURE · READ-ONLY</div></header><div class="meta"><span>'+esc(data.sourceRevision)+'</span><span>'+esc(data.observedAt)+'</span><span>'+data.entities.length+' entidades</span></div><nav class="tabs">'+[["baseline","Baseline"],["cockpit","Cockpit"],["timeline","Timeline"],["graph","Grafo"]].map(v=>'<button class="'+(state.view===v[0]?'on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>').join("")+'</nav><main class="layout">'+surface()+inspector()+'</main>';app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});app.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.sel;render()});const q=app.querySelector("#q");if(q)q.oninput=e=>{state.q=e.target.value;render();requestAnimationFrame(()=>{const n=app.querySelector("#q");n?.focus();n?.setSelectionRange(state.q.length,state.q.length)})}}
render();
</script></body></html>
