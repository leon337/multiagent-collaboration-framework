<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Projection v0.2 — Focused Comprehension</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#0b0f14;color:#eef3f8}body{margin:0}.w{max-width:1000px;margin:auto;padding:22px}.p{background:#111923;border:1px solid #2a3848;border-radius:14px;padding:18px;margin-bottom:14px}button{font:inherit;color:inherit;background:#1a2734;border:1px solid #42556c;border-radius:9px;padding:10px 14px}.answers label{display:block;border:1px solid #2d3b4c;border-radius:9px;padding:10px;margin:8px 0}.r{white-space:pre-wrap;overflow:auto;background:#080c11;padding:12px;border-radius:9px}.muted{color:#94a4b8}</style></head>
<body><div class="w"><div class="p"><div class="muted">FOCUSED TEST · v0.2</div><h1>Estado, UNKNOWN e STALE</h1><p>Teste curto. O resultado é salvo imediatamente no armazenamento local deste navegador e continua disponível após recarregar a página.</p><button id="start">Iniciar teste</button><button id="last">Ver último resultado</button></div><div id="app"></div></div>
<script type="module">
const data=await fetch("./fixture.json",{cache:"no-store"}).then(r=>r.json()), byId=new Map(data.entities.map(e=>[e.id,e]));let run=null;const app=document.querySelector("#app");
const qs=[
 {q:"Qual é o estado atual da missão?",a:"WORKING",opts:["WORKING","COMPLETED","UNKNOWN","STALE"]},
 {q:"Qual item ainda NÃO foi confirmado?",a:"Rebuild proof",opts:["Draft PR #380","Rebuild proof","Emily Gate","MCF"]},
 {q:"UNKNOWN quer dizer:",a:"Ainda não conseguimos confirmar",opts:["Está errado","Ainda não conseguimos confirmar","Já sabemos mas pode ter mudado","Foi concluído"]},
 {q:"Qual item pode estar desatualizado?",a:"Gate futuro",opts:["Gate futuro","Rebuild proof","Draft PR #380","WPP v0.1"]},
 {q:"STALE quer dizer:",a:"Já sabíamos, mas pode ter mudado",opts:["Nunca soubemos","Já sabíamos, mas pode ter mudado","Está confirmado agora","É um erro"]},
 {q:"Onde você deveria olhar primeiro para se situar?",a:"Agora / Cockpit",opts:["Agora / Cockpit","Grafo","Timeline completa","Lista linear"]}
];
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function context(){const m=byId.get("mission:world"),u=data.entities.find(e=>e.freshness==="UNKNOWN"),s=data.entities.find(e=>e.freshness==="STALE");return '<div class="p"><h2>AGORA</h2><p><strong>Estado atual: '+esc(m.state)+'</strong></p><p>❓ UNKNOWN · '+esc(u.label)+' — ainda não conseguimos confirmar.</p><p>↻ STALE · '+esc(s.label)+' — já sabíamos, mas pode ter mudado.</p></div>'}
function render(){const q=qs[run.i];app.innerHTML=context()+'<div class="p"><div class="muted">Pergunta '+(run.i+1)+'/6</div><h2>'+esc(q.q)+'</h2><div class="answers">'+q.opts.map(o=>'<label><input type="radio" name="a" value="'+esc(o)+'"> '+esc(o)+'</label>').join("")+'</div><button id="go">Responder</button></div>';run.t=performance.now();document.querySelector("#go").onclick=answer}
function answer(){const p=document.querySelector('input[name=a]:checked');if(!p)return;const q=qs[run.i];run.rows.push({task:run.i+1,answer:p.value,expected:q.a,correct:p.value===q.a,elapsedMs:Math.round(performance.now()-run.t)});run.i++;if(run.i===qs.length)return finish();render()}
function finish(){const o={schema:"mcf-world-focused-comprehension/v1",prototype:"v0.2",fixtureRevision:data.sourceRevision,finishedAt:new Date().toISOString(),correct:run.rows.filter(x=>x.correct).length,total:qs.length,totalMs:run.rows.reduce((a,b)=>a+b.elapsedMs,0),results:run.rows};localStorage.setItem("mcf-world-v02-last-result",JSON.stringify(o));show(o)}
function show(o){app.innerHTML='<div class="p"><h2>Resultado salvo localmente</h2><p><strong>'+o.correct+'/'+o.total+'</strong> corretas · '+(o.totalMs/1000).toFixed(1)+' s</p><div class="r">'+esc(JSON.stringify(o,null,2))+'</div></div>'}
document.querySelector("#start").onclick=()=>{run={i:0,rows:[]};render()};document.querySelector("#last").onclick=()=>{const x=localStorage.getItem("mcf-world-v02-last-result");if(x)show(JSON.parse(x));else app.innerHTML='<div class="p">Nenhum resultado salvo neste navegador ainda.</div>'}
</script></body></html>
