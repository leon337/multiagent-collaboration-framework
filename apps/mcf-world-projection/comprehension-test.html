<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Projection v0.2.1 — Focused Comprehension</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#0b0f14;color:#eef3f8}body{margin:0}.w{max-width:1100px;margin:auto;padding:22px}.p{background:#111923;border:1px solid #2a3848;border-radius:14px;padding:18px;margin-bottom:14px}button{font:inherit;color:inherit;background:#1a2734;border:1px solid #42556c;border-radius:9px;padding:10px 14px;cursor:pointer}.answers label{display:block;border:1px solid #2d3b4c;border-radius:9px;padding:10px;margin:8px 0}.r{white-space:pre-wrap;overflow:auto;background:#080c11;padding:12px;border-radius:9px}.muted{color:#94a4b8}iframe{width:100%;height:680px;border:1px solid #2d3b4c;border-radius:12px;background:#090d12}@media(max-width:700px){iframe{height:620px}}</style></head>
<body><div class="w"><div class="p"><div class="muted">FOCUSED TEST · v0.2.1</div><h1>Estado, UNKNOWN e STALE</h1><p>Primeiro explore a interface normalmente. Quando sentir que entendeu a missão, toque em <b>Estou pronto</b>. Depois a interface será retirada e virão seis perguntas.</p><button id="begin">Explorar interface</button><button id="last">Ver último resultado salvo</button></div><div id="app"></div></div>
<script type="module">
const app=document.querySelector("#app");let run=null;
const qs=[
 {q:"Qual é o estado atual da missão?",a:"WORKING",opts:["WORKING","COMPLETED","UNKNOWN","STALE"]},
 {q:"Qual item ainda não foi confirmado?",a:"Rebuild proof",opts:["Draft PR #380","Rebuild proof","Emily Gate","MCF"]},
 {q:"Se Rebuild proof aparece em “O que ainda não sabemos”, o sistema está dizendo que:",a:"Ainda não foi confirmado",opts:["Falhou","Ainda não foi confirmado","Está concluído","Está antigo"]},
 {q:"Qual item pode ter mudado desde a última confirmação?",a:"Gate futuro",opts:["Gate futuro","Rebuild proof","Draft PR #380","WPP v0.1"]},
 {q:"Podemos tratar Gate futuro como estado atual confirmado?",a:"Não",opts:["Sim","Não"]},
 {q:"Ao retornar a uma missão longa, onde a interface recomenda começar?",a:"Agora / Cockpit",opts:["Agora / Cockpit","Grafo","Timeline completa","Lista linear"]}
];
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function exploration(){app.innerHTML='<div class="p"><h2>Fase 1 — Situe-se</h2><p class="muted">Navegue como faria normalmente. O tempo de exploração não entra no tempo de resposta.</p><iframe src="./index.html" title="World Projection v0.2.1"></iframe><p><button id="ready">Estou pronto</button></p></div>';document.querySelector("#ready").onclick=startQuestions}
function startQuestions(){run={i:0,rows:[],startedAt:new Date().toISOString()};renderQuestion()}
function renderQuestion(){const q=qs[run.i];app.innerHTML='<div class="p"><div class="muted">Fase 2 · Pergunta '+(run.i+1)+'/6</div><h2>'+esc(q.q)+'</h2><div class="answers">'+q.opts.map(o=>'<label><input type="radio" name="a" value="'+esc(o)+'"> '+esc(o)+'</label>').join("")+'</div><button id="go">Responder</button></div>';run.t=performance.now();document.querySelector("#go").onclick=answer}
function answer(){const p=document.querySelector('input[name=a]:checked');if(!p)return;const q=qs[run.i];run.rows.push({task:run.i+1,question:q.q,answer:p.value,expected:q.a,correct:p.value===q.a,elapsedMs:Math.round(performance.now()-run.t)});run.i++;if(run.i===qs.length)return finish();renderQuestion()}
function finish(){const o={schema:"mcf-world-focused-comprehension/v1",prototype:"v0.2.1",fixtureRevision:"github:leon337/multiagent-collaboration-framework:mission/mcf-world-projection-001@44ed701b",startedAt:run.startedAt,finishedAt:new Date().toISOString(),correct:run.rows.filter(x=>x.correct).length,total:qs.length,totalMs:run.rows.reduce((a,b)=>a+b.elapsedMs,0),results:run.rows,claimsBoundary:"Focused human comprehension result only; not Product GO."};localStorage.setItem("mcf-world-v021-last-result",JSON.stringify(o));show(o)}
function show(o){app.innerHTML='<div class="p"><h2>Resultado salvo localmente</h2><p><strong>'+o.correct+'/'+o.total+'</strong> corretas · '+(o.totalMs/1000).toFixed(1)+' s de resposta</p><p class="muted">A fase de exploração não entra nesse tempo.</p><div class="r">'+esc(JSON.stringify(o,null,2))+'</div></div>'}
document.querySelector("#begin").onclick=exploration;document.querySelector("#last").onclick=()=>{const x=localStorage.getItem("mcf-world-v021-last-result");if(x)show(JSON.parse(x));else app.innerHTML='<div class="p">Nenhum resultado salvo neste navegador ainda.</div>'}
</script></body></html>
