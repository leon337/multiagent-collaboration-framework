<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCF World Projection — Semantic Visual Language v0.1</title>
<style>
:root{
  color-scheme:dark;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#090d12;color:#eef3f8;
  --panel:#111923;--panel2:#151f2b;--line:#2a3848;--muted:#94a4b8;
  --fresh:#58cc7b;--fresh-bg:#10251a;
  --stale:#f2b84f;--stale-bg:#2b2110;
  --unknown:#b892ff;--unknown-bg:#251934;
  --blocked:#ff6e6e;--blocked-bg:#321719;
  --current:#5fcaff;--current-bg:#102736;
}
*{box-sizing:border-box}body{margin:0;background:#090d12;color:#eef3f8}
button,input{font:inherit;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{max-width:1440px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px}
.top h1{margin:3px 0;font-size:clamp(26px,3.4vw,44px)}.ey{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800}
.flag{border:1px solid #61758d;border-radius:999px;padding:5px 8px;font-size:11px}.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);padding:10px 0;font-size:12px}
.statebar{display:grid;grid-template-columns:1.3fr .9fr .9fr;gap:8px;margin:10px 0 14px}.statebar>div{border:1px solid var(--line);background:#101822;border-radius:10px;padding:10px}
.statebar strong{display:block;font-size:16px;margin-top:3px}.statebar .currentState{border-color:var(--current);box-shadow:0 0 0 1px #5fcaff44 inset}.statebar .unknownState{border-color:var(--unknown)}.statebar .staleState{border-color:var(--stale)}
.tabs{display:flex;gap:8px;margin:8px 0 16px;overflow:auto}.tabs button{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}.tabs button.on{background:#eef3f8;color:#091018}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px}.inspector{position:sticky;top:14px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:12px;margin-bottom:12px}.stateHero,.gateHero{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--panel2)}
.stateHero{border-color:var(--blocked);background:linear-gradient(135deg,var(--blocked-bg),var(--panel2))}.gateHero{border-color:var(--fresh)}
.stateHero h2{font-size:clamp(28px,4vw,48px);line-height:1;margin:8px 0 10px}.gateHero strong{font-size:20px;display:block;margin:8px 0}.why{font-size:16px;max-width:760px}
.statusGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statusCard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#131d28;min-height:150px}.statusCard h3{margin:7px 0;font-size:19px}.statusCard p{margin:6px 0}
.statusCard.active{border-color:var(--current);background:linear-gradient(135deg,var(--current-bg),#131d28)}
.statusCard.unknown{border-color:var(--unknown);border-style:dashed;background:linear-gradient(135deg,var(--unknown-bg),#131d28)}
.statusCard.stale{border-color:var(--stale);border-style:double;border-width:3px;background:linear-gradient(135deg,var(--stale-bg),#131d28)}
.criticalItem{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.criticalItem .name{font-size:23px;font-weight:900;line-height:1.05;margin:5px 0}.criticalItem .binding{font-weight:800;margin-top:7px}.criticalItem .whyState{font-size:13px;color:var(--muted);margin-top:4px}
.explain{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.quick .card{border:1px solid var(--line);background:#151f2b;border-radius:10px;padding:12px}.quick strong{display:block;margin-top:5px}
.muted{color:var(--muted)}.entity{display:grid;gap:5px;background:transparent;border:1px solid #3a4b60;border-radius:8px;padding:8px;text-align:left;cursor:pointer}
.timeline{list-style:none;padding:0}.timeline li{display:grid;grid-template-columns:160px 1fr;gap:10px;margin-bottom:10px}.timeline button{background:#17212e;border:1px solid var(--line);border-radius:9px;text-align:left;padding:10px;cursor:pointer;position:relative;opacity:.86}
.linear{display:grid;gap:8px}.linear .row{display:grid;grid-template-columns:240px 1fr auto;gap:10px;align-items:center}
.graph{position:relative;height:580px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d141c}.graph svg{position:absolute;inset:0;width:100%;height:100%}.graph line{stroke:#45576f;stroke-width:1.5}
.node{position:absolute;transform:translate(-50%,-50%);width:145px;background:#182431;border:1px solid #60758f;border-radius:9px;padding:8px;cursor:pointer;text-align:left;display:grid;gap:5px}.node.sel{outline:3px solid var(--current);outline-offset:3px;box-shadow:0 0 0 1px #5fcaff55 inset}
.node.fresh{border-color:var(--fresh)}.node.stale{border-color:var(--stale);border-style:double;border-width:3px;background:var(--stale-bg)}.node.unknown{border-color:var(--unknown);border-style:dashed;background:var(--unknown-bg)}
.semantic{display:inline-flex;gap:6px;align-items:center;font-weight:900;border:1px solid currentColor;border-radius:999px;padding:3px 7px;font-size:11px;letter-spacing:.04em;width:max-content}
.semantic.fresh{color:var(--fresh);background:var(--fresh-bg)}.semantic.stale{color:var(--stale);background:var(--stale-bg)}.semantic.unknown{color:var(--unknown);background:var(--unknown-bg)}.semantic.blocked{color:var(--blocked);background:var(--blocked-bg)}.semantic.current{color:var(--current);background:var(--current-bg)}.semantic.neutral{color:#c9d4df;background:#16202b}
.typeTag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:.05em;color:#c9d4df}.typeIcon{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #6e8298;border-radius:6px;background:#0e151d;font-weight:900}
dl{display:grid;grid-template-columns:95px 1fr;gap:7px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}code{font-size:12px}.rels{padding-left:18px}.rels li{margin:6px 0}input{background:#0d141c;border:1px solid var(--line);border-radius:8px;padding:9px;width:min(340px,100%)}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.legend>div{border:1px solid var(--line);border-radius:9px;padding:10px}.legend .lgFresh{border-color:var(--fresh)}.legend .lgUnknown{border-color:var(--unknown);border-style:dashed}.legend .lgStale{border-color:var(--stale);border-style:double;border-width:3px}.legend .lgBlocked{border-color:var(--blocked)}.legend .lgCurrent{border-color:var(--current)}
.visualGuide{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#0e151d}.visualGuide summary{cursor:pointer;font-weight:900}.guideGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.guideGrid>div{border:1px solid var(--line);border-radius:10px;padding:10px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.inspector{position:static}.hero,.statusGrid,.quick,.legend,.statebar,.guideGrid{grid-template-columns:1fr}.linear .row{grid-template-columns:1fr}.timeline li{grid-template-columns:1fr}.graph{height:720px}.top{align-items:start;flex-direction:column}}
</style>
</head>
<body><div id="app" class="app"></div>
<script type="module">
const data=await fetch("./semantic-visual-fixture-s.json",{cache:"no-store"}).then(r=>r.json());
const byId=new Map(data.entities.map(e=>[e.id,e]));
const state={view:"cockpit",selected:"mission:world",q:""};
const ACTIVE_STATUSES=new Set(["ACTIVE","WORKING","EXECUTING","ORCHESTRATING"]);
const app=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYPE={project:{icon:"◇",label:"PROJECT"},mission:{icon:"⬢",label:"MISSION"},agent:{icon:"●",label:"AGENT"},artifact:{icon:"▣",label:"ARTIFACT"},human_gate:{icon:"⬡",label:"GATE"},evidence:{icon:"◈",label:"EVIDENCE"},action:{icon:"→",label:"ACTION"}};
const typeMeta=e=>TYPE[e.kind]||{icon:"□",label:String(e.kind||"OBJECT").toUpperCase()};
const typeTag=e=>{const t=typeMeta(e);return '<span class="typeTag"><span class="typeIcon" aria-hidden="true">'+esc(t.icon)+'</span>'+esc(t.label)+'</span>'};
const freshMeta=e=>{const f=String(e.freshness||"UNKNOWN").toUpperCase();return f==="FRESH"?{cls:"fresh",icon:"✓",label:"FRESH · confirmado"}:f==="STALE"?{cls:"stale",icon:"↻",label:"STALE · revalidar"}:{cls:"unknown",icon:"?",label:"UNKNOWN · não confirmado"}};
const semanticFresh=e=>{const m=freshMeta(e);return '<span class="semantic '+m.cls+'"><span aria-hidden="true">'+m.icon+'</span>'+esc(m.label)+'</span>'};
const semanticMissionState=e=>String(e.state)==="BLOCKED"?'<span class="semantic blocked"><span aria-hidden="true">⛔</span>BLOCKED · bloqueado</span>':'<span class="semantic neutral">'+esc(e.state)+'</span>';
const btn=e=>'<button class="entity" data-sel="'+esc(e.id)+'">'+typeTag(e)+'<strong>'+esc(e.label)+'</strong>'+semanticFresh(e)+'</button>';
function rels(id){return data.relations.filter(r=>r.from===id||r.to===id)}
function inspector(){const e=byId.get(state.selected)||byId.get("mission:world");return '<aside class="panel inspector"><div class="ey">DETALHE · SOB DEMANDA</div>'+typeTag(e)+'<h2>'+esc(e.label)+'</h2><p><span class="semantic current">Selecionado</span> '+semanticMissionState(e)+' '+semanticFresh(e)+'</p><p>'+esc(e.summary)+'</p><dl><dt>WorldRef</dt><dd><code>'+esc(e.id)+'</code></dd><dt>Tipo</dt><dd>'+esc(e.kind)+'</dd><dt>Fonte</dt><dd><code>'+esc(e.canonicalRef)+'</code></dd><dt>Confiança</dt><dd>'+esc(e.trust)+'</dd></dl><h3>Relações</h3><ul class="rels">'+rels(e.id).map(r=>{const pid=r.from===e.id?r.to:r.from,p=byId.get(pid);return '<li><code>'+esc(r.type)+'</code> '+(p?btn(p):esc(pid))+'</li>'}).join("")+'</ul></aside>'}
function guide(){return '<details class="visualGuide" open><summary>Como ler esta interface</summary><div class="guideGrid"><div><div class="ey">1 · ESTADO / FRESHNESS</div><p><span class="semantic fresh">✓ FRESH</span> <span class="semantic stale">↻ STALE</span> <span class="semantic unknown">? UNKNOWN</span></p><p class="muted">A cor mantém o mesmo significado em todas as views.</p></div><div><div class="ey">2 · TIPO DO OBJETO</div><p>◇ Project · ⬢ Mission · ● Agent · ▣ Artifact · ⬡ Gate · ◈ Evidence</p><p class="muted">Ícone + rótulo distinguem classes sem depender da cor.</p></div><div><div class="ey">3 · POSIÇÃO OPERACIONAL</div><p><span class="semantic current">Selecionado / foco</span></p><p class="muted">Borda/halo mostram foco atual; Timeline fica visualmente histórica.</p></div></div></details>'}
function baseline(){const q=state.q.toLowerCase(),items=data.entities.filter(e=>!q||[e.label,e.kind,e.summary,e.canonicalRef].some(v=>String(v).toLowerCase().includes(q)));return '<section class="panel"><div class="ey">REFERÊNCIA · NÃO É A HOME RECOMENDADA</div><h2>Lista linear</h2><input id="q" aria-label="Buscar entidade" placeholder="Buscar entidade…" value="'+esc(state.q)+'"><p class="muted">Busca detalhada. A linguagem visual permanece igual às outras views.</p><div class="linear">'+items.map(e=>'<div class="row">'+btn(e)+'<span>'+esc(e.summary)+'</span><span>'+semanticFresh(e)+'</span></div>').join("")+'</div></section>'}
function cockpit(){const m=byId.get("mission:world"),last=data.events.at(-1),unknown=data.entities.filter(e=>e.freshness==="UNKNOWN"),stale=data.entities.filter(e=>e.freshness==="STALE"),gate=byId.get("gate:read-only");const currentWorkers=data.entities.filter(e=>e.kind==="agent"&&ACTIVE_STATUSES.has(e.state));return '<section class="panel"><div class="ey">AGORA · RESUMO OPERACIONAL</div><h2>Cockpit · Semantic Visual Language v0.1</h2>'+guide()+'<div class="hero"><div class="stateHero"><div class="ey">ESTADO ATUAL DA MISSÃO</div><h2>'+esc(m.state)+'</h2>'+semanticMissionState(m)+'<div class="why">'+esc(m.summary)+'</div><div class="explain">Vermelho + ⛔ + texto BLOCKED significam bloqueio. Histórico fica na Timeline.</div></div><div class="gateHero"><div class="ey">GATE ATUAL / LIMITE</div>'+typeTag(gate)+'<strong>'+esc(gate.state)+'</strong>'+semanticFresh(gate)+'<p>'+esc(gate.summary)+'</p><div class="explain">Gate é tipo de objeto; FRESH é freshness. Não são a mesma dimensão.</div></div></div><div class="statusGrid"><article class="statusCard active"><div class="ey">QUEM ESTÁ ATUANDO</div><h3>'+esc(currentWorkers.map(x=>x.label).join(", ")||"Ninguém ativo")+'</h3><p>'+esc(currentWorkers.map(x=>x.state).join(" · ")||"Sem agente em execução")+'</p></article><article class="statusCard unknown"><div class="ey">? O QUE AINDA NÃO SABEMOS</div><h3>'+unknown.length+' item(ns)</h3>'+unknown.map(e=>'<div class="criticalItem">'+typeTag(e)+'<div class="name">'+esc(e.label)+'</div>'+semanticFresh(e)+'<div class="binding">Ainda não confirmada</div><div class="whyState">'+esc(e.summary)+'</div></div>').join("")+'<div class="explain">UNKNOWN sempre usa violeta + ? + texto.</div></article><article class="statusCard stale"><div class="ey">↻ O QUE PODE TER MUDADO</div><h3>'+stale.length+' item(ns)</h3>'+stale.map(e=>'<div class="criticalItem">'+typeTag(e)+'<div class="name">'+esc(e.label)+'</div>'+semanticFresh(e)+'<div class="binding">Precisa ser revalidado</div><div class="whyState">'+esc(e.summary)+'</div></div>').join("")+'<div class="explain">STALE sempre usa âmbar + ↻ + texto.</div></article></div><div class="quick"><div class="card"><div class="ey">ÚLTIMO ACONTECIMENTO</div><strong>'+esc(last.summary)+'</strong><span class="muted">'+esc(last.type)+'</span></div><div class="card"><div class="ey">MISSÃO</div><strong>'+esc(m.label)+'</strong><span class="muted">'+esc(m.canonicalRef)+'</span></div><div class="card"><div class="ey">LEITURA RECOMENDADA</div><strong>Comece aqui. Timeline = histórico; Relações = estrutura.</strong></div></div><div class="legend"><div class="lgFresh"><strong>✓ FRESH</strong><p class="muted">Confirmado no snapshot.</p></div><div class="lgUnknown"><strong>? UNKNOWN</strong><p class="muted">Ainda não confirmado.</p></div><div class="lgStale"><strong>↻ STALE</strong><p class="muted">Precisa revalidar.</p></div><div class="lgBlocked"><strong>⛔ BLOCKED</strong><p class="muted">Missão bloqueada.</p></div><div class="lgCurrent"><strong>FOCO</strong><p class="muted">Borda/halo ciano = objeto selecionado.</p></div></div></section>'}
function timeline(){return '<section class="panel"><div class="ey">HISTÓRICO · QUANDO VOCÊ PRECISAR</div><h2>Timeline</h2><p class="muted">Histórico é visualmente recuado. A cor do objeto continua indicando freshness.</p><ol class="timeline">'+data.events.map(ev=>{const e=byId.get(ev.subject);return '<li><time>'+esc(ev.at)+'</time><button data-sel="'+esc(ev.subject)+'">'+(e?typeTag(e):'')+'<small>'+esc(ev.type)+'</small><strong>'+esc(e?.label||ev.subject)+'</strong>'+(e?semanticFresh(e):'')+'<p>'+esc(ev.summary)+'</p></button></li>'}).join("")+'</ol></section>'}
const pos={"project:mcf":[12,12],"mission:world":[42,12],"agent:mestre":[72,10],"agent:leonardo":[15,42],"agent:laura":[35,47],"agent:sofia":[58,44],"agent:emily":[80,42],"artifact:wpp":[58,72],"gate:read-only":[81,72],"effect:pr380":[90,15],"evidence:rebuild":[28,90],"gate:future":[86,91]};
function graph(){const lines=data.relations.map(r=>{const a=pos[r.from],b=pos[r.to];return '<line x1="'+a[0]+'%" y1="'+a[1]+'%" x2="'+b[0]+'%" y2="'+b[1]+'%"></line>'}).join("");const nodes=data.entities.map(e=>{const p=pos[e.id]||[50,50],fm=freshMeta(e),tm=typeMeta(e);return '<button class="node '+fm.cls+' '+(e.id===state.selected?'sel':'')+'" data-sel="'+esc(e.id)+'" style="left:'+p[0]+'%;top:'+p[1]+'%"><span class="typeTag"><span class="typeIcon" aria-hidden="true">'+esc(tm.icon)+'</span>'+esc(tm.label)+'</span><strong>'+esc(e.label)+'</strong>'+semanticFresh(e)+'</button>'}).join("");return '<section class="panel"><div class="ey">RELAÇÕES · “COMO ISSO SE LIGA?”</div><h2>Grafo focado</h2><p class="muted">Use o grafo para relações. Estado/freshness mantém a mesma codificação do Cockpit e Timeline.</p><div class="graph"><svg aria-hidden="true">'+lines+'</svg>'+nodes+'</div></section>'}
function surface(){return state.view==="baseline"?baseline():state.view==="timeline"?timeline():state.view==="graph"?graph():cockpit()}
function render(){const m=byId.get("mission:world"),u=data.entities.filter(e=>e.freshness==="UNKNOWN").length,st=data.entities.filter(e=>e.freshness==="STALE").length;app.innerHTML='<header class="top"><div><div class="ey">MCF-WORLD-PROJECTION-001</div><h1>Semantic Visual Language v0.1</h1></div><div class="flag">REPRESENTATIVE FIXTURE S · READ-ONLY</div></header><div class="meta"><span>'+esc(data.sourceRevision)+'</span><span>observado: '+esc(data.observedAt)+'</span><span>'+data.entities.length+' entidades</span></div><div class="statebar"><div class="currentState"><div class="ey">MISSÃO · AGORA</div><strong>⛔ '+esc(m.state)+'</strong></div><div class="unknownState"><div class="ey">AINDA NÃO SABEMOS</div><strong>? '+u+' UNKNOWN</strong></div><div class="staleState"><div class="ey">PODE TER MUDADO</div><strong>↻ '+st+' STALE</strong></div></div><nav class="tabs">'+[["cockpit","Agora"],["timeline","Timeline"],["graph","Relações"],["baseline","Lista / busca"]].map(v=>'<button class="'+(state.view===v[0]?'on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>').join("")+'</nav><main class="layout">'+surface()+inspector()+'</main>';app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});app.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{state.selected=b.dataset.sel;render()});const q=app.querySelector("#q");if(q)q.oninput=e=>{state.q=e.target.value;render();requestAnimationFrame(()=>{const n=app.querySelector("#q");n?.focus();n?.setSelectionRange(state.q.length,state.q.length)})}}
render();
</script>
</body>
</html>
