<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MCF World Projection — Salvage Baseline A(Z)</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0b0f14;color:#e7edf4}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}
header,.panel{background:#111821;border:1px solid #263241;border-radius:14px;padding:18px;margin-bottom:16px}
h1,h2{margin:.2rem 0 .8rem}.muted{color:#91a0b2}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
button{background:#1b2634;color:#fff;border:1px solid #3b4d63;border-radius:9px;padding:10px 13px;cursor:pointer}
.event{padding:9px 0;border-bottom:1px solid #24303d}.answers label{display:block;padding:9px;border:1px solid #293747;border-radius:8px;margin:7px 0}
.result{white-space:pre-wrap;background:#0a0e13;border-radius:8px;padding:12px;overflow:auto}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<header>
<div class="muted">MCF-WORLD-PROJECTION-001 · SALVAGE HUMAN PILOT</div>
<h1>Baseline A(Z)</h1>
<p>Rodada única de baseline linear usando Fixture Z congelado. Esta execução complementa a rodada humana B(Y) já capturada.</p>
<button id="start">Iniciar A(Z)</button>
</header><div id="app"></div></div>
<script type="module">
const $=s=>document.querySelector(s); let data=null,run=null;
const questions=[
 {q:"Qual é o estado atual da missão?",a:"PAUSED",opts:["ACTIVE","WORKING","PAUSED","UNKNOWN"]},
 {q:"Quem produziu o artefato principal Ops Ledger v1.3?",a:"Diego",opts:["Bruno","Camila","Diego","Fernanda"]},
 {q:"Quem fez a auditoria independente?",a:"Fernanda",opts:["Camila","Diego","Fernanda","MESTRE"]},
 {q:"Qual gate está vigente no cenário?",a:"APPROVAL_REQUIRED",opts:["GO_READ_ONLY","APPROVAL_REQUIRED","PRODUCTION","UNKNOWN"]},
 {q:"Build #144 é receipt canônico?",a:"NÃO",opts:["SIM","NÃO","UNKNOWN"]},
 {q:"Qual evidência está UNKNOWN?",a:"Checksum verification",opts:["Ops Ledger v1.3","Checksum verification","Build #144","Release Gate"]},
 {q:"Qual item está STALE?",a:"Deploy snapshot",opts:["Deploy snapshot","Release Gate","Ops Ledger v1.3","Project Atlas"]},
 {q:"O que ocorreu imediatamente antes de Build #144 na sequência temporal do fixture?",a:"Fernanda marcou aprovação humana como necessária",opts:["Diego produziu Ops Ledger v1.3","Fernanda marcou aprovação humana como necessária","Missão criada","Bruno consolidou requisitos"]}
];
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function surface(){const rows=[];data.entities.forEach(e=>rows.push(e.label+": tipo="+e.kind+"; estado="+e.state+"; freshness="+e.freshness+"; "+e.summary));data.events.forEach(e=>rows.push("Evento "+e.seq+": "+e.summary+" Ator="+e.actor+". Assunto="+e.subject+"."));data.relations.forEach(r=>rows.push("Relação: "+r.from+" "+r.type+" "+r.to+"."));return '<section class="panel"><h2>A — Linear · Fixture Z</h2><p class="muted">Lista sequencial dos fatos.</p>'+rows.map(x=>'<div class="event">'+esc(x)+'</div>').join("")+'</section>'}
function render(){const q=questions[run.index];let a='<div class="answers">';q.opts.forEach(o=>a+='<label><input type="radio" name="a" value="'+esc(o)+'"> '+esc(o)+'</label>');a+='</div><button id="answer">Responder</button>';$("#app").innerHTML='<div class="grid"><div>'+surface()+'</div><aside class="panel"><div class="muted">Tarefa '+(run.index+1)+'/8</div><h2>'+esc(q.q)+'</h2>'+a+'</aside></div>';$("#answer").onclick=answer;run.taskStarted=performance.now();}
function answer(){const p=document.querySelector('input[name=a]:checked');if(!p)return;const q=questions[run.index],elapsed=performance.now()-run.taskStarted;run.results.push({task:run.index+1,question:q.q,answer:p.value,expected:q.a,correct:p.value===q.a,elapsedMs:Math.round(elapsed)});run.index++;if(run.index>=questions.length)return finish();render();}
function finish(){run.finishedAt=new Date().toISOString();run.totalMs=run.results.reduce((s,x)=>s+x.elapsedMs,0);run.correct=run.results.filter(x=>x.correct).length;run.accuracy=run.correct/run.results.length;const output={schema:"mcf-world-context-recovery-run/v1",fixtureId:"Z",fixtureRevision:data.sourceRevision,condition:"baseline",sequence:"B(Y)_then_A(Z)_salvage",startedAt:run.startedAt,finishedAt:run.finishedAt,totalMs:run.totalMs,correct:run.correct,total:8,accuracy:run.accuracy,results:run.results,claimsBoundary:"Exploratory intra-individual salvage result; no causal interface claim and no product GO by itself."};$("#app").innerHTML='<section class="panel"><h2>Rodada concluída</h2><p><b>'+run.correct+'/8</b> corretas · '+(run.totalMs/1000).toFixed(1)+' s.</p><p class="muted">Mantenha esta tela aberta. MESTRE capturará o JSON diretamente.</p><div class="result">'+esc(JSON.stringify(output,null,2))+'</div></section>';window.__MCF_SALVAGE_RESULT__=output;}
$("#start").onclick=()=>{run={index:0,results:[],startedAt:new Date().toISOString(),taskStarted:0};render();};
data=await fetch("./experiment-fixture-z.json",{cache:"no-store"}).then(r=>r.json());
</script></body></html>
