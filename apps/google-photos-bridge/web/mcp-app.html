<div id="gp-root" style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:14px;max-width:760px;margin:0 auto;color-scheme:light dark">
  <style>
    #gp-root{--bg:Canvas;--fg:CanvasText;--muted:color-mix(in srgb,CanvasText 65%,transparent);--line:color-mix(in srgb,CanvasText 18%,transparent);--soft:color-mix(in srgb,CanvasText 7%,Canvas);--ok:#166534;--warn:#92400e}#gp-root *{box-sizing:border-box}#gp-root .card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px;background:var(--bg);color:var(--fg)}#gp-root h2{font-size:18px;margin:0 0 4px}#gp-root p{font-size:14px;line-height:1.45;margin:6px 0;color:var(--muted)}#gp-root .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#gp-root button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:650;background:var(--fg);color:var(--bg)}#gp-root button.secondary{background:var(--soft);color:var(--fg);border:1px solid var(--line)}#gp-root button.danger{background:#991b1b;color:white}#gp-root button:disabled{opacity:.45}#gp-root .status{font-size:13px;border-radius:999px;padding:5px 9px;background:var(--soft);color:var(--fg)}#gp-root .ok{color:var(--ok)}#gp-root .warn{color:var(--warn)}#gp-root .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:10px}#gp-root .item{border:1px solid var(--line);border-radius:12px;padding:9px;min-width:0}#gp-root .item strong{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#gp-root .item small{font-size:11px;color:var(--muted)}#gp-root .muted{font-size:12px;color:var(--muted)}#gp-root .error{color:#b91c1c}@media(max-width:420px){#gp-root{padding:10px}#gp-root .card{padding:12px}#gp-root button{width:100%}}
  </style>
  <section class="card"><div class="row" style="justify-content:space-between"><div><h2>Google Fotos Bridge</h2><p>Autorize sua conta e escolha fotos pelo seletor oficial do Google.</p></div><span id="cfg" class="status">verificando…</span></div></section>
  <section class="card"><div class="row"><button id="connect" type="button">1. Conectar Google</button><button id="check" class="secondary" type="button" disabled>Verificar conexão</button><button id="disconnect" class="danger" type="button" disabled>Desconectar</button></div><p id="connect-msg">A autorização abre somente na tela oficial do Google.</p></section>
  <section class="card"><div class="row"><button id="picker" type="button" disabled>2. Escolher fotos</button><button id="refresh" class="secondary" type="button" disabled>Atualizar seleção</button><button id="close" class="secondary" type="button" disabled>Encerrar sessão</button></div><p id="picker-msg">Depois de conectar, abra o seletor oficial do Google Fotos.</p></section>
  <section class="card"><div class="row" style="justify-content:space-between"><strong>Fotos autorizadas</strong><span id="count" class="status">0</span></div><div id="items" class="grid"><div class="muted">Nenhuma foto selecionada ainda.</div></div></section>
  <div id="live" class="muted" aria-live="polite"></div>
</div>
<script>
(() => {
  const root=document.getElementById('gp-root');if(!root||root.dataset.ready==='1')return;root.dataset.ready='1';
  const $=s=>root.querySelector(s);const openai=window.openai;const persisted=openai?.widgetState||{};const previous=persisted.privateContent||persisted;
  const state={connection_id:previous.connection_id||null,session_id:previous.session_id||null,selected_items:Array.isArray(previous.selected_items)?previous.selected_items:[],configured:false};
  const save=()=>{try{const mediaIds=state.selected_items.map(x=>x.id);openai?.setWidgetState?.({modelContent:mediaIds.length?{googlePhotosBridge:{connection_id:state.connection_id,session_id:state.session_id,media_ids:mediaIds,count:mediaIds.length,instruction:'Use photos_get_image for the selected media IDs when visual analysis is required.'}}:{googlePhotosBridge:{count:0}},privateContent:{connection_id:state.connection_id,session_id:state.session_id,selected_items:state.selected_items}})}catch{}};
  const say=(t,err=false)=>{$('#live').textContent=t;$('#live').className=err?'muted error':'muted'};
  const dataOf=r=>{if(r?.structuredContent)return r.structuredContent;if(r?.structured_content)return r.structured_content;const t=r?.content?.find?.(x=>x.type==='text')?.text;if(!t)return{};try{return JSON.parse(t)}catch{return{}}};
  async function call(name,args={}){if(!openai?.callTool)throw new Error('Este host ainda não habilitou chamadas do MCP App.');return dataOf(await openai.callTool(name,args))}
  function controls(connected){$('#picker').disabled=!connected;$('#disconnect').disabled=!connected;$('#check').disabled=!state.connection_id;$('#refresh').disabled=!state.session_id;$('#close').disabled=!state.session_id}
  function renderItems(items=[]){state.selected_items=items;$('#count').textContent=String(items.length);const box=$('#items');box.innerHTML='';if(!items.length){box.innerHTML='<div class="muted">Nenhuma foto selecionada ainda.</div>';save();return}for(const it of items){const d=document.createElement('div');d.className='item';const n=document.createElement('strong');n.textContent=it.filename||it.id||'Foto';const s=document.createElement('small');s.textContent=[it.type,it.mime_type,it.create_time].filter(Boolean).join(' · ');d.append(n,s);box.append(d)}save()}
  async function bootstrap(){try{const info=await call('photos_bridge_status');state.configured=!!info.configured;$('#cfg').textContent=state.configured?'servidor pronto':'configuração incompleta';$('#cfg').className='status '+(state.configured?'ok':'warn');$('#connect').disabled=!state.configured;if(!state.configured)$('#connect-msg').textContent='O backend está online, mas faltam credenciais OAuth Google e/ou APP_STATE_SECRET seguro.';let connected=false;if(state.connection_id)connected=await checkConnection(false);controls(connected);if(state.selected_items.length)renderItems(state.selected_items);save()}catch(e){say(e.message,true)}}
  async function connect(){try{say('Criando conexão…');const r=await call('photos_connect');state.connection_id=r.connection_id;state.session_id=null;state.selected_items=[];save();controls(false);if(!openai?.openExternal)throw new Error('Este host não disponibilizou abertura segura do OAuth.');await openai.openExternal({href:r.authorization_url,redirectUrl:false});say('Autorização aberta. Conclua no Google e volte aqui para verificar.')}catch(e){say(e.message,true)}}
  async function checkConnection(announce=true){try{if(!state.connection_id)return false;const r=await call('photos_connection_status',{connection_id:state.connection_id});const ok=r.status==='connected';controls(ok);$('#connect-msg').textContent=ok?'Conta Google conectada.':'Ainda aguardando a autorização do Google.';if(announce)say(ok?'Conexão confirmada.':'Autorização ainda não concluída.');save();return ok}catch(e){if(announce)say(e.message,true);return false}}
  async function startPicker(){try{say('Criando sessão do Google Fotos…');const r=await call('photos_picker_start',{connection_id:state.connection_id,max_items:100});state.session_id=r.session_id;state.selected_items=[];save();controls(true);if(!openai?.openExternal)throw new Error('Este host não disponibilizou abertura segura do Picker.');const uri=String(r.picker_uri).replace(/\/$/,'')+'/autoclose';await openai.openExternal({href:uri,redirectUrl:false});say('Seletor aberto. Escolha as fotos, toque em Concluir e volte aqui.')}catch(e){say(e.message,true)}}
  async function refresh(){try{const s=await call('photos_picker_status',{connection_id:state.connection_id,session_id:state.session_id});if(!s.ready){say('A seleção ainda não foi concluída no Google.');return}const r=await call('photos_list_items',{connection_id:state.connection_id,session_id:state.session_id});renderItems(r.items||[]);say(`${r.count||0} item(ns) autorizado(s).`);if(openai?.sendFollowUpMessage)await openai.sendFollowUpMessage({prompt:'A seleção do Google Fotos foi concluída. Analise as fotos autorizadas usando o contexto do Google Photos Bridge.',scrollToBottom:true})}catch(e){say(e.message,true)}}
  async function closeSession(){try{if(!state.session_id)return;await call('photos_picker_close',{connection_id:state.connection_id,session_id:state.session_id});state.session_id=null;renderItems([]);controls(true);say('Sessão encerrada.')}catch(e){say(e.message,true)}}
  async function disconnect(){try{if(!state.connection_id)return;await call('photos_disconnect',{connection_id:state.connection_id});state.connection_id=null;state.session_id=null;renderItems([]);controls(false);$('#connect-msg').textContent='Conta desconectada. Você pode conectar novamente quando quiser.';say('Permissão Google revogada e estado local limpo.')}catch(e){say(e.message,true)}}
  $('#connect').addEventListener('click',connect);$('#check').addEventListener('click',()=>checkConnection(true));$('#disconnect').addEventListener('click',disconnect);$('#picker').addEventListener('click',startPicker);$('#refresh').addEventListener('click',refresh);$('#close').addEventListener('click',closeSession);bootstrap();
})();
</script>
