x-server-image: &server-image
  image: rsa-server:smoke
  build:
    context: ../../..
    dockerfile: apps/rede-social-agentes/deploy/server.Dockerfile

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: rsa
      POSTGRES_USER: rsa
      POSTGRES_PASSWORD: rsa_smoke_only
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rsa -d rsa']
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *server-image
    command: ['node', 'packages/database/scripts/migrate.mjs']
    environment:
      DATABASE_URL: postgresql://rsa:rsa_smoke_only@postgres:5432/rsa
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    <<: *server-image
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_smoke_only@postgres:5432/rsa
      LOG_LEVEL: error
      RATE_LIMIT_KEY_SECRET: smoke-only-rate-limit-secret-with-at-least-32-characters
      MCF_RECEIPT_SECRET: smoke-only-receipt-secret-with-at-least-32-characters
      MCF_RUNTIME_TOKEN: smoke-only-runtime-token-with-at-least-32-characters
      TRUST_PROXY: 'true'
      BODY_LIMIT_BYTES: 262144
      ALLOWED_ORIGINS: https://smoke.invalid
      REGISTRATION_ALLOWLIST: invited@example.test
      RESERVED_HUMAN_AUTHORITY_ACCOUNT_ID: 77777777-7777-4777-8777-777777777777
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    image: rsa-web:smoke
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:18080:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
