x-server-runtime: &server-runtime
  image: ${RSA_SERVER_IMAGE:?RSA_SERVER_IMAGE must use an immutable digest}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?RATE_LIMIT_KEY_SECRET is required}
    MCF_RECEIPT_SECRET: ${MCF_RECEIPT_SECRET:?MCF_RECEIPT_SECRET is required}
    MCF_RUNTIME_TOKEN: ${MCF_RUNTIME_TOKEN:?MCF_RUNTIME_TOKEN is required}
    TRUST_PROXY: 'true'
    BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-262144}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}

services:
  migrate:
    <<: *server-runtime
    command: ['node', 'packages/database/scripts/migrate.mjs']
    restart: 'no'

  server:
    <<: *server-runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    image: ${RSA_WEB_IMAGE:?RSA_WEB_IMAGE must use an immutable digest}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
