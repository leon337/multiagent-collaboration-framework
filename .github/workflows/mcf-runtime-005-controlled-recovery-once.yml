name: MCF Runtime 005 Controlled Recovery Once

on:
  push:
    branches:
      - test/mcf-runtime-005-controlled-recovery
    paths:
      - ".github/workflows/mcf-runtime-005-controlled-recovery-once.yml"

permissions:
  contents: read

jobs:
  prove-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCF_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RELEASE_SHA: ffffffffffffffffffffffffffffffffffffffff
      DEPLOY_TIMEOUT_MS: 90000
      DEPLOY_POLL_INTERVAL_MS: 5000

    steps:
      - name: Validate protected configuration
        run: |
          test -n "$MCF_RUNTIME_URL"
          test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Checkout proof revision
        uses: actions/checkout@v4

      - name: Capture healthy SHA
        run: |
          stable_sha=$(curl --fail --silent --show-error "$MCF_RUNTIME_URL/health/version" | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).commitSha));")
          [[ "$stable_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "STABLE_SHA=$stable_sha" >> "$GITHUB_ENV"

      - name: Trigger expected failure and recovery
        run: |
          set +e
          node apps/rede-social-agentes/ops/render-staging-deploy.mjs | tee /tmp/recovery.log
          exit_code=${PIPESTATUS[0]}
          set -e

          test "$exit_code" -eq 1
          grep -q '"status":"RECOVERED"' /tmp/recovery.log

      - name: Confirm healthy revision restored
        run: |
          current_sha=$(curl --fail --silent --show-error "$MCF_RUNTIME_URL/health/version" | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).commitSha));")
          test "$current_sha" = "$STABLE_SHA"
          curl --fail --silent --show-error "$MCF_RUNTIME_URL/health/ready" >/tmp/readiness.json
