name: MCF v1.1 I9 Format

on:
  push:
    branches:
      - feat/mcf-v1.1-project-intake-continuity
    paths:
      - apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability.service.ts
      - apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability.controller.ts
      - apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability-v1.1.test.ts
      - .github/workflows/mcf-v11-i9-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-v1.1-project-intake-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format I9 files
        working-directory: apps/rede-social-agentes
        run: >-
          pnpm exec prettier --write
          apps/server/src/mcf-runtime/mission-observability.service.ts
          apps/server/src/mcf-runtime/mission-observability.controller.ts
          apps/server/src/mcf-runtime/mission-observability-v1.1.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability.service.ts
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability.controller.ts
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-observability-v1.1.test.ts
          git commit -m "style(v1.1): format I9 observability changes"
          git push origin HEAD:feat/mcf-v1.1-project-intake-continuity
