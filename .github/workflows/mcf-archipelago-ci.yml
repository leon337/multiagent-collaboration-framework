name: MCF Archipelago CI

on:
  push:
    paths:
      - 'apps/mcf-archipelago/**'
      - '.github/workflows/mcf-archipelago-ci.yml'
  pull_request:
    paths:
      - 'apps/mcf-archipelago/**'
      - '.github/workflows/mcf-archipelago-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/mcf-archipelago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax + unit tests
        run: npm run ci
      - name: Static entrypoint smoke
        run: |
          test -f index.html
          test -f styles.css
          grep -q "MCF Archipelago" index.html
