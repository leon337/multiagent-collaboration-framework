name: TEMP Lot 4E final PRF manifest
on:
  push:
    branches: [feat/mcf-runtime-006-lot4-e-close-phase]
permissions:
  contents: write
jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate and verify PRF manifest
        run: |
          set -euo pipefail
          cd artifacts/phases/PHASE-006-LOT-4-E-CLOSE-PHASE
          sha256sum \
            PHASE-006-LOT-4-E-CLOSE-PHASE-CHECKPOINT.yaml \
            PHASE-006-LOT-4-E-CLOSE-PHASE-DECISIONS.md \
            PHASE-006-LOT-4-E-CLOSE-PHASE-PLAN.md \
            PHASE-006-LOT-4-E-CLOSE-PHASE-REPORT.md \
            PHASE-006-LOT-4-E-CLOSE-PHASE-SMOKE.txt \
            PHASE-006-LOT-4-E-CLOSE-PHASE-VALIDATION-FULL.txt \
            PHASE-006-LOT-4-E-CLOSE-PHASE-VALIDATION.txt \
            README.md > PHASE-006-LOT-4-E-CLOSE-PHASE-ARTIFACT-MANIFEST.sha256
          sha256sum -c PHASE-006-LOT-4-E-CLOSE-PHASE-ARTIFACT-MANIFEST.sha256
      - name: Commit manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/phases/PHASE-006-LOT-4-E-CLOSE-PHASE/PHASE-006-LOT-4-E-CLOSE-PHASE-ARTIFACT-MANIFEST.sha256
          git commit -m 'docs(runtime): regenerate final Lot 4-E PRF manifest'
          git push origin HEAD:${GITHUB_REF_NAME}
