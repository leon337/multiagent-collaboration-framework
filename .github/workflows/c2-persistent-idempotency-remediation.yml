name: C2 Persistent Idempotency Remediation

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-c2-pr-collaboration-write
          fetch-depth: 0

      - name: Make consumed global idempotency keys permanent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts')
          text = path.read_text()
          old_message = 'already has an active attempt'
          new_message = 'is already durably bound to a prior or active attempt'
          if text.count(old_message) != 1:
              raise SystemExit(f'expected one global idempotency message, found {text.count(old_message)}')
          text = text.replace(old_message, new_message, 1)
          anchor = "`Global idempotency scope for ${request.tool.resource}/${request.tool.operation} is already durably bound to a prior or active attempt`,\n            true,"
          replacement = "`Global idempotency scope for ${request.tool.resource}/${request.tool.operation} is already durably bound to a prior or active attempt`,\n            false,"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one global idempotency retryability anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format changed file
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime/external-action-ledger.ts

      - name: Commit remediation if needed
        run: |
          if git diff --quiet; then
            echo "Persistent idempotency remediation already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts
          git commit -m "fix(mcf): keep C2 idempotency keys durably consumed"
          git push origin HEAD:feat/mcf-runtime-006-c2-pr-collaboration-write
