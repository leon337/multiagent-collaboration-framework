name: MCF Hardening Format Preview

on:
  pull_request:
    paths:
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-hierarchy-hardening.integration.test.ts'
      - '.github/workflows/mcf-hardening-format-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - working-directory: apps/rede-social-agentes
        run: pnpm exec prettier apps/server/src/mcf-runtime/mission-hierarchy-hardening.integration.test.ts
