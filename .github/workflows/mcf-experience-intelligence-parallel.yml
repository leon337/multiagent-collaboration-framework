name: MCF Experience Intelligence — Parallel Tool-Using Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mcf-experience-intelligence-parallel.yml'
      - 'ops/mission-agent-harness/experience_intelligence_parallel.py'
      - 'artifacts/phases/PHASE-02-MEMORY-ARCHITECTURE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-eil-parallel-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  parallel-discovery:
    name: fan-out-toolcalls-fan-in
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_VERSION: 0.32.14
      OLLAMA_TARBALL_SHA256: c620917a71e146ab3a7f893084f066069c4c65d144ef8379a91c3cbe8b27de8f
      MCF_AGENT_WORKERS: "8"
      OLLAMA_NUM_PARALLEL: "4"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert public/read-only fallback boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "false"
          test "${{ runner.environment }}" = "github-hosted"
          echo "MCF_PRIVATE_MEMORY_ALLOWED=false"
          echo "MCF_PROVIDER_MUTATION_ALLOWED=false"
          echo "MCF_HARNESS_MODE=PARALLEL_FAN_OUT_TOOL_LOOP"

      - name: Install pinned Ollama
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/ollama/ollama/releases/download/v${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          curl --fail --location --retry 3 --output /tmp/ollama.tar.zst "$url"
          echo "${OLLAMA_TARBALL_SHA256}  /tmp/ollama.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/ollama.tar.zst -C /usr
          ollama --version

      - name: Start local model service
        shell: bash
        run: |
          set -euo pipefail
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull local fallback model
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$OLLAMA_MODEL"
          ollama list

      - name: Execute independent specialist fan-out with real read-only tools
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/mission-agent-harness/experience_intelligence_parallel.py \
            --model "$OLLAMA_MODEL" \
            --workers "$MCF_AGENT_WORKERS" \
            --timeout 300

      - name: Prove harness did not mutate repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo "MCF_HARNESS_REPO_MUTATION=false"
