name: Content Studio N4 Scale Proof
on:
  pull_request:
    paths:
      - 'experimentos/mcf-content-studio-n4/src/templates/**'
      - 'experimentos/mcf-content-studio-n4/src/components/**'
      - 'experimentos/mcf-content-studio-n4/src/remotion/**'
      - 'experimentos/mcf-content-studio-n4/src/preflight/**'
      - 'experimentos/mcf-content-studio-n4/instavar/**'
      - 'experimentos/mcf-content-studio-n4/scripts/build-scale-review.py'
      - '.github/workflows/content-studio-n4-scale-proof.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: content-studio-n4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  render-scale-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: {run: {working-directory: experimentos/mcf-content-studio-n4}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Render architecture-heavy lesson
        run: |
          mkdir -p out
          start=$(date +%s%3N)
          pnpm exec remotion render src/remotion/index.ts ArchitectureControlPlaneLesson out/architecture-control-plane.mp4 --codec=h264 --crf=24 --concurrency=2
          end=$(date +%s%3N); echo $((end-start)) > out/architecture-render-ms.txt
      - name: Render UI-code-heavy lesson
        run: |
          start=$(date +%s%3N)
          pnpm exec remotion render src/remotion/index.ts UiCodeAgentFlowLesson out/ui-code-agent-flow.mp4 --codec=h264 --crf=24 --concurrency=2
          end=$(date +%s%3N); echo $((end-start)) > out/ui-code-render-ms.txt
      - name: Render native Instavar bridge proof
        run: pnpm exec remotion render src/remotion/index.ts InstavarBridgeProof out/instavar-bridge-proof.mp4 --codec=h264 --crf=24 --concurrency=2
      - name: Build scale benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def n(path): return int(Path(path).read_text().strip())
          def size(path): return Path(path).stat().st_size
          report={"architecture":{"renderMs":n("out/architecture-render-ms.txt"),"bytes":size("out/architecture-control-plane.mp4")},"uiCode":{"renderMs":n("out/ui-code-render-ms.txt"),"bytes":size("out/ui-code-agent-flow.mp4")},"instavarBridge":{"bytes":size("out/instavar-bridge-proof.mp4")}}
          Path("out/scale-benchmark.json").write_text(json.dumps(report,indent=2)+"\n",encoding="utf-8"); print(json.dumps(report,indent=2))
          PY
      - name: Build self-contained scale review
        run: python scripts/build-scale-review.py --architecture out/architecture-control-plane.mp4 --ui-code out/ui-code-agent-flow.mp4 --architecture-spec src/templates/architecture-control-plane.lesson.json --ui-code-spec src/templates/ui-code-agent-flow.lesson.json --benchmark out/scale-benchmark.json --output out/n4-scale-proof-review.html
      - name: Verify scale artifacts
        run: |
          test -s out/architecture-control-plane.mp4
          test -s out/ui-code-agent-flow.mp4
          test -s out/instavar-bridge-proof.mp4
          test -s out/n4-scale-proof-review.html
          test -s out/scale-benchmark.json
      - name: Upload scale proof
        uses: actions/upload-artifact@v4
        with:
          name: n4-scale-proof
          path: |
            experimentos/mcf-content-studio-n4/out/architecture-control-plane.mp4
            experimentos/mcf-content-studio-n4/out/ui-code-agent-flow.mp4
            experimentos/mcf-content-studio-n4/out/instavar-bridge-proof.mp4
            experimentos/mcf-content-studio-n4/out/n4-scale-proof-review.html
            experimentos/mcf-content-studio-n4/out/scale-benchmark.json
          if-no-files-found: error
          retention-days: 14
