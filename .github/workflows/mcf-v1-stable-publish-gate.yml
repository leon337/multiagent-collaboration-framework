name: MCF v1.0.0 Stable Publication Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: mcf-v1-stable-publication-pr-133
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-publication-boundary:
    if: >-
      github.event.pull_request.number == 133 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/v1.0.0-stable-publish' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLISHER_BRANCH: release/v1.0.0-stable-publish
      APPROVAL_BRANCH: release/v1.0.0-human-gate
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
      RC2_SHA: d73d936a63cc9462a95bcf481f4b8e1d4b255719
      RC3_SHA: 7f741e10d0e745a90c732e084400b11e3f5e6794
      STABLE_TAG: v1.0.0
      CONTROL_LOCK_TAG: mcf-control/v1.0.0
      LEANDRO_GITHUB_LOGIN: leon337
      LEANDRO_GITHUB_ID: '25374535'
      APPROVAL_FILE: LEANDRO-HUMAN-GATE.yaml
    steps:
      - name: Prove pull_request workflow provenance and publisher identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = pull_request
          test "$PR_NUMBER" = 133
          test "$EVENT_REF" = "refs/pull/$PR_NUMBER/merge"
          test "$WORKFLOW_REF" = "$REPOSITORY/.github/workflows/mcf-v1-stable-publish-gate.yml@refs/pull/$PR_NUMBER/merge"
          test "$BASE_SHA" = "$RC3_SHA"
          test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$HEAD_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/heads/$PUBLISHER_BRANCH" --jq '.object.sha')" = "$HEAD_SHA"

      - name: Checkout exact immutable publisher head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify canonical LEANDRO identity and RC lineage
        run: |
          set -euo pipefail
          test "$(gh api "users/$LEANDRO_GITHUB_LOGIN" --jq '.login')" = "$LEANDRO_GITHUB_LOGIN"
          test "$(gh api "users/$LEANDRO_GITHUB_LOGIN" --jq '.id')" = "$LEANDRO_GITHUB_ID"
          test "$(gh api "repos/$REPOSITORY" --jq '.owner.login')" = "$LEANDRO_GITHUB_LOGIN"
          test "$(gh api "repos/$REPOSITORY" --jq '.owner.id')" = "$LEANDRO_GITHUB_ID"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/v1.0.0-RC1" --jq '.object.sha')" = "$RC1_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/v1.0.0-RC2" --jq '.object.sha')" = "$RC2_SHA"
          test "$(gh api "repos/$REPOSITORY/git/ref/tags/v1.0.0-RC3" --jq '.object.sha')" = "$RC3_SHA"

      - name: Run dedicated publication-boundary self-tests
        run: |
          set -euo pipefail
          bash -n scripts/mcf-stable-publication-boundary.sh
          bash scripts/mcf-stable-publication-boundary.sh self-test

      - name: Require complete server-side publication protection
        run: |
          set -euo pipefail
          if ! bash scripts/mcf-stable-publication-boundary.sh protection-status >/tmp/protection-state 2>/tmp/protection-error; then
            echo "server_side_publication_protection=MISSING_BLOCKER" >&2
            cat /tmp/protection-error >&2 || true
            exit 1
          fi
          echo "server_side_publication_protection=READY"
          cat /tmp/protection-state

      - name: Confirm separate approval ref is not silently inherited
        run: |
          set -euo pipefail
          if bash scripts/mcf-stable-publication-boundary.sh verify-consumed-gate >/dev/null 2>&1; then
            echo human_gate_state=CONSUMED_PROTECTED
            exit 0
          fi

          approval_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$APPROVAL_BRANCH" --jq '.object.sha')"
          content="$(gh api "repos/$REPOSITORY/contents/$APPROVAL_FILE?ref=$approval_sha" --jq '.content' | tr -d '\n' | base64 --decode)"
          if grep -qx 'state: APROVADO' <<<"$content"; then
            test "$(bash scripts/mcf-stable-publication-boundary.sh verify-human-gate)" = "$approval_sha"
          else
            expected="$(printf 'authority: LEANDRO\nstate: NAO_APROVADO\nrelease: v1.0.0\napproved_publisher_head: null\nrc3: %s\napproval_method: GITHUB_WEB_VERIFIED_COMMIT_REQUIRED\n' "$RC3_SHA")"
            test "$content" = "$expected"
            echo human_gate_state=NAO_APROVADO
          fi

      - name: Verify stable absence or exact protected recovery state
        run: |
          set -euo pipefail
          read_ref_sha() {
            local ref_path="$1" tmp
            tmp="$(mktemp)"
            if gh api "repos/$REPOSITORY/git/ref/$ref_path" >"$tmp" 2>/dev/null; then jq -r '.object.sha' "$tmp"; fi
            rm -f "$tmp"
          }
          stable_ref="$(read_ref_sha "tags/$STABLE_TAG")"
          lock_ref="$(read_ref_sha "tags/$CONTROL_LOCK_TAG")"

          if [[ -z "$stable_ref" && -z "$lock_ref" ]]; then
            if gh api "repos/$REPOSITORY/releases/tags/$STABLE_TAG" >/dev/null 2>&1; then exit 1; fi
            echo stable_state=ABSENT
            exit 0
          fi

          if [[ -n "$stable_ref" && -z "$lock_ref" ]]; then
            test "$stable_ref" = "$RC3_SHA"
            if gh api "repos/$REPOSITORY/releases/tags/$STABLE_TAG" >/dev/null 2>&1; then exit 1; fi
            bash scripts/mcf-stable-publication-boundary.sh verify-human-gate >/dev/null
            bash scripts/mcf-stable-publication-boundary.sh protection-status >/dev/null
            echo stable_state=AUTHORIZED_EXACT_TAG_PENDING_APPROVAL_REF_CONSUMPTION
            exit 0
          fi

          test -n "$stable_ref"
          test -n "$lock_ref"
          bash scripts/mcf-stable-publication-boundary.sh verify-consumed-gate
          if gh api "repos/$REPOSITORY/releases/tags/$STABLE_TAG" >/tmp/stable-release.json 2>/dev/null; then
            test "$(jq -r '.tag_name' /tmp/stable-release.json)" = "$STABLE_TAG"
            test "$(jq -r '.target_commitish' /tmp/stable-release.json)" = "$RC3_SHA"
            test "$(jq -r '.draft' /tmp/stable-release.json)" = false
            test "$(jq -r '.prerelease' /tmp/stable-release.json)" = false
            echo stable_state=AUTHORIZED_PROTECTED_RELEASE_RECOVERY_STATE
          else
            echo stable_state=AUTHORIZED_PROTECTED_TAG_ONLY_RECOVERY_STATE
          fi

  authorize-publication:
    needs: [validate-publication-boundary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLISHER_BRANCH: release/v1.0.0-stable-publish
      APPROVAL_BRANCH: release/v1.0.0-human-gate
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
      RC2_SHA: d73d936a63cc9462a95bcf481f4b8e1d4b255719
      RC3_SHA: 7f741e10d0e745a90c732e084400b11e3f5e6794
      STABLE_TAG: v1.0.0
      CONTROL_LOCK_TAG: mcf-control/v1.0.0
      LEANDRO_GITHUB_LOGIN: leon337
      LEANDRO_GITHUB_ID: '25374535'
      APPROVAL_FILE: LEANDRO-HUMAN-GATE.yaml
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select consumed or direct authority from separate approval ref
        id: gate
        run: |
          set -euo pipefail
          if bash scripts/mcf-stable-publication-boundary.sh verify-consumed-gate >/dev/null 2>&1; then
            echo authority_state=CONSUMED_PROTECTED
            echo approved=true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          approval_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/$APPROVAL_BRANCH" --jq '.object.sha')"
          content="$(gh api "repos/$REPOSITORY/contents/$APPROVAL_FILE?ref=$approval_sha" --jq '.content' | tr -d '\n' | base64 --decode)"
          if grep -qx 'state: NAO_APROVADO' <<<"$content"; then
            echo approved=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(bash scripts/mcf-stable-publication-boundary.sh verify-effective-gate)" = DIRECT_UNCONSUMED
          echo authority_state=DIRECT_UNCONSUMED
          echo approved=true >> "$GITHUB_OUTPUT"

  publish-stable:
    needs: [validate-publication-boundary, authorize-publication]
    if: needs.authorize-publication.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PUBLISHER_BRANCH: release/v1.0.0-stable-publish
      APPROVAL_BRANCH: release/v1.0.0-human-gate
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
      RC2_SHA: d73d936a63cc9462a95bcf481f4b8e1d4b255719
      RC3_SHA: 7f741e10d0e745a90c732e084400b11e3f5e6794
      STABLE_TAG: v1.0.0
      CONTROL_LOCK_TAG: mcf-control/v1.0.0
      LEANDRO_GITHUB_LOGIN: leon337
      LEANDRO_GITHUB_ID: '25374535'
      APPROVAL_FILE: LEANDRO-HUMAN-GATE.yaml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Consume separate approval ref or recover with the same immutable publisher
        run: bash scripts/mcf-stable-publication-boundary.sh publish
