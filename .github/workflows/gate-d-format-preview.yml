name: Gate D Formatting Preview

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-format-preview.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format Gate D files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.permission.test.ts \
            apps/server/src/mcf-runtime/permission-engine.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: gate-d-prettier-3.9.6
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.permission.test.ts
            apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts
