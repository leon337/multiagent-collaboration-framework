name: MCF Control Bridge Format Probe

on:
  push:
    branches:
      - team/mcf-control-bridge-integration-20260822
    paths:
      - apps/rede-social-agentes/apps/server/src/mcf-runtime/control-bridge-g2b.preparation.ts
      - .github/workflows/mcf-control-bridge-format-probe.yml

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write apps/server/src/mcf-runtime/control-bridge-g2b.preparation.ts
          git diff -- apps/server/src/mcf-runtime/control-bridge-g2b.preparation.ts
