name: C2 Accepted Invalid JSON Remediation

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-c2-pr-collaboration-write
          fetch-depth: 0

      - name: Patch mutation ambiguity classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.adapter.ts')
          text = path.read_text()
          old = """function shouldReconcileMutationError(error: unknown): error is ExternalActionAdapterError {
            return (
              error instanceof ExternalActionAdapterError &&
              (error.retryable || error.code === 'RESERVATION_CONFLICT')
            );
          }

          function isAmbiguousMutationError(error: unknown): error is ExternalActionAdapterError {
            return error instanceof ExternalActionAdapterError && error.retryable;
          }
          """
          new = """function isAcceptedInvalidJson(error: ExternalActionAdapterError): boolean {
            return (
              error.code === 'INVALID_RESPONSE' &&
              error.statusCode !== null &&
              error.statusCode >= 200 &&
              error.statusCode < 300
            );
          }

          function shouldReconcileMutationError(error: unknown): error is ExternalActionAdapterError {
            return (
              error instanceof ExternalActionAdapterError &&
              (error.retryable || error.code === 'RESERVATION_CONFLICT' || isAcceptedInvalidJson(error))
            );
          }

          function isAmbiguousMutationError(error: unknown): error is ExternalActionAdapterError {
            return (
              error instanceof ExternalActionAdapterError &&
              (error.retryable || isAcceptedInvalidJson(error))
            );
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one mutation-classification block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format changed C2 files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/github-pr-collaboration.adapter.ts \
            apps/server/src/mcf-runtime/github-pr-collaboration.accepted-invalid-json.test.ts

      - name: Commit remediation if needed
        run: |
          if git diff --quiet; then
            echo "Accepted-invalid-JSON remediation already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.adapter.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.accepted-invalid-json.test.ts
          git commit -m "fix(mcf): reconcile accepted writes with invalid JSON responses"
          git push origin HEAD:feat/mcf-runtime-006-c2-pr-collaboration-write
