name: MCF v1.0.0-RC3 Publication

on:
  workflow_run:
    workflows:
      - MCF Production Readiness
    types:
      - completed

permissions:
  contents: write

jobs:
  publish-rc3:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify publication boundary
        env:
          RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
          RC2_SHA: d73d936a63cc9462a95bcf481f4b8e1d4b255719
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-list -n 1 v1.0.0-RC1)" = "$RC1_SHA"
          test "$(git rev-list -n 1 v1.0.0-RC2)" = "$RC2_SHA"
          test -f docs/releases/MCF-v1.0.0-RC3.md
          test -f docs/decisions/MCF-DEC-064-QUALIFICACAO-DA-RELEASE-ESTAVEL-V1.0.0.md

      - name: Create or verify immutable RC3 tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RC3_TAG: v1.0.0-RC3
          RC3_SHA: 7f741e10d0e745a90c732e084400b11e3f5e6794
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_ref="$(git ls-remote origin "refs/tags/$RC3_TAG" | cut -f1)"

          if [ -n "$existing_ref" ]; then
            test "$existing_ref" = "$RC3_SHA"
            gh release view "$RC3_TAG" --repo "$REPOSITORY" --json isPrerelease,tagName --jq 'select(.isPrerelease == true and .tagName == "v1.0.0-RC3") | .tagName' | grep -qx "$RC3_TAG"
            echo "RC3 already exists at its canonical qualified SHA; immutable NOOP for later main readiness runs."
            exit 0
          fi

          git tag "$RC3_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$RC3_TAG"
          test "$(git ls-remote origin "refs/tags/$RC3_TAG" | cut -f1)" = "$TARGET_SHA"

          gh release create "$RC3_TAG" \
            --repo "$REPOSITORY" \
            --target "$TARGET_SHA" \
            --title 'MCF v1.0.0-RC3' \
            --notes 'Final production candidate after post-RC2 security, deploy and production-monitoring convergence. Stable v1.0.0 remains gated.' \
            --prerelease

          gh release view "$RC3_TAG" --repo "$REPOSITORY" --json isPrerelease,tagName,targetCommitish --jq 'select(.isPrerelease == true and .tagName == "v1.0.0-RC3") | .tagName' | grep -qx "$RC3_TAG"
