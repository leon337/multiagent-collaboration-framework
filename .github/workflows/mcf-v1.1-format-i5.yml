name: MCF v1.1 I5 format correction

on:
  push:
    branches:
      - feat/mcf-v1.1-project-intake-continuity

permissions:
  contents: write

jobs:
  format-i5:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-v1.1-project-intake-continuity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format only I5 files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/project-intake/project-reality-report.service.ts \
            apps/server/src/project-intake/project-reality-report.service.test.ts

      - name: Commit formatter output if needed
        run: |
          if git diff --quiet -- \
            apps/rede-social-agentes/apps/server/src/project-intake/project-reality-report.service.ts \
            apps/rede-social-agentes/apps/server/src/project-intake/project-reality-report.service.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/apps/server/src/project-intake/project-reality-report.service.ts \
            apps/rede-social-agentes/apps/server/src/project-intake/project-reality-report.service.test.ts
          git commit -m "style(v1.1): format I5 reality pipeline"
          git push origin HEAD:feat/mcf-v1.1-project-intake-continuity
