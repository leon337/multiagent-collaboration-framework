name: MCF Gemini Live F2.1 visual consent
on:
  pull_request:
    paths:
      - 'apps/gemini-live-studio/**'
      - 'tests/gemini-live-f2/**'
      - 'artifacts/phases/PHASE-GEMINI-LIVE-EVOLUTION-02/**'
      - '.github/workflows/mcf-gemini-live-f2.yml'
  push:
    branches:
      - feat/gemini-live-f2-multimodal-consent-20261116
permissions:
  contents: read
jobs:
  f2-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate F2 syntax and consent controller
        run: |
          node --check apps/gemini-live-studio/public/app.js
          node --check apps/gemini-live-studio/public/media-policy.js
          node --check apps/gemini-live-studio/server.js
          node --check apps/gemini-live-studio/capability-router.cjs
          node --check apps/gemini-live-studio/vision-adapter.cjs
          node --check apps/gemini-live-studio/public/vision-ui.js
          node --check tests/gemini-live-f2/browser-visual-consent.cjs
          node --check tests/gemini-live-f2/browser-vision-e2e.cjs
          node --test tests/gemini-live-f2/*.test.cjs
      - name: Verify F2 evidence and F3 source boundary
        working-directory: artifacts/phases/PHASE-GEMINI-LIVE-EVOLUTION-02
        run: |
          # F2 source manifest is pinned to the F2 commit; F3 intentionally
          # changes app.js/server.js/UI. Its own complete source manifest is
          # validated by mcf-gemini-live-f3.yml, never relabel F2 E2E as F3.
          if [ -f ../PHASE-GEMINI-LIVE-EVOLUTION-03/PHASE-03-SOURCE-MANIFEST.sha256 ]; then
            echo "F2 source manifest is historical; current source is verified by F3 source manifest"
          else
            sha256sum -c PHASE-02-SOURCE-MANIFEST.sha256
          fi
          sha256sum -c PHASE-02-ARTIFACT-MANIFEST.sha256
      - name: Scan new F2 files for secrets
        run: |
          if grep -nE 'AIza[A-Za-z0-9_-]{25,}|sk-[A-Za-z0-9_-]{25,}' apps/gemini-live-studio/public/media-policy.js tests/gemini-live-f2/*.cjs; then
            echo "Potential secret in F2 source"; exit 1
          fi
