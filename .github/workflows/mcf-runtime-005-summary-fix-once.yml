name: MCF Runtime 005 Summary Fix Once

on:
  push:
    branches:
      - feat/mcf-runtime-staging-deploy-recovery
    paths:
      - .github/workflows/mcf-runtime-005-summary-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-staging-deploy-recovery

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Persist deployment summary evidence
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/rede-social-agentes/ops/render-staging-deploy.mjs')
          text = path.read_text()

          import_anchor = "import { pathToFileURL, URL } from 'node:url';"
          import_replacement = (
              "import { appendFileSync } from 'node:fs';\n"
              "import { pathToFileURL, URL } from 'node:url';"
          )
          if text.count(import_anchor) != 1:
              raise SystemExit('node:url import did not match exactly once')
          text = text.replace(import_anchor, import_replacement, 1)

          old_write = "  process.stdout.write(`::notice::${lines.join(' ')}\\n`);"
          new_write = "  appendFileSync(path, `${lines.join('\\n')}\\n`, 'utf8');"
          if text.count(old_write) != 1:
              raise SystemExit('summary writer did not match exactly once')
          text = text.replace(old_write, new_write, 1)
          path.write_text(text)
          PY

      - name: Format and lint correction
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write ops/render-staging-deploy.mjs
          pnpm exec eslint ops/render-staging-deploy.mjs

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/ops/render-staging-deploy.mjs
          git commit -m "fix(mcf): persist staging deployment evidence summary"
          git push origin HEAD:feat/mcf-runtime-staging-deploy-recovery
