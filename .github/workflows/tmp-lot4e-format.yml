name: TEMP Lot 4E format

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-e-close-phase

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Lot 4-E source and tests
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/internal-skill-evidence.ts \
            apps/server/src/mcf-runtime/mission-runtime-lot4-close-phase.integration.test.ts \
            apps/server/src/mcf-runtime/permission-engine.ts \
            apps/server/src/mcf-runtime/skill-executor-lot4-close-phase.test.ts
      - name: Commit formatting
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-runtime-lot4-close-phase.integration.test.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor-lot4-close-phase.test.ts
          git diff --cached --check
          git commit -m 'style(runtime): format Lot 4-E candidate'
          git push origin HEAD:${GITHUB_REF_NAME}
