name: Gate D P1 Global Dispatch Fix V5

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-p1-global-dispatch-fix-v5.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Apply corrected V3 payloads
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          helper = Path('.github/workflows/gate-d-p1-global-dispatch-fix-v3.yml').read_text()

          def payload(name: str) -> bytes:
              pattern = rf'^\s*{name}:\s*"([A-Za-z0-9+/=]+)"\s*$'
              matches = re.findall(pattern, helper, re.M)
              if len(matches) != 1:
                  raise SystemExit(f'{name} expected exactly once, found {len(matches)}')
              return base64.b64decode(matches[0], validate=True)

          patch = payload('PATCH_B64')
          replacements = [
              (
                  b'apps/rede-social-agentes/app/server/src/mcf-runtime/external-action-ledger.ts',
                  b'apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts',
              ),
              (
                  b'text = text[\\ : match.end()] + constants_suffix + text[match.end() :]',
                  b'text = text[: match.end()] + constants_suffix + text[match.end() :]',
              ),
          ]
          for bad, good in replacements:
              count = patch.count(bad)
              if count != 1:
                  raise SystemExit(f'expected one known V3 defect {bad!r}, found {count}')
              patch = patch.replace(bad, good)

          Path('/tmp/gate-d-global-claim.py').write_bytes(patch)
          target = Path(
              'apps/rede-social-agentes/apps/server/src/mcf-runtime/'
              'github-staging-deploy.global-idempotency.integration.test.ts'
          )
          target.write_bytes(payload('TEST_B64'))
          PY
          python /tmp/gate-d-global-claim.py
      - name: Format and validate targeted concurrency boundary
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          pnpm exec prettier --check \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          pnpm build:packages
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/server typecheck
          pnpm --filter @rsa/server exec vitest run \
            src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts \
            src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/gate-d-p1-global-dispatch-fix.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v2.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v3.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v4.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v5.yml
      - name: Enforce exact changed path set
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-p1-global-dispatch-fix-v2.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v3.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v4.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v5.yml
          .github/workflows/gate-d-p1-global-dispatch-fix.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          EOF
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit P1 global dispatch remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          git commit -m 'fix(gate-d): serialize concurrent staging dispatches'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
