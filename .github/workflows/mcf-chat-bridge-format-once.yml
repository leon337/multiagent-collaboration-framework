name: MCF Chat Bridge Format Once

on:
  push:
    branches:
      - feat/mcf-chat-runtime-bridge
    paths:
      - .github/workflows/mcf-chat-bridge-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-chat-runtime-bridge

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        working-directory: apps/rede-social-agentes
        run: >-
          pnpm exec prettier --write
          apps/server/src/mcf-runtime/chat-runtime-bridge.controller.ts
          packages/contracts/src/mcf-runtime.ts

      - name: Commit formatting result
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-runtime-bridge.controller.ts \
            apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts
          git commit -m "style(mcf): apply canonical Prettier formatting"
          git push origin HEAD:feat/mcf-chat-runtime-bridge
