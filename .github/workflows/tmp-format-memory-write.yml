name: TEMP format memory write adapter

on:
  push:
    branches:
      - feat/mcf-cognitive-ledger-memory-write-20260918
    paths:
      - '.github/workflows/tmp-format-memory-write.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-cognitive-ledger-memory-write-20260918
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec prettier --write             apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write-api.service.ts             apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write-api.service.test.ts             apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write-token.guard.ts             apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write-token.guard.test.ts             apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write.controller.test.ts
          git diff --check
          git diff
      - name: Self-remove and commit formatting
        run: |
          rm .github/workflows/tmp-format-memory-write.yml
          git config user.name "mcf-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-context/mcf-ledger-write-*.ts
          git add .github/workflows/tmp-format-memory-write.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(memory): format governed write adapter"
          git push origin HEAD:feat/mcf-cognitive-ledger-memory-write-20260918
