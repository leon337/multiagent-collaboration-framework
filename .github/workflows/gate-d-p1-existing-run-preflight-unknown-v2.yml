name: Gate D P1 Existing Run Preflight UNKNOWN V2

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Apply existing-run preflight UNKNOWN remediation
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts')
          text = adapter.read_text()

          run_marker = '    const runWasExisting = run !== null;\n'
          run_pos = text.index(run_marker) + len(run_marker)
          start_marker = '    const before = await this.client.observeStaging(this.stagingRuntimeUrl, deadlineAt, budget);\n'
          start = text.index(start_marker, run_pos)
          end_marker = '\n    if (!run) {\n'
          end = text.index(end_marker, start)
          block = text[start:end]

          required = ['observeStaging', '/git/ref/heads/main', '/commits/${target.releaseSha}', '/compare/${target.releaseSha}...${mainSha}']
          for needle in required:
              if needle not in block:
                  raise SystemExit(f'preflight block missing expected marker: {needle}')

          lines = block.splitlines()
          normalized = [line[4:] if line.startswith('    ') else line for line in lines]
          if not normalized or not normalized[0].startswith('const before ='):
              raise SystemExit('preflight first statement mismatch')
          normalized[0] = normalized[0].replace('const before =', 'before =', 1)
          inner = '\n'.join(('      ' + line) if line else line for line in normalized)
          error_expr = '${' + "error instanceof Error ? error.message : 'unknown preflight error'" + '}'

          replacement = """    let before: StagingObservation;
          try {
          __INNER__
          } catch (error) {
            if (runWasExisting) {
              return this.unknownReceipt(
                request,
                target,
                null,
                run,
                `existing correlated workflow run could not be safely reconciled during preflight: __ERROR_EXPR__`,
                budget,
              );
            }
            throw error;
          }""".replace('__INNER__', inner).replace('__ERROR_EXPR__', error_expr)
          adapter.write_text(text[:start] + replacement + text[end:])

          test = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts')
          text = test.read_text()
          anchor = "  it('proves recovery only when the previous healthy SHA is restored', async () => {\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'test anchor expected once, found {text.count(anchor)}')

          regressions = """  it('returns PARTIAL when one existing correlated run is present and staging preflight is unhealthy', async () => {
            const provider = fakeProvider({ existing: true, unhealthyBefore: true });
            const receipt = await adapter(provider).execute(request());

            expect(provider.dispatches).toBe(0);
            expect(receipt.status).toBe('PARTIAL');
            expect(receipt.metadata.deploymentOutcome).toBe('UNKNOWN');
            expect(receipt.metadata.previousSha).toBeNull();
            expect(receipt.metadata.unknownReason).toMatch(/existing correlated workflow run.*preflight/u);
            expect(provider.requests.some((entry) => entry.startsWith('POST '))).toBe(false);
          });

          it('returns PARTIAL when one existing correlated run is present and ancestry preflight rejects', async () => {
            const provider = fakeProvider({ existing: true, nonAncestor: true });
            const receipt = await adapter(provider).execute(request());

            expect(provider.dispatches).toBe(0);
            expect(receipt.status).toBe('PARTIAL');
            expect(receipt.metadata.deploymentOutcome).toBe('UNKNOWN');
            expect(receipt.metadata.previousSha).toBeNull();
            expect(receipt.metadata.unknownReason).toMatch(/existing correlated workflow run.*preflight/u);
            expect(provider.requests.some((entry) => entry.startsWith('POST '))).toBe(false);
          });

          """
          test.write_text(text.replace(anchor, regressions + anchor, 1))
          PY
      - name: Format and validate
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          pnpm exec prettier --check apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          pnpm build:packages
          pnpm --filter @rsa/server typecheck
          pnpm --filter @rsa/server exec vitest run src/mcf-runtime/github-staging-deploy.adapter.test.ts src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/gate-d-p1-existing-run-preflight-unknown.yml
          git rm .github/workflows/gate-d-p1-existing-run-preflight-unknown-v2.yml
      - name: Enforce exact changed path set
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-p1-existing-run-preflight-unknown-v2.yml
          .github/workflows/gate-d-p1-existing-run-preflight-unknown.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts
          EOF
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          git commit -m 'fix(gate-d): persist UNKNOWN for existing-run preflight ambiguity'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
