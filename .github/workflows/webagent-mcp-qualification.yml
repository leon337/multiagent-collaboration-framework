name: WebAgent MCP Qualification

on:
  push:
    branches:
      - 'mission/webagent-*'
    paths:
      - 'apps/webagent-mcp/**'
      - '.github/workflows/webagent-mcp-qualification.yml'
  pull_request:
    paths:
      - 'apps/webagent-mcp/**'
      - '.github/workflows/webagent-mcp-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/webagent-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/webagent-mcp/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
