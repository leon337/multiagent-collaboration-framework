name: Rede Social Migration Checksum Manifest

on:
  pull_request:
    paths:
      - ".github/workflows/rede-social-migration-checksum-manifest.yml"
      - "apps/rede-social-agentes/packages/database/migrations/**"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: ops/rede-social-free-provisioning-evidence

      - name: Generate SHA-256 manifest
        run: |
          mkdir -p docs/evidence
          find apps/rede-social-agentes/packages/database/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  apps/rede-social-agentes/packages/database/migrations/#  #' \
            > docs/evidence/RSA-NEON-MIGRATION-SHA256.txt

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/RSA-NEON-MIGRATION-SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "docs(evidence): registrar checksums das migrações"
            git push origin HEAD:ops/rede-social-free-provisioning-evidence
          fi
