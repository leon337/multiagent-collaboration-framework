name: A2 Remediation Validation Temporary

on:
  push:
    branches:
      - ci/mcf-runtime-006-a2-remediation-20260806
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/rede-social-agentes

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      VALIDATED_SHA: 7e3f9f1e8ffd31d29566a98da6557b1a26d8982d

    steps:
      - name: Checkout exact remediation SHA
        uses: actions/checkout@v4
        with:
          ref: 7e3f9f1e8ffd31d29566a98da6557b1a26d8982d

      - name: Prove checked out SHA
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
        working-directory: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migration twice
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
