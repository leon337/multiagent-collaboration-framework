name: MCF v1.1 Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/rede-social-agentes/**"
      - ".github/scripts/mcf-v11-qualification.mjs"
      - ".github/scripts/mcf-v11-qualification-exact-head.mjs"
      - ".github/scripts/mcf-v11-scenario-evidence.mjs"
      - ".github/workflows/mcf-v11-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      MCF_V10_BASELINE_SHA: b91823a947715e09d69c72999e2278523f2259be
      MCF_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate HEAD
        shell: bash
        run: |
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$MCF_CANDIDATE_SHA"
          echo "TESTED_HEAD=$observed" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies from lockfile
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        working-directory: apps/rede-social-agentes
        run: pnpm format:check

      - name: Lint
        working-directory: apps/rede-social-agentes
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/rede-social-agentes
        run: pnpm typecheck

      - name: Run database migration twice
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Run full blocking regression
        working-directory: apps/rede-social-agentes
        run: pnpm test

      - name: Build workspace
        working-directory: apps/rede-social-agentes
        run: pnpm build

      - name: Build Q19 evidence ledger
        run: node .github/scripts/mcf-v11-qualification-exact-head.mjs

      - name: Validate dedicated Q19 scenario evidence
        run: node .github/scripts/mcf-v11-scenario-evidence.mjs

      - name: Upload exact-head qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcf-v11-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/mcf-v1.1-qualification/evidence-ledger.json
            apps/rede-social-agentes/apps/server/test-results/vitest.json
          if-no-files-found: error
          retention-days: 30
