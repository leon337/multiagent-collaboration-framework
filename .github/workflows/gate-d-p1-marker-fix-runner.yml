name: Gate D P1 Marker Fix Runner

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-p1-marker-fix-runner.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Apply already-audited P1 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          helper = Path('.github/workflows/gate-d-p1-marker-fix.yml').read_text()
          match = re.search(r'^\s*PATCH_B64:\s*"([A-Za-z0-9+/=]+)"\s*$', helper, re.M)
          if not match:
              raise SystemExit('PATCH_B64 not found exactly once in existing helper')
          Path('/tmp/gate-d-p1.py').write_bytes(base64.b64decode(match.group(1), validate=True))
          PY
          python /tmp/gate-d-p1.py
      - name: Format and run targeted regression
        working-directory: apps/rede-social-agentes
        env:
          DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
          NODE_ENV: test
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          pnpm exec prettier --check \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          pnpm --filter @rsa/server exec vitest run src/mcf-runtime/github-staging-deploy.adapter.test.ts
      - name: Remove temporary helpers
        run: |
          git rm .github/workflows/gate-d-p1-marker-fix.yml
          git rm .github/workflows/gate-d-p1-marker-fix-runner.yml
      - name: Enforce exact changed path set
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-p1-marker-fix-runner.yml
          .github/workflows/gate-d-p1-marker-fix.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts
          EOF
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit P1 remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          git commit -m 'fix(gate-d): reject duplicate deployment markers'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
