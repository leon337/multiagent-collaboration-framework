name: Rede Social Foundation

on:
  pull_request:
    paths:
      - "apps/rede-social-agentes/**"
      - ".github/workflows/rede-social-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/rede-social-agentes

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Apply official formatting
        run: pnpm format

      - name: Commit generated artifacts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web/src/App.tsx apps/web/src/styles.css apps/web/tsconfig.json compose.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(rede-social): fixar lockfile e formatação"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migration
        run: pnpm --filter @rsa/database db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
