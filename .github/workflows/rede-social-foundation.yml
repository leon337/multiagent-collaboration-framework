name: Rede Social Foundation

on:
  pull_request:
    paths:
      - "apps/rede-social-agentes/**"
      - ".github/workflows/rede-social-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/rede-social-agentes

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: rede-social-foundation-lockfile
          path: apps/rede-social-agentes/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Apply official formatting
        run: pnpm format

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: rede-social-foundation-formatted-source
          path: |
            apps/rede-social-agentes/apps/web/src/App.tsx
            apps/rede-social-agentes/apps/web/src/styles.css
            apps/rede-social-agentes/apps/web/tsconfig.json
            apps/rede-social-agentes/compose.yaml
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migration
        run: pnpm --filter @rsa/database db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
