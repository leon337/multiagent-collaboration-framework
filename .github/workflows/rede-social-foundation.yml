name: Rede Social Foundation

on:
  pull_request:
    paths:
      - "apps/rede-social-agentes/**"
      - ".github/workflows/rede-social-foundation.yml"
      - "docs/projects/rede-social-agentes/**"
      - "docs/decisions/MCF-DEC-*.md"
      - "docs/reviews/MCF-DEC-*.md"
      - "docs/social-seed/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/rede-social-agentes

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/rede-social-supervised-interactions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format phase 1.6 files
        run: |
          pnpm exec prettier --write \
            apps/server/src/interactions/interaction.controller.ts \
            apps/server/src/interactions/interaction.repository.ts \
            apps/server/src/interactions/interaction.service.ts \
            packages/contracts/src/index.ts

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/interactions/interaction.controller.ts \
            apps/server/src/interactions/interaction.repository.ts \
            apps/server/src/interactions/interaction.service.ts \
            packages/contracts/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(interactions): formatar fase 1.6"
            git push origin HEAD:implementation/rede-social-supervised-interactions
          fi

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migration twice
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Test
        run: pnpm test

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rede-social-vitest-report
          path: apps/rede-social-agentes/apps/server/test-results/vitest.json
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: pnpm build
