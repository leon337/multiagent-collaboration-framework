name: Content Studio N4 Validation

on:
  pull_request:
    paths:
      - 'experimentos/mcf-content-studio-n4/**'
      - '.github/workflows/content-studio-n4-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: experimentos/mcf-content-studio-n4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify
        run: pnpm verify

      - name: Render full component matrix
        run: pnpm qa:matrix

      - name: Browser smoke and preview benchmark
        run: pnpm qa:browser

      - name: Technical adversarial audit
        run: pnpm audit:technical

      - name: Render smoke and stress stills
        run: |
          mkdir -p out
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewPortrait out/bounce-portrait.png --frame=45
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewLandscape out/bounce-landscape.png --frame=45
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewReducedMotion out/bounce-reduced-motion.png --frame=45
          pnpm exec remotion still src/remotion/index.ts RuntimeAgenticoPilot out/runtime-agentico-pilot.png --frame=900
          pnpm exec remotion still src/remotion/index.ts LongFocusConceptQa out/qa-long-focus.png --frame=90
          pnpm exec remotion still src/remotion/index.ts LongTimelineQa out/qa-long-timeline.png --frame=120
          pnpm exec remotion still src/remotion/index.ts LongDiagramQa out/qa-long-diagram.png --frame=120

      - name: Benchmark
        run: node scripts/benchmark.mjs

      - name: Upload visual and benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-studio-n4-evidence-${{ github.sha }}
          path: |
            experimentos/mcf-content-studio-n4/out/*.png
            experimentos/mcf-content-studio-n4/out/*.json
            experimentos/mcf-content-studio-n4/out/component-matrix/*.png
          if-no-files-found: error
          retention-days: 14
