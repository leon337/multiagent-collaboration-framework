name: Content Studio N4 Validation

on:
  pull_request:
    paths:
      - 'experimentos/mcf-content-studio-n4/**'
      - '.github/workflows/content-studio-n4-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: experimentos/mcf-content-studio-n4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Verify
        run: pnpm verify

      - name: Render smoke stills
        run: |
          mkdir -p out
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewPortrait out/bounce-portrait.png --frame=45
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewLandscape out/bounce-landscape.png --frame=45
          pnpm exec remotion still src/remotion/index.ts BounceHeadlinePreviewReducedMotion out/bounce-reduced-motion.png --frame=45
          pnpm exec remotion still src/remotion/index.ts RuntimeAgenticoPilot out/runtime-agentico-pilot.png --frame=900

      - name: Upload smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: content-studio-n4-smoke-${{ github.sha }}
          path: experimentos/mcf-content-studio-n4/out/*.png
          if-no-files-found: error
          retention-days: 14
