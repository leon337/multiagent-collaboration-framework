name: MCF Runtime Format Integration Test Once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mcf-runtime-format-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.head_ref == 'feat/mcf-runtime-five-sprints' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format runtime integration test
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime/postgres-mcf-runtime.repository.integration.test.ts

      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/postgres-mcf-runtime.repository.integration.test.ts
          git commit -m "chore(mcf): format runtime integration test"
          git push origin HEAD:${{ github.head_ref }}
