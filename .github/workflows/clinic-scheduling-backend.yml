name: clinic-scheduling-backend
on:
  push:
    paths:
      - "apps/clinic-scheduling/**"
      - ".github/workflows/clinic-scheduling-backend.yml"
  pull_request:
    paths:
      - "apps/clinic-scheduling/**"
      - ".github/workflows/clinic-scheduling-backend.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_scheduling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_scheduling_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/clinic-scheduling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_scheduling_test
