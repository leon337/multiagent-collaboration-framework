name: Gate D P1 Long Workflow Reconciliation

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-p1-long-workflow-reconciliation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Apply P1 long-workflow reconciliation
        run: |
          set -euo pipefail
          sed -i 's/parents\[2\]/parents[3]/' apps/rede-social-agentes/ops/gate-d-p1-long-workflow-reconciliation.py
          python - <<'PY'
          from pathlib import Path

          dollar = chr(36)
          anchor = (
              "assert.match(workflow, /run-name:\\s*MCF staging deploy \\" + dollar
              + "{{ inputs\\.request_id \\|\\| 'push' }} \\" + dollar
              + "{{ inputs\\.release_sha \\|\\| github\\.sha }}/u);"
          )
          fixture = """/* global process */
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = dirname(fileURLToPath(import.meta.url));
          const repoRoot = resolve(here, '../../..');
          const workflow = readFileSync(resolve(repoRoot, '.github/workflows/mcf-runtime-staging-deploy.yml'), 'utf8');
          """ + anchor + """
          assert.match(workflow, /request_id:/u);
          assert.match(workflow, /REQUEST_ID:/u);
          assert.match(workflow, /id: deploy/u);
          assert.match(workflow, /Deployment result DEPLOYED/u);
          assert.match(workflow, /Deployment result NOOP/u);
          assert.match(workflow, /Deployment result RECOVERED/u);
          assert.match(workflow, /RENDER_DEPLOY_HOOK_URL: .*secrets\\.RENDER_DEPLOY_HOOK_URL/u);
          assert.doesNotMatch(workflow, /RENDER_DEPLOY_HOOK_URL: .*inputs\\./u);
          console.log('staging workflow correlation tests passed');
          """
          Path('apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs').write_text(fixture)
          PY
          if ! python apps/rede-social-agentes/ops/gate-d-p1-long-workflow-reconciliation.py 2> /tmp/gate-d-reconciliation.err; then
            cat /tmp/gate-d-reconciliation.err >&2
            message=$(tail -n 1 /tmp/gate-d-reconciliation.err | tr '\n' ' ')
            echo "::error title=Gate D reconciliation script failed::${message}"
            exit 1
          fi
          cat /tmp/gate-d-reconciliation.err >&2 || true
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one supplemental anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts',
              "type ExternalAttemptStatus =\n",
              "export type ExternalAttemptStatus =\n",
          )
          replace_once(
              'apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts',
              "  title = `MCF staging deploy ${KEY} ${RELEASE_SHA}`,\n",
              "  title = `MCF staging deploy ${KEY} ${RELEASE_SHA} mission-gate-d phase-gate-d`,\n",
          )
          replace_once(
              'apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.test.ts',
              "      workflowDisplayTitle: `MCF staging deploy ${KEY} ${RELEASE_SHA}`,\n",
              "      workflowDisplayTitle: `MCF staging deploy ${KEY} ${RELEASE_SHA} ${context.executionContext.missionId} ${context.executionContext.phaseId}`,\n",
          )
          PY
      - name: Format targeted files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            ../../.github/workflows/mcf-runtime-staging-deploy.yml \
            ../../.github/workflows/mcf-runtime-staging-deploy-callback.yml \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.evidence.test.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/server/src/mcf-runtime/staging-deploy-callback.controller.ts \
            apps/server/src/mcf-runtime/staging-deploy-reconciliation.service.ts \
            ops/staging-workflow-correlation.test.mjs
          pnpm exec prettier --check \
            ../../.github/workflows/mcf-runtime-staging-deploy.yml \
            ../../.github/workflows/mcf-runtime-staging-deploy-callback.yml \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.evidence.test.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/server/src/mcf-runtime/staging-deploy-callback.controller.ts \
            apps/server/src/mcf-runtime/staging-deploy-reconciliation.service.ts \
            ops/staging-workflow-correlation.test.mjs
      - name: Build, typecheck and run Gate D regressions
        working-directory: apps/rede-social-agentes
        run: |
          pnpm build:packages
          pnpm --filter @rsa/server typecheck
          pnpm --filter @rsa/server exec vitest run \
            src/mcf-runtime/github-staging-deploy.adapter.test.ts \
            src/mcf-runtime/github-staging-deploy.evidence.test.ts \
            src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts
          node ops/staging-workflow-correlation.test.mjs
      - name: Remove disposable remediation helpers
        run: |
          git rm apps/rede-social-agentes/ops/gate-d-p1-long-workflow-reconciliation.py
          git rm .github/workflows/gate-d-p1-long-workflow-reconciliation.yml
      - name: Audit changed paths
        run: |
          set -euo pipefail
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-p1-long-workflow-reconciliation.yml
          .github/workflows/mcf-runtime-staging-deploy-callback.yml
          .github/workflows/mcf-runtime-staging-deploy.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.test.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/mcf-runtime.module.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-callback.controller.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-reconciliation.service.ts
          apps/rede-social-agentes/ops/gate-d-p1-long-workflow-reconciliation.py
          apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs
          EOF
          git add -N .github/workflows/mcf-runtime-staging-deploy-callback.yml \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-callback.controller.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-reconciliation.service.ts
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit validated P1 remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/mcf-runtime-staging-deploy-callback.yml \
            .github/workflows/mcf-runtime-staging-deploy.yml \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.evidence.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-callback.controller.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/staging-deploy-reconciliation.service.ts \
            apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs
          git commit -m 'fix(gate-d): reconcile long staging workflows asynchronously'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
