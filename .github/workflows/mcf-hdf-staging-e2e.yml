name: MCF HDF Staging E2E

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mcf-hdf-staging-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-hdf-staging-e2e
  cancel-in-progress: false

jobs:
  validate-human-delegation-firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MCF_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}

    steps:
      - name: Validate staging configuration
        run: test -n "$MCF_RUNTIME_URL"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Verify HDF contract and handoff barriers
        env:
          TECHNICAL_EMAIL: mcf-hdf-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const baseUrl = process.env.MCF_RUNTIME_URL.replace(/\/$/u, '');
          let sessionToken = '';

          async function request(path, method, body, token) {
            const response = await fetch(`${baseUrl}${path}`, {
              method,
              headers: {
                ...(body === undefined ? {} : { 'content-type': 'application/json' }),
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            const text = await response.text();
            let data;
            try {
              data = text ? JSON.parse(text) : {};
            } catch {
              data = { raw: text };
            }
            return { response, data };
          }

          async function requireSuccess(path, method, body, token) {
            const result = await request(path, method, body, token);
            if (!result.response.ok) {
              throw new Error(
                `${method} ${path} failed (${result.response.status}): ${JSON.stringify(result.data)}`,
              );
            }
            return result.data;
          }

          function assertBlocked(result, messageFragment) {
            if (result.response.status !== 403) {
              throw new Error(
                `Expected HTTP 403, received ${result.response.status}: ${JSON.stringify(result.data)}`,
              );
            }
            if (result.data.code !== 'MCF_PERMISSION_DENIED') {
              throw new Error(`Unexpected error code: ${JSON.stringify(result.data)}`);
            }
            if (
              typeof result.data.message !== 'string' ||
              !result.data.message.includes(messageFragment)
            ) {
              throw new Error(`Unexpected HDF message: ${JSON.stringify(result.data)}`);
            }
          }

          (async () => {
            const password = `${crypto.randomBytes(36).toString('base64url')}Aa1!`;

            try {
              await requireSuccess('/v1/accounts', 'POST', {
                email: process.env.TECHNICAL_EMAIL,
                password,
                displayName: 'MCF HDF Staging E2E',
              });

              const session = await requireSuccess('/v1/sessions', 'POST', {
                email: process.env.TECHNICAL_EMAIL,
                password,
              });
              if (!session.token) {
                throw new Error('Session response did not contain a token.');
              }
              sessionToken = session.token;
              console.log(`::add-mask::${sessionToken}`);

              const invalidContract = await request(
                '/v1/mcf/missions',
                'POST',
                {
                  contract: {
                    title: 'MCF HDF Invalid Contract E2E',
                    objective: 'Comprovar que Leandro não entra no conjunto de agentes técnicos.',
                    expectedOutcome: 'Contrato rejeitado antes da persistência.',
                    scope: ['staging', 'human-delegation-firewall'],
                    outOfScope: ['production', 'public-release', 'financial-action'],
                    acceptanceCriteria: ['contrato recebe HTTP 403'],
                    riskClass: 'B',
                    selectedAgents: ['Mestre', 'Leandro'],
                    selectedSkills: ['MCF-SELECT-AGENTS'],
                    sourceOfTruth: [
                      'docs/decisions/MCF-DEC-055-HUMAN-DELEGATION-FIREWALL.md',
                      'apps/rede-social-agentes/apps/server/src/mcf-runtime/human-delegation-guard.ts',
                    ],
                  },
                },
                sessionToken,
              );
              assertBlocked(invalidContract, 'cannot be selected as a mission agent');

              const mission = await requireSuccess(
                '/v1/mcf/missions',
                'POST',
                {
                  contract: {
                    title: 'MCF HDF Handoff E2E',
                    objective: 'Comprovar que Leandro não recebe handoff técnico.',
                    expectedOutcome: 'Handoff rejeitado sem efeitos de fase ou ferramenta.',
                    scope: ['staging', 'human-delegation-firewall'],
                    outOfScope: ['production', 'public-release', 'financial-action'],
                    acceptanceCriteria: [
                      'handoff para Leandro recebe HTTP 403',
                      'nenhum evento de fase ou ferramenta é persistido',
                    ],
                    riskClass: 'B',
                    selectedAgents: ['Mestre', 'Rafael'],
                    selectedSkills: ['MCF-SELECT-AGENTS'],
                    sourceOfTruth: [
                      'docs/decisions/MCF-DEC-055-HUMAN-DELEGATION-FIREWALL.md',
                      'apps/rede-social-agentes/apps/server/src/mcf-runtime/human-delegation-guard.ts',
                    ],
                  },
                },
                sessionToken,
              );

              const blockedHandoff = await request(
                `/v1/mcf/missions/${mission.id}/phases/execute`,
                'POST',
                {
                  skillId: 'MCF-SELECT-AGENTS',
                  agentId: 'Mestre',
                  inputs: {
                    mission_contract: mission.contract,
                    risk_class: 'B',
                    selected_domain_agent: 'Leandro',
                  },
                  tool: {
                    provider: 'internal',
                    operation: 'inspect-selection',
                    resource: 'mcf-chat-bridge',
                  },
                  expectedMissionVersion: mission.version,
                },
                sessionToken,
              );
              assertBlocked(blockedHandoff, 'cannot receive a technical handoff');

              const timeline = await requireSuccess(
                `/v1/mcf/missions/${mission.id}/timeline`,
                'GET',
                undefined,
                sessionToken,
              );
              const forbiddenEvents = new Set([
                'PHASE_STARTED',
                'PERMISSION_GRANTED',
                'TOOL_REQUESTED',
                'TOOL_RECEIPT_RECORDED',
                'HANDOFF_CREATED',
              ]);
              const sideEffects = timeline.events.filter((event) =>
                forbiddenEvents.has(event.eventType),
              );
              if (sideEffects.length !== 0) {
                throw new Error(
                  `HDF rejection persisted forbidden side effects: ${JSON.stringify(sideEffects)}`,
                );
              }

              fs.appendFileSync(
                process.env.GITHUB_STEP_SUMMARY,
                [
                  '## Human Delegation Firewall — staging',
                  '',
                  '- Contract containing Leandro: `HTTP 403`',
                  '- Technical handoff to Leandro: `HTTP 403`',
                  `- Valid control mission: \`${mission.id}\``,
                  `- Timeline events after rejected handoff: \`${timeline.events.length}\``,
                  '- Forbidden phase/tool side effects: `0`',
                  '- Session revoked: `true`',
                  '- Verdict: `PASS`',
                  '',
                ].join('\n'),
              );
            } finally {
              if (sessionToken) {
                const revoked = await request(
                  '/v1/sessions/current',
                  'DELETE',
                  undefined,
                  sessionToken,
                );
                if (!revoked.response.ok) {
                  throw new Error(
                    `Session revocation failed (${revoked.response.status}): ${JSON.stringify(revoked.data)}`,
                  );
                }
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
