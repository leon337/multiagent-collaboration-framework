name: Temporary Astryx Pilot Artifact Commit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

concurrency:
  group: mcf-astryx-artifact-commit-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  commit-pilot-artifacts:
    if: github.head_ref == 'feat/mcf-astryx-governed-scaffolding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Download successful pilot run artifacts
        uses: actions/download-artifact@v4
        with:
          name: mcf-astryx-fullstack-pilot-baselines
          run-id: 45500534771
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/astryx-pilot-artifacts
      - name: Commit lockfile and reviewed visual baselines
        run: |
          cp /tmp/astryx-pilot-artifacts/package-lock.json examples/astryx-fullstack-pilot/package-lock.json
          cp /tmp/astryx-pilot-artifacts/visual-baselines.json examples/astryx-fullstack-pilot/visual-baselines.json
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/mcf-astryx-fullstack-pilot.yml")
          lines = path.read_text().splitlines()
          updated = []
          index = 0
          install_replaced = False
          baseline_replaced = False

          while index < len(lines):
              stripped = lines[index].strip()
              if stripped == "- name: Install pinned pilot dependencies and create lockfile if absent":
                  updated.append("      - name: Install pinned pilot dependencies from committed lockfile")
                  index += 1
                  while index < len(lines) and not lines[index].startswith("      - "):
                      index += 1
                  updated.append("        run: npm ci --no-audit --no-fund")
                  install_replaced = True
                  continue

              if stripped == "- name: Run API, database, browser, accessibility and visual checks":
                  updated.append(lines[index])
                  index += 1
                  if index < len(lines) and lines[index].strip() == "env:":
                      index += 1
                      while index < len(lines) and lines[index].startswith("          "):
                          index += 1
                  if index < len(lines) and lines[index].strip() == "run: npm run test:e2e":
                      updated.append("        run: npm run test:e2e")
                      index += 1
                  baseline_replaced = True
                  continue

              updated.append(lines[index])
              index += 1

          content = "\n".join(updated) + "\n"
          if not install_replaced and "npm install --no-audit" in content:
              raise SystemExit("Could not replace the first-run npm install block.")
          if not baseline_replaced and "UPDATE_VISUAL_BASELINES" in content:
              raise SystemExit("Could not disable visual-baseline update mode.")
          if "UPDATE_VISUAL_BASELINES" in content or "npm install --no-audit" in content:
              raise SystemExit("Pilot workflow still contains bootstrap-only dependency or baseline mode.")
          path.write_text(content)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/astryx-fullstack-pilot/package-lock.json examples/astryx-fullstack-pilot/visual-baselines.json .github/workflows/mcf-astryx-fullstack-pilot.yml
          if git diff --cached --quiet; then
            echo "Pilot artifacts already committed."
            exit 0
          fi
          git commit -m "test(astryx): pin pilot lockfile and visual baselines"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
