name: Temporary Astryx Pilot Artifact Commit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write

concurrency:
  group: mcf-astryx-artifact-commit-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  commit-pilot-artifacts:
    if: github.head_ref == 'feat/mcf-astryx-governed-scaffolding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Download successful pilot run artifacts
        uses: actions/download-artifact@v4
        with:
          name: mcf-astryx-fullstack-pilot-baselines
          run-id: 45500534771
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/astryx-pilot-artifacts
      - name: Commit lockfile and reviewed visual baselines
        run: |
          cp /tmp/astryx-pilot-artifacts/package-lock.json examples/astryx-fullstack-pilot/package-lock.json
          cp /tmp/astryx-pilot-artifacts/visual-baselines.json examples/astryx-fullstack-pilot/visual-baselines.json
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/mcf-astryx-fullstack-pilot.yml")
          content = path.read_text()
          content, install_count = re.subn(
              r"      - name: Install pinned pilot dependencies and create lockfile if absent\\n        run: \\|\\n.*?          fi\\n",
              "      - name: Install pinned pilot dependencies from committed lockfile\\n        run: npm ci --no-audit --no-fund\\n",
              content,
              count=1,
              flags=re.S,
          )
          if install_count != 1:
              raise SystemExit("Could not replace the first-run npm install block.")
          content, baseline_count = re.subn(
              r'      - name: Run API, database, browser, accessibility and visual checks\\n        env:\\n          UPDATE_VISUAL_BASELINES: "1"\\n        run: npm run test:e2e\\n',
              "      - name: Run API, database, browser, accessibility and visual checks\\n        run: npm run test:e2e\\n",
              content,
              count=1,
          )
          if baseline_count != 1:
              raise SystemExit("Could not disable visual-baseline update mode.")
          if "UPDATE_VISUAL_BASELINES" in content or "npm install --no-audit" in content:
              raise SystemExit("Pilot workflow still contains bootstrap-only dependency or baseline mode.")
          path.write_text(content)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/astryx-fullstack-pilot/package-lock.json examples/astryx-fullstack-pilot/visual-baselines.json .github/workflows/mcf-astryx-fullstack-pilot.yml
          if git diff --cached --quiet; then
            echo "Pilot artifacts already committed."
            exit 0
          fi
          git commit -m "test(astryx): pin pilot lockfile and visual baselines"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
