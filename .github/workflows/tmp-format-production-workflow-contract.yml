name: Temporary Production Workflow Contract Format Diagnostic

on:
  push:
    branches:
      - fix/issue-140-disable-production-autodeploy

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format target and print canonical content
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write ops/production-workflow-governance.test.mjs
          printf '%s\n' '---BEGIN_CANONICAL_FILE---'
          cat ops/production-workflow-governance.test.mjs
          printf '%s\n' '---END_CANONICAL_FILE---'
