name: MCF World Web CI

on:
  pull_request:
    paths:
      - 'apps/mcf-world-web/**'
      - '.github/workflows/mcf-world-web-ci.yml'
      - 'docs/superpowers/specs/2026-09-23-mcf-world-web-first-design.md'
      - 'docs/superpowers/plans/2026-09-23-mcf-world-web-first.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test MCF World Web
        run: node --test apps/mcf-world-web/tests/*.test.js
