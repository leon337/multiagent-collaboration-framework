name: Astryx formatter inspection
on:
  push:
    branches:
      - feat/mcf-astryx-cli-adapter
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/rede-social-agentes
      - name: Format and print timeout regression files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/astryx-cli-discovery.adapter.ts \
            apps/server/src/mcf-runtime/astryx-cli-discovery.adapter.test.ts
          echo '--- ADAPTER ---'
          cat apps/server/src/mcf-runtime/astryx-cli-discovery.adapter.ts
          echo '--- TEST ---'
          cat apps/server/src/mcf-runtime/astryx-cli-discovery.adapter.test.ts
