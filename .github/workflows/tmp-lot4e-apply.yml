name: TEMP Lot 4E apply patch

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-e-close-phase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Lot 4-E source patch
        run: python .github/scripts/tmp-lot4e-apply.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts skills/registry.yaml
      - name: Commit candidate source patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts skills/registry.yaml
          git commit -m 'feat(runtime): add governed close phase execution'
          git push origin HEAD:${GITHUB_REF_NAME}
