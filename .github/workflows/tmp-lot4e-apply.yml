name: TEMP Lot 4E apply patch

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-e-close-phase

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Lot 4-E patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          def replace_n(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          contracts = 'apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts'
          replace_once(
              contracts,
              "  | 'MCF-DEBUG-INCIDENT';",
              "  | 'MCF-DEBUG-INCIDENT'\n  | 'MCF-CLOSE-PHASE';",
          )

          executor = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts'
          replace_n(
              executor,
              "  'MCF-DEBUG-INCIDENT',\n]);",
              "  'MCF-DEBUG-INCIDENT',\n  'MCF-CLOSE-PHASE',\n]);",
              2,
          )

          evidence = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts'
          replace_once(
              evidence,
              "  'MCF-DEBUG-INCIDENT',\n]);",
              "  'MCF-DEBUG-INCIDENT',\n  'MCF-CLOSE-PHASE',\n]);",
          )

          close_helpers = r'''
          const closeoutFinalStates = new Set([
            'ENTREGUE',
            'AGUARDANDO_DEPENDENCIA_EXTERNA',
            'BLOQUEADO_POR_RISCO',
            'CANCELADO_PELA_AUTORIDADE',
          ]);

          const closeoutDecisions = new Set([
            'APROVAR',
            'APROVAR_COM_RESSALVAS',
            'RETORNAR_PARA_CORRECAO',
            'AMPLIAR_EQUIPE',
            'REDUZIR_EQUIPE',
            'BLOQUEAR',
            'ESCALAR_PARA_LEANDRO',
          ]);

          function requireCloseString(
            record: Record<string, unknown>,
            key: string,
            message: string,
          ): string {
            const value = record[key];
            if (!isMeaningfulDebugString(value)) return reject(message);
            return value.trim();
          }

          function requireCloseArray(
            record: Record<string, unknown>,
            key: string,
            message: string,
            allowEmpty = false,
          ): unknown[] {
            const value = record[key];
            if (!Array.isArray(value) || (!allowEmpty && value.length === 0)) return reject(message);
            if (value.some((item) => !hasMeaningfulDebugValue(item))) return reject(message);
            return value;
          }

          function requireClosePhasePack(
            record: Record<string, unknown>,
            key: string,
            message: string,
          ): Record<string, unknown> {
            const value = asRecord(record[key], message);
            requireCloseArray(
              value,
              'artifacts',
              'MCF-CLOSE-PHASE phase_pack requires non-empty artifact references',
            );
            requireCloseString(
              value,
              'manifest_reference',
              'MCF-CLOSE-PHASE phase_pack requires a manifest_reference',
            );
            if (value.traceability_complete !== true) {
              return reject('MCF-CLOSE-PHASE phase_pack requires traceability_complete=true');
            }
            return value;
          }

          function requireCloseAuditVerdict(
            record: Record<string, unknown>,
            key: string,
            message: string,
          ): Record<string, unknown> {
            const value = asRecord(record[key], message);
            requireCloseString(value, 'verdict', 'MCF-CLOSE-PHASE audit_verdict requires a verdict');
            requireCloseString(
              value,
              'evidence_reference',
              'MCF-CLOSE-PHASE audit_verdict requires evidence_reference',
            );
            requireCloseArray(
              value,
              'blocking_findings',
              'MCF-CLOSE-PHASE audit_verdict requires blocking_findings, even when empty',
              true,
            );
            return value;
          }

          function requireCloseLeoDecision(
            record: Record<string, unknown>,
            key: string,
            message: string,
          ): Record<string, unknown> {
            const value = asRecord(record[key], message);
            const decision = requireCloseString(
              value,
              'decision',
              'MCF-CLOSE-PHASE leo_decision requires an explicit decision',
            ).toUpperCase();
            if (!closeoutDecisions.has(decision)) {
              return reject('MCF-CLOSE-PHASE leo_decision is not a canonical Léo gate decision');
            }
            requireCloseString(
              value,
              'justification',
              'MCF-CLOSE-PHASE leo_decision requires justification',
            );
            const nextState = requireCloseString(
              value,
              'next_state',
              'MCF-CLOSE-PHASE leo_decision requires next_state',
            ).toUpperCase();
            if (!closeoutFinalStates.has(nextState)) {
              return reject('MCF-CLOSE-PHASE leo_decision next_state must be a canonical terminal state');
            }
            requireCloseString(
              value,
              'next_action',
              'MCF-CLOSE-PHASE leo_decision requires next_action',
            );
            requireCloseString(
              value,
              'responsible',
              'MCF-CLOSE-PHASE leo_decision requires responsible',
            );
            return value;
          }

          function requireCloseCheckpoint(
            record: Record<string, unknown>,
            key: string,
            message: string,
          ): Record<string, unknown> {
            const value = asRecord(record[key], message);
            const finalState = requireCloseString(
              value,
              'final_state',
              'MCF-CLOSE-PHASE checkpoint requires final_state',
            ).toUpperCase();
            if (!closeoutFinalStates.has(finalState)) {
              return reject('MCF-CLOSE-PHASE checkpoint final_state must be canonical');
            }
            if (typeof value.objective_met !== 'boolean') {
              return reject('MCF-CLOSE-PHASE checkpoint requires objective_met boolean evidence');
            }
            const unresolved = requireCloseArray(
              value,
              'unresolved_findings',
              'MCF-CLOSE-PHASE checkpoint requires unresolved_findings, even when empty',
              true,
            );
            const blockers = requireCloseArray(
              value,
              'blockers',
              'MCF-CLOSE-PHASE checkpoint requires blockers, even when empty',
              true,
            );
            const nextAction = requireCloseString(
              value,
              'next_action',
              'MCF-CLOSE-PHASE checkpoint requires next_action',
            );
            const recipient = requireCloseString(
              value,
              'checkpoint_recipient',
              'MCF-CLOSE-PHASE checkpoint requires checkpoint_recipient',
            );
            if (recipient.trim().toLowerCase() !== 'mestre') {
              return reject('MCF-CLOSE-PHASE checkpoint_recipient must be Mestre; Leandro is not a technical handoff target');
            }
            if (typeof value.human_action_required !== 'boolean') {
              return reject('MCF-CLOSE-PHASE checkpoint requires human_action_required boolean evidence');
            }
            if (finalState === 'ENTREGUE') {
              const normalizedAction = nextAction.trim().toLowerCase();
              if (value.objective_met !== true) {
                return reject('MCF-CLOSE-PHASE cannot mark ENTREGUE when objective_met is false');
              }
              if (unresolved.length > 0 || blockers.length > 0) {
                return reject('MCF-CLOSE-PHASE cannot mark ENTREGUE with unresolved findings or blockers');
              }
              if (!['nenhuma', 'none'].includes(normalizedAction)) {
                return reject('MCF-CLOSE-PHASE cannot mark ENTREGUE with a pending next_action');
              }
              if (value.human_action_required !== false) {
                return reject('MCF-CLOSE-PHASE ENTREGUE requires human_action_required=false');
              }
            }
            return value;
          }

          '''
          replace_once(evidence, 'function validateEvidence(\n', close_helpers + 'function validateEvidence(\n')

          close_case = r'''    case 'MCF-CLOSE-PHASE': {
                const phasePack = requireClosePhasePack(
                  evidence,
                  'phase_pack',
                  'MCF-CLOSE-PHASE requires structured phase_pack evidence',
                );
                const auditVerdict = requireCloseAuditVerdict(
                  evidence,
                  'audit_verdict',
                  'MCF-CLOSE-PHASE requires structured audit_verdict evidence',
                );
                const leoDecision = requireCloseLeoDecision(
                  evidence,
                  'leo_decision',
                  'MCF-CLOSE-PHASE requires structured leo_decision evidence',
                );
                const checkpoint = requireCloseCheckpoint(
                  evidence,
                  'checkpoint',
                  'MCF-CLOSE-PHASE requires structured checkpoint evidence',
                );
                const nextState = String(leoDecision.next_state).trim().toUpperCase();
                const finalState = String(checkpoint.final_state).trim().toUpperCase();
                if (nextState !== finalState) {
                  return reject('MCF-CLOSE-PHASE leo_decision.next_state must match checkpoint.final_state');
                }
                if (
                  finalState === 'ENTREGUE' &&
                  !['APROVAR', 'APROVAR_COM_RESSALVAS'].includes(
                    String(leoDecision.decision).trim().toUpperCase(),
                  )
                ) {
                  return reject('MCF-CLOSE-PHASE ENTREGUE requires an approving Léo decision');
                }
                return {
                  phase_pack: phasePack,
                  audit_verdict: auditVerdict,
                  leo_decision: leoDecision,
                  checkpoint,
                };
              }
          '''
          replace_once(evidence, '    default:\n      return evidence;\n', close_case + '    default:\n      return evidence;\n')

          planner = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts'
          debug_config = """  'MCF-DEBUG-INCIDENT': {
              agentId: 'Patricia',
              handoffTo: 'Renato',
              toolProvider: 'internal',
              toolOperation: 'inspect-debug-incident',
              internal: false,
              requiredEvidence: ['reproduction', 'root_cause', 'recovery_result'],
            },
          """
          close_config = """  'MCF-CLOSE-PHASE': {
              agentId: 'Carmem',
              handoffTo: 'Mestre',
              toolProvider: 'internal',
              toolOperation: 'close-phase',
              internal: false,
              requiredEvidence: ['phase_pack', 'audit_verdict', 'leo_decision', 'checkpoint'],
            },
          """
          replace_once(planner, debug_config, debug_config + close_config)
          replace_once(
              planner,
              "const debugTerms = [\n",
              "const closePhaseTerms = [\n  'fechar fase',\n  'concluir fase',\n  'encerrar fase',\n  'close phase',\n  'phase closeout',\n  'gerar rastreabilidade',\n];\nconst debugTerms = [\n",
          )
          replace_once(
              planner,
              "    selectedSkills.includes('MCF-SECURITY-REVIEW') || includesAny(normalized, highRiskTerms)",
              "    selectedSkills.includes('MCF-SECURITY-REVIEW') ||\n    selectedSkills.includes('MCF-CLOSE-PHASE') ||\n    includesAny(normalized, highRiskTerms)",
          )
          replace_once(
              planner,
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, debugTerms)) {",
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, closePhaseTerms)) {\n    return ['MCF-START-MISSION', 'MCF-SELECT-AGENTS', 'MCF-CLOSE-PHASE', 'MCF-TRACE-MISSION'];\n  }\n  if (includesAny(normalized, debugTerms)) {",
          )

          permissions = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts'
          close_boundary = r'''
          const closePhaseForbiddenInputs = new Set([
            'external-write',
            'github-write',
            'github-provider-write',
            'environment-mutation',
            'deploy',
            'production-action',
            'destructive-action',
            'secret-access',
            'public-action',
            'human-as-technical-operator',
          ]);

          function requestsForbiddenClosePhaseAction(inputs: Record<string, unknown>): string | null {
            for (const [rawKey, value] of Object.entries(inputs)) {
              const key = canonicalizeToolValue(rawKey);
              if (!closePhaseForbiddenInputs.has(key)) continue;
              if (value === undefined || value === null || value === false) continue;
              return key;
            }
            return null;
          }

          function assertClosePhaseBoundary(
            skill: McfSkillDefinition,
            provider: string,
            operation: string,
            resource: string,
            inputs: Record<string, unknown>,
          ): void {
            if (skill.skillId !== 'MCF-CLOSE-PHASE') return;
            if (skill.permissionProfile !== 'SCOPED_WRITE') {
              throw new McfPermissionDeniedError(
                'MCF-CLOSE-PHASE must preserve the canonical SCOPED_WRITE permission profile',
              );
            }
            if (provider !== 'internal') {
              throw new McfPermissionDeniedError(
                'MCF-CLOSE-PHASE is restricted to the internal provider in Lot 4E',
              );
            }
            if (operation !== 'close-phase') {
              throw new McfPermissionDeniedError(
                'MCF-CLOSE-PHASE permits only close-phase in Lot 4E',
              );
            }
            if (resource !== 'mcf-agent-runtime') {
              throw new McfPermissionDeniedError(
                'MCF-CLOSE-PHASE is restricted to mcf-agent-runtime in Lot 4E',
              );
            }
            const forbiddenInput = requestsForbiddenClosePhaseAction(inputs);
            if (forbiddenInput) {
              throw new McfPermissionDeniedError(
                `MCF-CLOSE-PHASE forbids ${forbiddenInput} in the Lot 4E internal-only boundary`,
              );
            }
          }

          '''
          replace_once(
              permissions,
              "const readOperations = ['read', 'get', 'list', 'search', 'inspect', 'status', 'fetch'];\n",
              close_boundary + "const readOperations = ['read', 'get', 'list', 'search', 'inspect', 'status', 'fetch'];\n",
          )
          replace_once(
              permissions,
              '    assertDebugIncidentBoundary(skill, provider, operation, resource, inputs);\n',
              '    assertDebugIncidentBoundary(skill, provider, operation, resource, inputs);\n    assertClosePhaseBoundary(skill, provider, operation, resource, inputs);\n',
          )

          registry = 'skills/registry.yaml'
          replace_once(registry, '    handoff_to: Leandro\n', '    handoff_to: Mestre\n')

          tests_dir = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime')
          (tests_dir / 'skill-executor-lot4-close-phase.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';

import { EvidenceValidator } from './evidence-validator.js';
import { McfPermissionDeniedError } from './mcf-runtime.errors.js';
import { PermissionEngine } from './permission-engine.js';
import { SkillExecutor } from './skill-executor.js';
import { SkillRegistryLoader } from './skill-registry.loader.js';

function createExecutor(): SkillExecutor {
  return new SkillExecutor(
    new SkillRegistryLoader(),
    new PermissionEngine(),
    new EvidenceValidator(),
  );
}

function validEvidence(): Record<string, unknown> {
  return {
    phase_pack: {
      artifacts: ['PHASE-006-LOT-4-E-CLOSE-PHASE-PLAN.md', 'PHASE-006-LOT-4-E-CLOSE-PHASE-REPORT.md'],
      manifest_reference: 'PHASE-006-LOT-4-E-CLOSE-PHASE-ARTIFACT-MANIFEST.sha256',
      traceability_complete: true,
    },
    audit_verdict: {
      verdict: 'PASS',
      evidence_reference: 'audit:lot4e:emily:head-exact',
      blocking_findings: [],
    },
    leo_decision: {
      decision: 'APROVAR',
      justification: 'Acceptance criteria are evidenced and no blocking findings remain.',
      next_state: 'ENTREGUE',
      next_action: 'nenhuma',
      responsible: 'Mestre',
    },
    checkpoint: {
      final_state: 'ENTREGUE',
      objective_met: true,
      unresolved_findings: [],
      blockers: [],
      next_action: 'nenhuma',
      checkpoint_recipient: 'Mestre',
      human_action_required: false,
    },
  };
}

function validInputs(): Record<string, unknown> {
  return {
    phase_execution: 'Lot 4-E governed closeout execution',
    acceptance_results: ['traceability_complete', 'objective_state_truthful'],
    execution_evidence: validEvidence(),
  };
}

async function execute(inputs: Record<string, unknown> = validInputs(), agentId = 'Carmem') {
  return createExecutor().execute({
    skillId: 'MCF-CLOSE-PHASE',
    agentId,
    inputs,
    tool: {
      provider: 'internal',
      operation: 'close-phase',
      resource: 'mcf-agent-runtime',
    },
  });
}

describe('SkillExecutor Lot 4E MCF-CLOSE-PHASE', () => {
  it('completes a truthful closeout and hands off to Mestre', async () => {
    const result = await execute();
    expect(result).toMatchObject({
      evidenceStatus: 'VALID',
      phaseState: 'COMPLETED',
      missionState: 'EXECUTING',
      handoffTo: 'Mestre',
      rejectionReason: null,
    });
    expect(result.skill.permissionProfile).toBe('SCOPED_WRITE');
    expect(result.receipt?.provider).toBe('internal');
  });

  it.each(['Carmem', 'Emily', 'Leo', 'Mestre'])('accepts canonical owner %s', async (agentId) => {
    const result = await execute(validInputs(), agentId);
    expect(result.evidenceStatus).toBe('VALID');
    expect(result.handoffTo).toBe('Mestre');
  });

  it('rejects a non-owner', async () => {
    await expect(execute(validInputs(), 'Rafael')).rejects.toBeInstanceOf(McfPermissionDeniedError);
  });

  it.each([
    ['external provider', { provider: 'github', operation: 'close-phase', resource: 'repo' }],
    ['wrong operation', { provider: 'internal', operation: 'github-write', resource: 'mcf-agent-runtime' }],
    ['wrong resource', { provider: 'internal', operation: 'close-phase', resource: 'external-system' }],
  ])('rejects forbidden boundary: %s', async (_label, tool) => {
    await expect(
      createExecutor().execute({
        skillId: 'MCF-CLOSE-PHASE',
        agentId: 'Carmem',
        inputs: validInputs(),
        tool,
      }),
    ).rejects.toBeInstanceOf(McfPermissionDeniedError);
  });

  it.each([
    ['external_write', true],
    ['github_provider_write', true],
    ['environment_mutation', true],
    ['deploy', true],
    ['production_action', true],
    ['destructive_action', true],
    ['secret_access', true],
    ['public_action', true],
  ])('rejects forbidden intent input %s', async (key, value) => {
    await expect(execute({ ...validInputs(), [key]: value })).rejects.toBeInstanceOf(
      McfPermissionDeniedError,
    );
  });

  it('moves to RECOVERING when execution evidence is absent', async () => {
    const result = await execute({
      phase_execution: 'phase execution',
      acceptance_results: ['pending'],
    });
    expect(result).toMatchObject({
      evidenceStatus: 'INVALID',
      phaseState: 'RECOVERING',
      missionState: 'RECOVERING',
      handoffTo: null,
    });
  });

  it.each([
    ['boolean phase pack', { ...validEvidence(), phase_pack: true }],
    [
      'incomplete traceability',
      {
        ...validEvidence(),
        phase_pack: {
          artifacts: ['PLAN.md'],
          manifest_reference: 'manifest.sha256',
          traceability_complete: false,
        },
      },
    ],
    [
      'pending action disguised as delivered',
      {
        ...validEvidence(),
        checkpoint: {
          ...(validEvidence().checkpoint as Record<string, unknown>),
          next_action: 'corrigir teste pendente',
        },
      },
    ],
    [
      'blocker disguised as delivered',
      {
        ...validEvidence(),
        checkpoint: {
          ...(validEvidence().checkpoint as Record<string, unknown>),
          blockers: ['CI vermelho'],
        },
      },
    ],
    [
      'human technical handoff',
      {
        ...validEvidence(),
        checkpoint: {
          ...(validEvidence().checkpoint as Record<string, unknown>),
          checkpoint_recipient: 'Leandro',
        },
      },
    ],
    [
      'non-approving delivered decision',
      {
        ...validEvidence(),
        leo_decision: {
          ...(validEvidence().leo_decision as Record<string, unknown>),
          decision: 'BLOQUEAR',
        },
      },
    ],
    [
      'mismatched terminal state',
      {
        ...validEvidence(),
        leo_decision: {
          ...(validEvidence().leo_decision as Record<string, unknown>),
          next_state: 'BLOQUEADO_POR_RISCO',
        },
      },
    ],
  ])('rejects invalid closeout evidence: %s', async (_label, execution_evidence) => {
    const result = await execute({
      phase_execution: 'phase execution',
      acceptance_results: ['traceability_complete'],
      execution_evidence,
    });
    expect(result.evidenceStatus).toBe('INVALID');
    expect(result.phaseState).toBe('RECOVERING');
    expect(result.handoffTo).toBeNull();
    expect(result.rejectionReason).toBeTruthy();
  });
});
''')

          (tests_dir / 'chat-mission-planner-lot4-close-phase.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';

import { ChatMissionPlanner } from './chat-mission-planner.js';

describe('ChatMissionPlanner Lot 4E MCF-CLOSE-PHASE', () => {
  it('infers close phase as Class C READY_AGENT owned by Carmem with Mestre handoff', () => {
    const plan = new ChatMissionPlanner().plan({
      objective: 'Fechar fase com rastreabilidade e emitir checkpoint verdadeiro.',
      requestedRiskClass: 'A',
    });

    const close = plan.steps.find((step) => step.skillId === 'MCF-CLOSE-PHASE');
    expect(close).toMatchObject({
      agentId: 'Carmem',
      handoffTo: 'Mestre',
      toolProvider: 'internal',
      toolOperation: 'close-phase',
      toolResource: 'mcf-agent-runtime',
      state: 'READY_AGENT',
      requiredEvidence: ['phase_pack', 'audit_verdict', 'leo_decision', 'checkpoint'],
    });
    expect(plan.contract.riskClass).toBe('C');
    expect(plan.contract.selectedAgents).not.toContain('Leandro');
  });

  it('keeps explicit close-phase routing governed by READY_AGENT', () => {
    const plan = new ChatMissionPlanner().plan({
      objective: 'Consolidar o fechamento desta fase.',
      requestedSkills: ['MCF-CLOSE-PHASE'],
    });
    const close = plan.steps.find((step) => step.skillId === 'MCF-CLOSE-PHASE');
    expect(close?.state).toBe('READY_AGENT');
    expect(close?.agentId).toBe('Carmem');
    expect(close?.handoffTo).toBe('Mestre');
  });

  it('does not auto-complete the closeout in the bridge', () => {
    const plan = new ChatMissionPlanner().plan({ objective: 'Encerrar fase com checkpoint.' });
    const close = plan.steps.find((step) => step.skillId === 'MCF-CLOSE-PHASE');
    const autoExecuted = plan.steps.filter((step) => step.state === 'PLANNED_INTERNAL');
    expect(close?.state).toBe('READY_AGENT');
    expect(autoExecuted.map((step) => step.skillId)).not.toContain('MCF-CLOSE-PHASE');
  });
});
''')

          (tests_dir / 'mission-runtime-lot4-close-phase.integration.test.ts').write_text(r'''import { randomUUID } from 'node:crypto';

