name: MCF Human Authority Bootstrap Staging

on:
  workflow_dispatch:
    inputs:
      intent_ref:
        description: Opaque bootstrap intent reference
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: mcf-human-authority-bootstrap-staging
  cancel-in-progress: false

jobs:
  environment_precondition:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require pre-existing protected staging environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/mcf-human-authority-staging"
          status="$(curl --silent --show-error --output "${RUNNER_TEMP}/environment.json" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}")"
          if [ "${status}" != '200' ]; then
            echo "::error title=ENVIRONMENT_NOT_READY::Protected environment must pre-exist; observed HTTP ${status}."
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/environment.json","utf8"));
            const required=(p.protection_rules||[]).find((rule)=>rule.type==="required_reviewers");
            const human=required?.reviewers?.some((entry)=>entry.type==="User" && Number(entry.reviewer?.id)===25374535);
            const branch=p.deployment_branch_policy;
            if(p.name!=="mcf-human-authority-staging" || !human || branch?.protected_branches!==false || branch?.custom_branch_policies!==true){
              console.error("::error title=ENVIRONMENT_NOT_READY::Environment must require the canonical human reviewer and an exact custom branch policy.");
              process.exit(1);
            }
          '
          policies_api="${api}/deployment-branch-policies?per_page=100"
          policies_status="$(curl --silent --show-error --output "${RUNNER_TEMP}/branch-policies.json" --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${policies_api}")"
          if [ "${policies_status}" != '200' ]; then
            echo "::error title=ENVIRONMENT_NOT_READY::Deployment branch policy lookup failed with HTTP ${policies_status}."
            exit 1
          fi
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/branch-policies.json","utf8"));
            if(!Array.isArray(p.branch_policies) || !p.branch_policies.some((rule)=>rule.name==="feat/human-authority-bootstrap-004")){
              console.error("::error title=ENVIRONMENT_NOT_READY::Exact staging bootstrap branch policy is missing.");
              process.exit(1);
            }
          '

  bind_authority:
    needs: environment_precondition
    if: >-
      github.repository == 'leon337/multiagent-collaboration-framework' &&
      github.ref == 'refs/heads/feat/human-authority-bootstrap-004'
    runs-on: ubuntu-latest
    environment: mcf-human-authority-staging
    timeout-minutes: 15
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install and build control plane
        working-directory: apps/rede-social-agentes
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @rsa/contracts build
          pnpm --filter @rsa/database build
          pnpm --filter @rsa/server build

      - name: Apply sealed human authority binding
        working-directory: apps/rede-social-agentes
        env:
          BOOTSTRAP_INTENT_REF: ${{ inputs.intent_ref }}
          BOOTSTRAP_OIDC_AUDIENCE: mcf-human-authority-bootstrap
          BOOTSTRAP_ISSUER_URL: ${{ vars.BOOTSTRAP_ISSUER_URL }}
          BOOTSTRAP_SEAL_PRIVATE_JWK: ${{ secrets.BOOTSTRAP_SEAL_PRIVATE_JWK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: node apps/server/dist/bootstrap-control-plane-main.js
