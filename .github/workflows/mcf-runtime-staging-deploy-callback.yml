name: MCF Runtime Staging Deploy Callback

on:
  workflow_run:
    workflows:
      - MCF Runtime Staging Deploy
    types:
      - completed

permissions:
  contents: read

jobs:
  reconcile:
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCF_CONTROL_PLANE_URL: ${{ secrets.MCF_CONTROL_PLANE_URL }}
      MCF_STAGING_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}
      MCF_RUNTIME_TOKEN: ${{ secrets.MCF_RUNTIME_TOKEN }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_TITLE: ${{ github.event.workflow_run.display_title }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}

    steps:
      - name: Parse governed staging correlation
        id: correlation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MCF_CONTROL_PLANE_URL"
          test -n "$MCF_STAGING_RUNTIME_URL"
          test -n "$MCF_RUNTIME_TOKEN"
          cat >"$RUNNER_TEMP/canonicalize-runtime-origin.py" <<'PY'
          import ipaddress
          import sys
          from urllib.parse import urlsplit

          raw = sys.argv[1].strip()
          parsed = urlsplit(raw)
          scheme = parsed.scheme.lower()
          if scheme not in {"http", "https"} or parsed.hostname is None:
              raise SystemExit("runtime URL must be an absolute HTTP(S) origin")
          if parsed.username is not None or parsed.password is not None:
              raise SystemExit("runtime URL must not contain credentials")
          if parsed.path not in {"", "/"} or parsed.query or parsed.fragment:
              raise SystemExit("runtime URL must not contain path, query, or fragment")

          try:
              port = parsed.port
          except ValueError as error:
              raise SystemExit(str(error)) from error

          host = parsed.hostname
          try:
              address = ipaddress.ip_address(host)
              host = address.compressed
              if address.version == 6:
                  host = f"[{host}]"
          except ValueError:
              host = host.rstrip(".").encode("idna").decode("ascii").lower()
              if not host:
                  raise SystemExit("runtime URL hostname must not be empty")

          if (scheme == "http" and port == 80) or (scheme == "https" and port == 443):
              port = None
          authority = host if port is None else f"{host}:{port}"
          print(f"{scheme}://{authority}")
          PY
          control_plane_url="$(python3 "$RUNNER_TEMP/canonicalize-runtime-origin.py" "$MCF_CONTROL_PLANE_URL")"
          staging_runtime_url="$(python3 "$RUNNER_TEMP/canonicalize-runtime-origin.py" "$MCF_STAGING_RUNTIME_URL")"
          test "$control_plane_url" != "$staging_runtime_url"
          read -r word1 word2 word3 request_id release_sha mission_id phase_id extra <<<"$SOURCE_TITLE"
          test "$word1 $word2 $word3" = "MCF staging deploy"
          test -z "${extra:-}"
          [[ "$request_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$ ]]
          [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$mission_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$phase_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          printf 'request_id=%s\n' "$request_id" >>"$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$release_sha" >>"$GITHUB_OUTPUT"
          printf 'mission_id=%s\n' "$mission_id" >>"$GITHUB_OUTPUT"
          printf 'phase_id=%s\n' "$phase_id" >>"$GITHUB_OUTPUT"

      - name: Reconcile durable UNKNOWN attempt
        shell: bash
        env:
          REQUEST_ID: ${{ steps.correlation.outputs.request_id }}
          RELEASE_SHA: ${{ steps.correlation.outputs.release_sha }}
          MISSION_ID: ${{ steps.correlation.outputs.mission_id }}
          PHASE_ID: ${{ steps.correlation.outputs.phase_id }}
        run: |
          set -euo pipefail
          control_plane_url="$(python3 "$RUNNER_TEMP/canonicalize-runtime-origin.py" "$MCF_CONTROL_PLANE_URL")"
          staging_runtime_url="$(python3 "$RUNNER_TEMP/canonicalize-runtime-origin.py" "$MCF_STAGING_RUNTIME_URL")"
          test "$control_plane_url" != "$staging_runtime_url"
          endpoint="${control_plane_url}/v1/mcf/callbacks/staging-deploy"
          payload=$(jq -cn \
            --arg missionId "$MISSION_ID" \
            --arg phaseId "$PHASE_ID" \
            --arg requestId "$REQUEST_ID" \
            --arg releaseSha "$RELEASE_SHA" \
            --arg workflowRunId "$SOURCE_RUN_ID" \
            --arg repository "$SOURCE_REPOSITORY" \
            --arg completedAt "$SOURCE_COMPLETED_AT" \
            --arg stagingRuntimeUrl "$staging_runtime_url" \
            '{missionId:$missionId,phaseId:$phaseId,requestId:$requestId,releaseSha:$releaseSha,workflowRunId:$workflowRunId,repository:$repository,completedAt:$completedAt,stagingRuntimeUrl:$stagingRuntimeUrl}')
          response=$(mktemp)
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 540 \
              --request POST \
              --header 'Content-Type: application/json' \
              --header "x-mcf-runtime-token: $MCF_RUNTIME_TOKEN" \
              --data "$payload" \
              "$endpoint" || true)
            if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              cat "$response"
              exit 0
            fi
            sleep 5
          done
          cat "$response" >&2
          exit 1
