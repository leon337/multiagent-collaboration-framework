name: Content Studio N4 Audio Review

on:
  pull_request:
    paths:
      - 'experimentos/mcf-content-studio-n4/audio/**'
      - 'experimentos/mcf-content-studio-n4/scripts/build-review-html.py'
      - 'experimentos/mcf-content-studio-n4/scripts/build-review-lab-v2.py'
      - 'experimentos/mcf-content-studio-n4/scripts/verify-media-audio.py'
      - 'experimentos/mcf-content-studio-n4/scripts/build-audio-mix.py'
      - 'experimentos/mcf-content-studio-n4/src/audio/**'
      - 'experimentos/mcf-content-studio-n4/assets/**'
      - 'experimentos/mcf-content-studio-n4/scripts/materialize-built-in-assets.py'
      - 'experimentos/mcf-content-studio-n4/scripts/verify-audio-loudness.py'
      - 'experimentos/mcf-content-studio-n4/scripts/benchmark.mjs'
      - 'experimentos/mcf-content-studio-n4/src/pilot/**'
      - 'experimentos/mcf-content-studio-n4/src/qa/**'
      - 'experimentos/mcf-content-studio-n4/src/remotion/**'
      - '.github/workflows/content-studio-n4-audio-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-studio-n4-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: experimentos/mcf-content-studio-n4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          ffmpeg -version | head -n 1

      - name: Smoke local materializable TTS fallback
        run: |
          mkdir -p out/local-tts
          python scripts/tts-capability-doctor.py --require espeak
          python scripts/synthesize-local-tts.py --provider espeak --voice pt-br --text 'Fallback local de voz do MCF. A voz principal aprovada não é alterada.' --output out/local-tts/fallback.wav
          python scripts/verify-media-audio.py out/local-tts/fallback.wav --min-duration 1
          python scripts/verify-audio-loudness.py out/local-tts/fallback.wav --min-mean-db -45 --max-mean-db -3 --max-peak-db 0

      - name: Materialize built-in video/audio assets
        run: |
          python scripts/materialize-built-in-assets.py
          test -s public/assets/n4/generated/demo-loop.mp4
          test -s public/assets/n4/generated/ui-click.wav
          test -s public/assets/n4/generated/ambient-pulse.wav
          test -s public/assets/n4/generated/music-bed.wav
          python scripts/verify-media-audio.py public/assets/n4/generated/ui-click.wav --min-duration 0.1
          python scripts/verify-media-audio.py public/assets/n4/generated/music-bed.wav --min-duration 1.9
          python scripts/verify-audio-loudness.py public/assets/n4/generated/music-bed.wav

      - name: Smoke reusable narration/music/SFX ducking mix
        run: |
          mkdir -p out/audio-mix-smoke
          ffmpeg -y -f lavfi -i 'sine=frequency=440:duration=4' -c:a pcm_s16le out/audio-mix-smoke/narr.wav
          ffmpeg -y -f lavfi -i 'sine=frequency=220:duration=4' -c:a pcm_s16le out/audio-mix-smoke/music.wav
          ffmpeg -y -f lavfi -i 'sine=frequency=880:duration=1' -c:a pcm_s16le out/audio-mix-smoke/sfx.wav
          cat > out/audio-mix-smoke/spec.json <<'JSON'
          {"fps":30,"clips":[{"id":"n1","kind":"narration","assetId":"narr","startFrame":0,"durationFrames":120,"gainDb":0},{"id":"m1","kind":"music","assetId":"music","startFrame":0,"durationFrames":120,"gainDb":-12,"fadeInFrames":15,"fadeOutFrames":15},{"id":"s1","kind":"sfx","assetId":"sfx","startFrame":45,"durationFrames":30,"gainDb":-6}],"ducking":[{"trigger":"narration","targets":["music"],"reductionDb":-9,"attackFrames":6,"releaseFrames":15}]}
          JSON
          cat > out/audio-mix-smoke/assets.json <<'JSON'
          {"narr":"out/audio-mix-smoke/narr.wav","music":"out/audio-mix-smoke/music.wav","sfx":"out/audio-mix-smoke/sfx.wav"}
          JSON
          python scripts/build-audio-mix.py --spec out/audio-mix-smoke/spec.json --asset-map out/audio-mix-smoke/assets.json --output out/audio-mix-smoke/mix.m4a
          python scripts/verify-media-audio.py out/audio-mix-smoke/mix.m4a --min-duration 3.9
          python scripts/verify-audio-loudness.py out/audio-mix-smoke/mix.m4a

      - name: Download generated narration segments
        run: |
          mkdir -p out/audio
          python - <<'PY'
          import json, subprocess
          data=json.load(open("audio/runtime-agentico-n4.timeline.json",encoding="utf-8"))
          for seg in data["segments"]:
              path=f"out/audio/{seg['id']}.mp3"
              subprocess.run(
                  ["curl","-fL","--retry","3","--retry-delay","2","-o",path,seg["url"]],
                  check=True,
              )
          PY

      - name: Build scene-aligned narration track
        run: |
          python - <<'PY'
          import json, subprocess
          data=json.load(open("audio/runtime-agentico-n4.timeline.json",encoding="utf-8"))
          fps=data["fps"]
          inputs=[]
          filters=[]
          labels=[]
          for i,seg in enumerate(data["segments"]):
              inputs += ["-i",f"out/audio/{seg['id']}.mp3"]
              start_ms=round(seg["startFrame"]/fps*1000)
              slot=seg["durationFrames"]/fps
              label=f"a{i}"
              filters.append(
                  f"[{i}:a]atrim=0:{slot:.3f},asetpts=PTS-STARTPTS,"
                  f"adelay={start_ms}|{start_ms}[{label}]"
              )
              labels.append(f"[{label}]")
          filters.append(
              "".join(labels)+
              f"amix=inputs={len(labels)}:normalize=0,apad,atrim=0:67[aout]"
          )
          cmd=[
              "ffmpeg","-y",*inputs,
              "-filter_complex",";".join(filters),
              "-map","[aout]",
              "-c:a","aac","-b:a","192k",
              "out/runtime-agentico-n4-narration.m4a",
          ]
          subprocess.run(cmd,check=True)
          PY

      - name: Render silent Remotion pilot
        run: |
          pnpm exec remotion render             src/remotion/index.ts             RuntimeAgenticoPilot             out/runtime-agentico-n4-silent.mp4             --codec=h264             --crf=23             --concurrency=2

      - name: Mux narration into pilot
        run: |
          ffmpeg -y             -i out/runtime-agentico-n4-silent.mp4             -i out/runtime-agentico-n4-narration.m4a             -map 0:v:0             -map 1:a:0             -c:v copy             -c:a aac             -b:a 192k             -t 67             -movflags +faststart             out/runtime-agentico-n4-audio.mp4

      - name: Verify encoded narration stream and loudness
        run: |
          python scripts/verify-media-audio.py out/runtime-agentico-n4-audio.mp4 --min-duration 60
          python scripts/verify-audio-loudness.py out/runtime-agentico-n4-audio.mp4

      - name: Render Review Lab QA stills
        run: |
          pnpm exec remotion still src/remotion/index.ts LongFocusConceptQa out/qa-long-focus.png --frame=90
          pnpm exec remotion still src/remotion/index.ts LongTimelineQa out/qa-long-timeline.png --frame=120
          pnpm exec remotion still src/remotion/index.ts LongDiagramQa out/qa-long-diagram.png --frame=120
          pnpm exec remotion still src/remotion/index.ts RuntimeAgenticoPilot out/runtime-agentico-pilot.png --frame=900

      - name: Benchmark review assets
        run: node scripts/benchmark.mjs

      - name: Build self-contained HTML reviews
        run: |
          python scripts/build-review-html.py             --video out/runtime-agentico-n4-audio.mp4             --timeline audio/runtime-agentico-n4.timeline.json             --output out/runtime-agentico-n4-review.html

          python scripts/build-review-lab-v2.py             --video-a out/runtime-agentico-n4-silent.mp4             --video-b out/runtime-agentico-n4-audio.mp4             --timeline audio/runtime-agentico-n4.timeline.json             --benchmark out/benchmark.json             --stills-dir out             --output out/runtime-agentico-n4-review-lab-v2.html

      - name: Verify review artifacts
        run: |
          test -s out/runtime-agentico-n4-review.html
          test -s out/runtime-agentico-n4-review-lab-v2.html
          test -s out/runtime-agentico-n4-audio.mp4
          test -s out/runtime-agentico-n4-narration.m4a
          test -s out/benchmark.json
          test -s out/qa-long-focus.png
          test -s out/qa-long-timeline.png
          test -s out/qa-long-diagram.png

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: runtime-agentico-n4-audio-review
          path: |
            experimentos/mcf-content-studio-n4/out/runtime-agentico-n4-review.html
            experimentos/mcf-content-studio-n4/out/runtime-agentico-n4-review-lab-v2.html
            experimentos/mcf-content-studio-n4/out/runtime-agentico-n4-audio.mp4
            experimentos/mcf-content-studio-n4/out/runtime-agentico-n4-narration.m4a
            experimentos/mcf-content-studio-n4/out/benchmark.json
            experimentos/mcf-content-studio-n4/out/qa-long-focus.png
            experimentos/mcf-content-studio-n4/out/qa-long-timeline.png
            experimentos/mcf-content-studio-n4/out/qa-long-diagram.png
          if-no-files-found: error
          retention-days: 14
