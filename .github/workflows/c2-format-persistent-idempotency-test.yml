name: C2 Persistent Idempotency Test Format

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-c2-pr-collaboration-write
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format regression test only
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime/github-pr-collaboration.global-idempotency.integration.test.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.global-idempotency.integration.test.ts
          git commit -m "style(mcf): format persistent idempotency regression"
          git push origin HEAD:feat/mcf-runtime-006-c2-pr-collaboration-write
