name: MCF Runtime Staging Deploy
run-name: MCF staging deploy ${{ inputs.request_id || 'push' }} ${{ inputs.release_sha || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - "apps/rede-social-agentes/**"
      - "skills/**"
      - ".github/workflows/mcf-runtime-staging-deploy.yml"
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character commit SHA to deploy. Defaults to the selected main revision.
        required: false
        type: string
      request_id:
        description: Non-secret MCF idempotency/correlation key for runtime-controlled staging dispatch.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mcf-runtime-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      MCF_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || 'push' }}
      DEPLOY_TIMEOUT_MS: 1200000
      DEPLOY_POLL_INTERVAL_MS: 10000

    steps:
      - name: Validate protected configuration
        run: |
          test -n "$MCF_RUNTIME_URL"
          test -n "$RENDER_DEPLOY_HOOK_URL"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$ ]]
          fi

      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

      - name: Validate rollout Compose configuration
        working-directory: apps/rede-social-agentes
        run: |
          docker compose -f deploy/compose.smoke.yaml config --quiet
          RSA_SERVER_IMAGE='registry.invalid/rsa-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          RSA_WEB_IMAGE='registry.invalid/rsa-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
          DATABASE_URL='postgresql://rsa:secret@db.invalid:5432/rsa?sslmode=require' \
          RATE_LIMIT_KEY_SECRET='container-smoke-rate-limit-secret-0001' \
          MCF_RECEIPT_SECRET='container-smoke-receipt-secret-0001' \
          MCF_RUNTIME_TOKEN='container-smoke-runtime-token-0001' \
          ALLOWED_ORIGINS='https://smoke.invalid' \
          docker compose -f deploy/compose.rollout.yaml config --quiet

      - name: Run container smoke
        working-directory: apps/rede-social-agentes
        run: |
          set -euo pipefail
          trap 'docker compose -f deploy/compose.smoke.yaml logs --no-color; docker compose -f deploy/compose.smoke.yaml down -v --remove-orphans' EXIT
          docker compose -f deploy/compose.smoke.yaml up -d --build

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready >/tmp/readiness.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'Container smoke readiness timed out.' >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/web.html
          grep -q 'Rede Social para Agentes de IA' /tmp/web.html
          curl --fail --silent --show-error --dump-header /tmp/headers.txt \
            http://127.0.0.1:18080/health/live >/tmp/liveness.json
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt

          server_id=$(docker compose -f deploy/compose.smoke.yaml ps -q server)
          web_id=$(docker compose -f deploy/compose.smoke.yaml ps -q web)
          test "$(docker inspect --format '{{.Config.User}}' "$server_id")" = 'node'
          test "$(docker inspect --format '{{.Config.User}}' "$web_id")" = 'nginx'

          docker compose -f deploy/compose.smoke.yaml down -v --remove-orphans
          trap - EXIT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        working-directory: apps/rede-social-agentes
        run: pnpm format:check

      - name: Lint
        working-directory: apps/rede-social-agentes
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/rede-social-agentes
        run: pnpm typecheck

      - name: Apply migrations twice in CI database
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Test
        working-directory: apps/rede-social-agentes
        run: pnpm test

      - name: Build
        working-directory: apps/rede-social-agentes
        run: pnpm build

      - name: Deploy exact revision and verify or recover
        id: deploy
        run: node apps/rede-social-agentes/ops/render-staging-deploy.mjs

      - name: Deployment result DEPLOYED
        if: ${{ always() && steps.deploy.outputs.status == 'DEPLOYED' }}
        run: |
          test "${{ steps.deploy.outputs.release_sha }}" = "$RELEASE_SHA"
          echo 'Exact staging release was deployed and verified.'

      - name: Deployment result NOOP
        if: ${{ always() && steps.deploy.outputs.status == 'NOOP' }}
        run: |
          test "${{ steps.deploy.outputs.release_sha }}" = "$RELEASE_SHA"
          echo 'Requested staging release was already healthy.'

      - name: Deployment result RECOVERED
        if: ${{ always() && steps.deploy.outputs.status == 'RECOVERED' }}
        run: |
          test -n "${{ steps.deploy.outputs.previous_sha }}"
          echo 'Rejected release recovered by redeploying the previous healthy SHA.'
