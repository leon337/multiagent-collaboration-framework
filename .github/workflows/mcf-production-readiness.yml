name: MCF Production Readiness

on:
  push:
    branches:
      - mcf/production-readiness-001
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-candidate-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      LOG_LEVEL: error
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify candidate and preserve immutable RC1
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$CANDIDATE_SHA" != "$RC1_SHA"
          test "$(git rev-list -n 1 v1.0.0-RC1)" = "$RC1_SHA"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "rc1_immutable_sha=$RC1_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies from frozen lockfile
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability gate
        working-directory: apps/rede-social-agentes
        run: pnpm audit --prod --audit-level high

      - name: Verify application
        working-directory: apps/rede-social-agentes
        run: pnpm verify

      - name: Apply migrations twice
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Exercise backup and isolated restore
        working-directory: apps/rede-social-agentes
        env:
          PGPASSWORD: rsa_ci_only
          BACKUP_DIRECTORY: ./var/readiness-backup
        run: |
          pnpm ops:backup
          createdb -h 127.0.0.1 -U rsa rsa_restore
          MANIFEST="$(find ./var/readiness-backup -name '*.manifest.json' -type f | head -n 1)"
          test -n "$MANIFEST"
          ALLOW_DESTRUCTIVE_RESTORE=YES \
            RESTORE_DATABASE_URL=postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa_restore \
            BACKUP_MANIFEST="$MANIFEST" \
            pnpm ops:restore
          ORIGINAL_COUNT="$(psql -h 127.0.0.1 -U rsa -d rsa -Atc 'select count(*) from "_rsa_migrations";')"
          RESTORED_COUNT="$(psql -h 127.0.0.1 -U rsa -d rsa_restore -Atc 'select count(*) from "_rsa_migrations";')"
          test "$ORIGINAL_COUNT" -ge 1
          test "$ORIGINAL_COUNT" = "$RESTORED_COUNT"
          echo "migration_ledger_count=$RESTORED_COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Release-readiness contract tests
        working-directory: apps/rede-social-agentes
        run: pnpm test:ops
