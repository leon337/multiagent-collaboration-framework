name: Lot 4B Canonical Closeout Sync

on:
  push:
    branches:
      - docs/mcf-runtime-006-lot4-b-closeout-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: docs/mcf-runtime-006-lot4-b-closeout-sync
          fetch-depth: 0

      - name: Reconcile canonical runtime state
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected canonical text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Root README.
          replace_once(
              'README.md',
              '  - MCF-DESIGN-ARCHITECTURE\n  - MCF-IMPLEMENT-CHANGE',
              '  - MCF-DESIGN-ARCHITECTURE\n  - MCF-EVALUATE-AGENTS\n  - MCF-IMPLEMENT-CHANGE',
          )
          replace_once('README.md', 'skills_ainda_documentais: 4', 'skills_ainda_documentais: 3')
          replace_once(
              'README.md',
              'runtime_006_lote_4a_documental_skills: 4\nstaging_post_merge: PASS_DEPLOYED',
              'runtime_006_lote_4a_documental_skills: 4\nruntime_006_lote_4b: integrado\nruntime_006_lote_4b_merge: 741abdad70432b9232256b7204156d96770c9b4d\nruntime_006_lote_4b_executable_skills: 13\nruntime_006_lote_4b_documental_skills: 3\nstaging_post_merge: PASS_DEPLOYED',
          )
          replace_once(
              'README.md',
              'O bridge executa automaticamente somente o bloco de bootstrap interno consecutivo no início do plano. As skills de domínio do Lot 4-A usam `READY_AGENT`: permanecem aguardando o agente owner, exigem `execution_evidence` semântica e não podem ter sua saída fabricada pelo bridge. GitHub, CI, Render, Vercel ou Cloudflare continuam exigindo recibos reais.',
              'O bridge executa automaticamente somente o bloco de bootstrap interno consecutivo no início do plano. As skills de domínio dos Lots 4-A e 4-B usam `READY_AGENT`: permanecem aguardando o agente owner, exigem `execution_evidence` semântica e não podem ter sua saída fabricada pelo bridge. `MCF-EVALUATE-AGENTS` preserva `READ_ONLY`, usa `inspect-agent-evaluation` e só entrega handoff para Emily após scorecard verificável. GitHub, CI, Render, Vercel ou Cloudflare continuam exigindo recibos reais.',
          )
          lot4a_paragraph = 'Com isso, o **Lote 3 está concluído** e o **Lot 4-A também está integrado**. O PR `#95` promoveu `MCF-RECOVER-CONTEXT`, `MCF-DEFINE-PRODUCT`, `MCF-DESIGN-EXPERIENCE` e `MCF-DESIGN-ARCHITECTURE` para execução governada; o candidato `e3e70fbbd2c940ee66a8de9c418e0e8d32a4c668` passou Foundation `31461319193`, Container Smoke `31461319181`, 112 arquivos/459 testes e auditoria independente sem P0/P1/P2, sendo integrado por squash em `67d20e24fd136f6334bfd835cb775426f6514403`. O runtime passa a **12 skills executáveis e 4 documentais**. O próximo boundary é `MCF-RUNTIME-006-LOT-4-B-EVALUATE-AGENTS`. O Gate C continua parcial porque a escrita real C1/C2 pelo provider GitHub permanece separadamente não autorizada. Produção e live staging adapter continuam bloqueados.'
          lot4ab_paragraph = lot4a_paragraph + '\n\nO **Lot 4-B está integrado**. O PR `#98` promoveu `MCF-EVALUATE-AGENTS` para execução governada `READY_AGENT`, preservando owners Beatriz/Tiago, permissão `READ_ONLY`, handoff Emily e evidências `test_cases`, `scores` e `regressions`. O candidato `279a4b1e3b8e8b5b948d95481ec85e5223322278` passou Foundation `31463802089`, Container Smoke `31463802100`, 115 arquivos/470 testes do servidor e auditoria independente sem P0/P1/P2; foi integrado por squash em `741abdad70432b9232256b7204156d96770c9b4d`. Candidato e merge compartilham a tree `a0e676152c7070381480b9c5422f103887987eab`. O runtime passa a **13 skills executáveis e 3 documentais**. O próximo boundary é `MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`. Gate C permanece parcial; produção e live staging adapter continuam bloqueados.'
          replace_once('README.md', lot4a_paragraph, lot4ab_paragraph)

          # Runtime README.
          replace_once('docs/runtime/README.md', 'skills_executable: 12', 'skills_executable: 13')
          replace_once('docs/runtime/README.md', 'skills_documental: 4', 'skills_documental: 3')
          replace_once(
              'docs/runtime/README.md',
              'runtime_006_lot_4a_merge: 67d20e24fd136f6334bfd835cb775426f6514403\nlive_staging_adapter: disabled',
              'runtime_006_lot_4a_merge: 67d20e24fd136f6334bfd835cb775426f6514403\nruntime_006_lot_4b: complete\nruntime_006_lot_4b_merge: 741abdad70432b9232256b7204156d96770c9b4d\nlive_staging_adapter: disabled',
          )
          lot4a_runtime = 'O Lot 4-A concluiu o primeiro incremento de cobertura total. O PR #95 integrou quatro skills internas de domínio com `READY_AGENT`, provider interno governado, evidência semântica obrigatória, fallback para `RECOVERING`, persistência pelo `MissionRuntime` e preservação do HDF. O HEAD técnico `e3e70fbbd2c940ee66a8de9c418e0e8d32a4c668` passou Foundation `31461319193` e Container Smoke `31461319181`, com 112 arquivos/459 testes; o merge squash `67d20e24fd136f6334bfd835cb775426f6514403` possui a mesma tree `def5edf77be8bdc32939d2b4bd5b1fcbcca649ec` do candidato validado. O runtime passa a 12 skills executáveis e 4 documentais.'
          lot4ab_runtime = lot4a_runtime + '\n\nO Lot 4-B integrou `MCF-EVALUATE-AGENTS` como capacidade `READY_AGENT` governada. O candidato `279a4b1e3b8e8b5b948d95481ec85e5223322278` preserva o contrato canônico Beatriz/Tiago → Emily, mantém `READ_ONLY` via `inspect-agent-evaluation`, exige `test_cases`, `scores` e `regressions` e persiste evidência pelo `MissionRuntime`. Foundation `31463802089`, Container Smoke `31463802100`, 115 arquivos/470 testes e auditoria independente passaram no HEAD exato; o merge `741abdad70432b9232256b7204156d96770c9b4d` compartilha a tree `a0e676152c7070381480b9c5422f103887987eab` do candidato. O runtime passa a 13 skills executáveis e 3 documentais.'
          replace_once('docs/runtime/README.md', lot4a_runtime, lot4ab_runtime)
          replace_once(
              'docs/runtime/README.md',
              'O Lote 3 está **concluído** e o Lot 4-A está **integrado**. A próxima etapa é `MCF-RUNTIME-006-LOT-4-B-EVALUATE-AGENTS`. Restam quatro skills documentais — `MCF-EVALUATE-AGENTS`, `MCF-SECURITY-REVIEW`, `MCF-DEBUG-INCIDENT` e `MCF-CLOSE-PHASE` — que continuam separadas por risco. Depois seguem testes multiagente em contextos separados, auditoria independente final e preparação da RC.',
              'O Lote 3 está **concluído**, o Lot 4-A está **integrado** e o Lot 4-B está **integrado**. A próxima etapa é `MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`. Restam três skills documentais — `MCF-SECURITY-REVIEW`, `MCF-DEBUG-INCIDENT` e `MCF-CLOSE-PHASE` — separadas por risco. Depois seguem testes multiagente em contextos separados, auditoria independente final e preparação da RC.',
          )

          # Runtime 006 plan.
          replace_once(
              'docs/runtime/MCF-RUNTIME-006-PLAN.md',
              '`EM_EXECUCAO — GATE_B_CONCLUIDO — C1_INTEGRADO — C2_INTEGRADO — GATE_C_PARCIAL — GATE_D_INTEGRADO — LOTE_3_CONCLUIDO — OBSERVABILIDADE_INTEGRADA — LOTE_4A_INTEGRADO`',
              '`EM_EXECUCAO — GATE_B_CONCLUIDO — C1_INTEGRADO — C2_INTEGRADO — GATE_C_PARCIAL — GATE_D_INTEGRADO — LOTE_3_CONCLUIDO — OBSERVABILIDADE_INTEGRADA — LOTE_4A_INTEGRADO — LOTE_4B_INTEGRADO`',
          )
          replace_once(
              'docs/runtime/MCF-RUNTIME-006-PLAN.md',
              '  skills_executable: 12\n  skills_documental: 4\nmcf_dec_061:',
              '  skills_executable: 12\n  skills_documental: 4\nruntime_006_lot_4b:\n  capability: EXECUTABLE_AGENT_EVALUATION\n  state: INTEGRADO\n  issue: 97\n  pull_request: 98\n  validated_head: 279a4b1e3b8e8b5b948d95481ec85e5223322278\n  merge_commit: 741abdad70432b9232256b7204156d96770c9b4d\n  candidate_tree: a0e676152c7070381480b9c5422f103887987eab\n  merge_tree: a0e676152c7070381480b9c5422f103887987eab\n  foundation_run: 31463802089\n  container_smoke_run: 31463802100\n  server_test_files: 115\n  server_tests: 470\n  vitest_artifact: 9090765070\n  artifact_digest: sha256:74aec951f4c26e491a406389b6b49c0de83a2d5a3af8ad5b1dab89eda1c11944\n  manifest_audit_run: 31463844963\n  independent_audit: PASS\n  leo_technical_gate: PASS\n  active_p0: 0\n  active_p1: 0\n  active_p2: 0\n  skills_executable: 13\n  skills_documental: 3\nmcf_dec_061:',
          )
          replace_once(
              'docs/runtime/MCF-RUNTIME-006-PLAN.md',
              '12. converter as oito skills documentais — **EM EXECUÇÃO / LOT 4-A INTEGRADO / 4 DE 8 CONVERTIDAS**;',
              '12. converter as oito skills documentais — **EM EXECUÇÃO / LOT 4-A + LOT 4-B INTEGRADOS / 5 DE 8 CONVERTIDAS**;',
          )
          replace_once(
              'docs/runtime/MCF-RUNTIME-006-PLAN.md',
              'Iniciar `MCF-RUNTIME-006-LOT-4-B-EVALUATE-AGENTS`: converter `MCF-EVALUATE-AGENTS` como incremento independente, preservando o Lot 4-A já integrado. Depois permanecem `MCF-SECURITY-REVIEW`, `MCF-DEBUG-INCIDENT` e `MCF-CLOSE-PHASE`, cada uma em seu boundary de risco. Não repetir A1, A2, C1, C2, Gate D, observabilidade do Lote 3 ou Lot 4-A. A autorização de escrita real pelo provider GitHub continua sendo um gate separado. Produção e ativação do staging adapter no live registry permanecem bloqueadas até gate próprio.',
              'Iniciar `MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`: converter `MCF-SECURITY-REVIEW` como incremento independente e sensível, preservando Lots 4-A e 4-B já integrados. Depois permanecem `MCF-DEBUG-INCIDENT` e `MCF-CLOSE-PHASE`, cada uma em seu boundary de risco. Não repetir A1, A2, C1, C2, Gate D, observabilidade do Lote 3, Lot 4-A ou Lot 4-B. A autorização de escrita real pelo provider GitHub continua sendo um gate separado. Produção e ativação do staging adapter no live registry permanecem bloqueadas até gate próprio.',
          )

          # Final Lot 4B PRF.
          phase = Path('artifacts/phases/PHASE-006-LOT-4-B-EVALUATE-AGENTS')
          prefix = 'PHASE-006-LOT-4-B-EVALUATE-AGENTS'
          files = {
              f'{prefix}-PLAN.md': '''# PHASE-006-LOT-4-B-EVALUATE-AGENTS — Plano\n\n## Identidade\n- Missão: `MCF-RUNTIME-006-LOT-4-SKILLS`\n- Fase: `PHASE-006-LOT-4-B-EVALUATE-AGENTS`\n- Issue: `#97`\n- PR técnico: `#98`\n- Classe: `C`\n- Base técnica: `5a03c443ff3e4d80755b8bd0b8c6bd3cf350f6a3`\n- Candidato validado: `279a4b1e3b8e8b5b948d95481ec85e5223322278`\n- Merge técnico: `741abdad70432b9232256b7204156d96770c9b4d`\n\n## Objetivo\nConverter `MCF-EVALUATE-AGENTS` em capacidade executável governada preservando `READ_ONLY`, owners Beatriz/Tiago, handoff Emily e evidência reproduzível.\n\n## Critérios finais\n1. `READY_AGENT`, sem autoexecução pelo bridge.\n2. `test_cases` e `scores` não vazios e significativos.\n3. `regressions` obrigatório e permitido vazio.\n4. Evidência inválida → `RECOVERING`, sem handoff.\n5. Beatriz/Tiago owners; Emily handoff.\n6. `READ_ONLY`, PermissionEngine e HDF preservados.\n7. Persistência/versionamento pelo MissionRuntime.\n8. Foundation/Smoke PASS no HEAD exato.\n9. Revisões, auditoria independente e Léo PASS antes do merge.\n10. Produção e live staging adapter bloqueados.\n\n## Resultado\nTodos os critérios técnicos foram atendidos. Candidato e squash merge compartilham a tree `a0e676152c7070381480b9c5422f103887987eab`. Próximo boundary: `MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`.\n''',
              f'{prefix}-DECISIONS.md': '''# PHASE-006-LOT-4-B-EVALUATE-AGENTS — Decisões\n\n## D1 — Boundary isolado\nA avaliação de agentes foi convertida separadamente das skills sensíveis restantes.\n\n## D2 — Classe C conservadora\nA skill é READ_ONLY, mas altera critérios de avaliação do runtime; PRF completo e auditoria independente foram exigidos.\n\n## D3 — READY_AGENT\nO bridge não fabrica scorecard; o agente owner produz evidência real.\n\n## D4 — READ_ONLY preservado\nA tentativa `evaluate-agents` foi bloqueada corretamente. A solução foi `inspect-agent-evaluation`; o PermissionEngine não foi ampliado.\n\n## D5 — Evidência reproduzível\n`test_cases`/`scores` não vazios; `regressions` obrigatório e permitido vazio.\n\n## D6 — Owners e handoff\nBeatriz/Tiago são owners; sucesso validado entrega a Emily.\n\n## D7 — Persistência no aceite\nMissionRuntime prova recibo, evidência, eventos, handoff e versão 1→2.\n\n## D8 — Gate preso ao HEAD\nFoundation, Smoke, reviews, auditoria e Léo foram vinculados a `279a4b1e3b8e8b5b948d95481ec85e5223322278`.\n\n## D9 — Squash preservou a tree\nMerge `741abdad70432b9232256b7204156d96770c9b4d` e candidato compartilham `a0e676152c7070381480b9c5422f103887987eab`.\n\n## D10 — Próximo boundary\n`MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`; Gate C, produção e live staging permanecem inalterados.\n''',
              f'{prefix}-REPORT.md': '''# PHASE-006-LOT-4-B-EVALUATE-AGENTS — Relatório\n\n## Estado técnico\n`TECHNICAL_OBJECTIVE_COMPLETE_CANONICAL_SYNC_READY_FOR_GATE`\n\n## Integração\n- Issue #97: CLOSED / COMPLETED.\n- PR #98: MERGED.\n- Candidato: `279a4b1e3b8e8b5b948d95481ec85e5223322278`.\n- Merge: `741abdad70432b9232256b7204156d96770c9b4d`.\n- Candidate tree = merge tree: `a0e676152c7070381480b9c5422f103887987eab`.\n\n## Validação\n- Foundation `31463802089`: PASS.\n- Container Smoke `31463802100`: PASS.\n- 115 arquivos / 470 testes do servidor: PASS.\n- Web: 5 PASS.\n- Artifact `9090765070`.\n- Digest `sha256:74aec951f4c26e491a406389b6b49c0de83a2d5a3af8ad5b1dab89eda1c11944`.\n- PRF manifest audit `31463844963`: PASS.\n\n## Revisão e gate\n- Beatriz: PASS.\n- Sofia: PASS.\n- Renato: PASS.\n- Júlia: PASS.\n- Emily independent audit: PASS.\n- P0=0 / P1=0 / P2=0.\n- Léo technical gate: PASS.\n\n## Resultado\n`MCF-EVALUATE-AGENTS` está integrado como READY_AGENT READ_ONLY. Resultado esperado canônico após sincronização: 13 executáveis / 3 documentais.\n\n## Limites\nGate C PARCIAL; produção BLOCKED; live staging adapter DISABLED; human_operator_actions=0; HUMAN_GATE LEANDRO não requerido.\n\n## Próximo boundary\n`MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW`.\n''',
              f'{prefix}-CHECKPOINT.yaml': '''mission: MCF-RUNTIME-006-LOT-4-SKILLS\nphase: PHASE-006-LOT-4-B-EVALUATE-AGENTS\nstate: TECHNICAL_OBJECTIVE_COMPLETE_CANONICAL_SYNC_READY_FOR_GATE\nrisk_class: C\nissue: 97\npull_request: 98\nbase_sha: 5a03c443ff3e4d80755b8bd0b8c6bd3cf350f6a3\nvalidated_head: 279a4b1e3b8e8b5b948d95481ec85e5223322278\nmerge_commit: 741abdad70432b9232256b7204156d96770c9b4d\ncandidate_tree: a0e676152c7070381480b9c5422f103887987eab\nmerge_tree: a0e676152c7070381480b9c5422f103887987eab\nvalidation:\n  foundation_run: 31463802089\n  foundation: PASS\n  container_smoke_run: 31463802100\n  container_smoke: PASS\n  server_test_files: 115\n  server_tests: 470\n  web_tests: 5\n  vitest_artifact: 9090765070\n  artifact_digest: sha256:74aec951f4c26e491a406389b6b49c0de83a2d5a3af8ad5b1dab89eda1c11944\n  manifest_audit_run: 31463844963\n  manifest_audit: PASS\nreview:\n  beatriz: PASS\n  sofia: PASS\n  renato: PASS\n  julia: PASS\n  emily_independent_audit: PASS\n  active_p0: 0\n  active_p1: 0\n  active_p2: 0\ngate:\n  leo_technical_gate: PASS\n  merge_authorized_for_exact_head: true\nresult:\n  skills_registered: 16\n  skills_executable: 13\n  skills_documental: 3\n  read_only: PRESERVED\n  production: BLOCKED\n  live_staging_adapter: DISABLED\n  human_operator_actions: 0\n  human_gate_leandro: NOT_REQUIRED\ncanonical_sync: COMPLETE_ON_BRANCH\ndoc_sync_gate: PENDING\nnext_boundary: MCF-RUNTIME-006-LOT-4-C-SECURITY-REVIEW\n''',
