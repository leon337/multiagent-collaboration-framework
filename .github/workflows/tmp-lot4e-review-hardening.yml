name: TEMP Lot 4E review hardening

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-e-close-phase

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Apply hardening
        run: python .github/scripts/tmp-lot4e-review-hardening.py
      - name: Format
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/server/src/mcf-runtime/internal-skill-evidence.ts apps/server/src/mcf-runtime/skill-executor-lot4-close-phase.test.ts
      - name: Commit source hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor-lot4-close-phase.test.ts
          git diff --cached --check
          git commit -m 'fix(runtime): harden closeout audit and human delegation semantics'
          git push origin HEAD:${GITHUB_REF_NAME}
