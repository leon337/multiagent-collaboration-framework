name: Rede Social Cloudflare Format

on:
  pull_request:
    paths:
      - ".github/workflows/rede-social-cloudflare-format.yml"
      - "apps/rede-social-agentes/ops/free-pilot-deploy.test.mjs"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/cloudflare-worker-static-spa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format target file
        run: pnpm exec prettier --write ops/free-pilot-deploy.test.mjs

      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/free-pilot-deploy.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(deploy): aplicar formatter oficial"
            git push origin HEAD:implementation/cloudflare-worker-static-spa
          fi
