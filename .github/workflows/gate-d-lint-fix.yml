name: Gate D Lint Fix Apply

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-lint-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts')
          text = adapter.read_text()
          old = """    let run = await this.findRun(target, deadlineAt, budget);\n    const runWasExisting = run !== null;\n    let externalEffectPossible = runWasExisting;\n\n    if (!run) {\n"""
          new = """    let run = await this.findRun(target, deadlineAt, budget);\n    const runWasExisting = run !== null;\n\n    if (!run) {\n"""
          if text.count(old) != 1:
              raise SystemExit('adapter precondition block did not match exactly once')
          text = text.replace(old, new)
          text = text.replace("""        );\n        externalEffectPossible = true;\n      } catch (error) {\n        if (!(error instanceof ExternalActionAdapterError) || !error.retryable) throw error;\n        externalEffectPossible = true;\n      }\n\n      try {\n""", """        );\n      } catch (error) {\n        if (!(error instanceof ExternalActionAdapterError) || !error.retryable) throw error;\n      }\n\n      try {\n""", 1)
          old_catch = """      } catch (error) {\n        if (!externalEffectPossible) throw error;\n        return this.unknownReceipt(\n"""
          new_catch = """      } catch (error) {\n        return this.unknownReceipt(\n"""
          if text.count(old_catch) != 1:
              raise SystemExit('adapter reconciliation catch did not match exactly once')
          adapter.write_text(text.replace(old_catch, new_catch))

          test = Path('apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs')
          test_text = test.read_text()
          marker = "import assert from 'node:assert/strict';\n"
          if not test_text.startswith(marker):
              raise SystemExit('ops test header did not match')
          test.write_text('/* global process */\n\n' + test_text)
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/gate-d-lint-fix.yml
      - name: Enforce exact changed path set
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-lint-fix.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts
          apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs
          EOF
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit lint fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.adapter.ts \
            apps/rede-social-agentes/ops/staging-workflow-correlation.test.mjs
          git commit -m 'fix(gate-d): resolve lint findings'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
