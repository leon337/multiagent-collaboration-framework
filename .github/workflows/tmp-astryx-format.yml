name: Temporary Astryx Formatting Pass

on:
  push:
    branches:
      - feat/mcf-astryx-governed-scaffolding

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format authority provenance test
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime/mission-runtime.authority-provenance.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-runtime.authority-provenance.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style(test): format mission runtime authority provenance tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
