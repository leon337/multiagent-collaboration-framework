name: Temporary Astryx Formatting Pass
on:
  push:
    branches: [feat/mcf-astryx-governed-scaffolding]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format Astryx files
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime/evidence-validator.ts apps/server/src/mcf-runtime/codebuddy-executor.adapter.test.ts apps/server/src/mcf-runtime/skill-registry.loader.ts apps/server/src/mcf-runtime/skill-registry.loader.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/evidence-validator.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/codebuddy-executor.adapter.test.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-registry.loader.ts apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-registry.loader.test.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style(astryx): format runtime evidence and registry tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
