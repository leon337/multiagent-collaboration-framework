name: MCF v1.1 Q19 Formatter

on:
  push:
    branches:
      - feat/mcf-v1.1-project-intake-continuity
    paths:
      - "apps/rede-social-agentes/apps/server/src/qualification/mcf-v11-q19.e2e.test.ts"
      - ".github/workflows/mcf-v11-q19-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-v1.1-project-intake-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install exact workspace dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Format Q19 scenario suite
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/qualification/mcf-v11-q19.e2e.test.ts
      - name: Commit formatter output if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/rede-social-agentes/apps/server/src/qualification/mcf-v11-q19.e2e.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "MCF Qualification Bot"
          git config user.email "mcf-qualification@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/qualification/mcf-v11-q19.e2e.test.ts
          git commit -m "style(v1.1): format Q19 scenario suite"
          git push origin HEAD:feat/mcf-v1.1-project-intake-continuity
