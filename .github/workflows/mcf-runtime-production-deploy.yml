name: MCF Runtime Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact Git commit SHA to promote to production
        required: true
        type: string
      mission_id:
        description: Persisted MCF mission containing the applicable production authorization
        required: true
        type: string
      phase_id:
        description: Persisted MCF phase containing the applicable production gate evidence
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcf-runtime-production-deploy
  cancel-in-progress: false

jobs:
  governed-production-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted production control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .mcf-control-plane
          fetch-depth: 1

      - name: Checkout exact production release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          path: .mcf-release
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Validate trusted production policy entrypoints
        run: |
          node .mcf-control-plane/apps/rede-social-agentes/ops/production-authorization-resolver.mjs
          node .mcf-control-plane/apps/rede-social-agentes/ops/production-promotion-policy.mjs

      - name: Resolve authorization and execute governed exact-SHA promotion
        id: promote
        env:
          MCF_CONTROL_PLANE_URL: ${{ secrets.MCF_CONTROL_PLANE_URL }}
          MCF_RUNTIME_TOKEN: ${{ secrets.MCF_RUNTIME_TOKEN }}
          MCF_PRODUCTION_RUNTIME_URL: ${{ secrets.MCF_PRODUCTION_RUNTIME_URL }}
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MISSION_ID: ${{ inputs.mission_id }}
          PHASE_ID: ${{ inputs.phase_id }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { resolveProductionAuthorization } from './.mcf-control-plane/apps/rede-social-agentes/ops/production-authorization-resolver.mjs';
          import { orchestrateProductionPromotion } from './.mcf-control-plane/apps/rede-social-agentes/ops/production-promotion-policy.mjs';

          const resolution = await resolveProductionAuthorization({
            controlPlaneUrl: process.env.MCF_CONTROL_PLANE_URL ?? '',
            runtimeToken: process.env.MCF_RUNTIME_TOKEN ?? '',
            missionId: process.env.MISSION_ID ?? '',
            phaseId: process.env.PHASE_ID ?? '',
            releaseSha: process.env.RELEASE_SHA ?? '',
          });

          const result =
            resolution.state === 'AUTHORIZED'
              ? await orchestrateProductionPromotion({
                  runtimeUrl: process.env.MCF_PRODUCTION_RUNTIME_URL ?? '',
                  deployHookUrl: process.env.RENDER_PRODUCTION_DEPLOY_HOOK_URL ?? '',
                  releaseSha: process.env.RELEASE_SHA ?? '',
                  authorization: resolution,
                })
              : {
                  status: 'BLOCKED',
                  reason: resolution.reason,
                  releaseSha: process.env.RELEASE_SHA ?? '',
                };

          if (!process.env.GITHUB_OUTPUT) {
            throw new Error('GITHUB_OUTPUT is required.');
          }

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `status=${result.status}\nreason=${result.reason ?? ''}\nrelease_sha=${result.releaseSha}\nprevious_sha=${result.previousSha ?? ''}\n`,
            'utf8',
          );
          NODE

      - name: Promotion result BLOCKED
        if: ${{ steps.promote.outputs.status == 'BLOCKED' }}
        run: |
          echo 'Production promotion was blocked by governance policy.'
          exit 1

      - name: Promotion result DEPLOYED
        if: ${{ steps.promote.outputs.status == 'DEPLOYED' }}
        run: echo 'Production promotion completed for the authorized exact SHA.'

      - name: Promotion result NOOP
        if: ${{ steps.promote.outputs.status == 'NOOP' }}
        run: echo 'Production already runs the authorized exact SHA; no provider mutation was required.'

      - name: Promotion result RECOVERED
        if: ${{ steps.promote.outputs.status == 'RECOVERED' }}
        run: |
          echo 'Production promotion failed readiness and recovered the previous healthy SHA.'
          exit 1
