name: MCF Content Hub Validation
on:
  pull_request:
    paths:
      - 'apps/mcf-content-hub/**'
      - '.github/workflows/content-hub-validation.yml'
  push:
    branches:
      - 'validation/mcf-content-hub-v2-20260919'
    paths:
      - 'apps/mcf-content-hub/**'
      - '.github/workflows/content-hub-validation.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: mcf-content-hub-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcf-content-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Validate seed manifest
        run: pnpm validate:seed
      - name: Validate V2 structure
        run: node scripts/validate-hub-v2.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Runtime route smoke
        run: |
          pnpm start -- -p 3000 >/tmp/mcf-content-hub.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"
          for route in / /review /library /factory-runs /videos/n4-showcase-engine-v1-1; do
            curl -fsS "http://127.0.0.1:3000$route" >/dev/null
          done
