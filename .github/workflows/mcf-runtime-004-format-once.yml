name: MCF Runtime 004 Format Once

on:
  push:
    branches:
      - feat/mcf-runtime-executable-skills-batch-1
    paths:
      - .github/workflows/mcf-runtime-004-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-executable-skills-batch-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        working-directory: apps/rede-social-agentes
        run: >-
          pnpm exec prettier --write
          apps/server/src/mcf-runtime/chat-mission-planner.test.ts
          apps/server/src/mcf-runtime/chat-mission-planner.ts
          apps/server/src/mcf-runtime/chat-runtime-bridge.service.test.ts
          apps/server/src/mcf-runtime/chat-runtime-bridge.service.ts
          apps/server/src/mcf-runtime/evidence-validator.ts
          apps/server/src/mcf-runtime/skill-executor.ts
          packages/contracts/src/mcf-runtime.ts

      - name: Commit formatting result
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-runtime-bridge.service.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-runtime-bridge.service.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/evidence-validator.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts \
            apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts
          git commit -m "style(mcf): apply canonical formatting for runtime 004"
          git push origin HEAD:feat/mcf-runtime-executable-skills-batch-1
