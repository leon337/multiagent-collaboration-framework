name: MCF GUI Window Control Qualification

on:
  push:
    branches:
      - ops/mcf-gui-window-control-next-release-candidate
  pull_request:
    paths:
      - 'docs/protocols/MCF-PROTOCOLO-SUCESSAO-CROSS-CHAT-E-CONTROLE-DE-JANELAS.md'
      - 'docs/protocols/MCF-PROTOCOLO-OPERACIONAL-UNIFICADO-DE-AGENTES.md'
      - 'schemas/mcf-gui-window-succession-trace-v1.schema.json'
      - 'schemas/fixtures/mcf-gui-window-succession-trace.*.json'
      - '.github/scripts/mcf-gui-window-control-qualification.mjs'
      - '.github/workflows/mcf-gui-window-control-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run GUI/window succession qualification
        run: node .github/scripts/mcf-gui-window-control-qualification.mjs
