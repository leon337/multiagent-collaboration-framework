name: Rede Social Free Pilot Format

on:
  pull_request:
    paths:
      - ".github/workflows/rede-social-free-pilot-format.yml"
      - "apps/rede-social-agentes/apps/server/src/config.test.ts"
      - "apps/rede-social-agentes/apps/server/src/config.ts"
      - "apps/rede-social-agentes/apps/server/src/main.ts"
      - "apps/rede-social-agentes/apps/web/src/ApiHealthStatus.tsx"
      - "apps/rede-social-agentes/apps/web/src/runtime-config.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: implementation/rede-social-free-public-pilot

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format targeted files
        run: |
          pnpm exec prettier --write \
            apps/server/src/config.test.ts \
            apps/server/src/config.ts \
            apps/server/src/main.ts \
            apps/web/src/ApiHealthStatus.tsx \
            apps/web/src/runtime-config.ts

      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/config.test.ts \
            apps/server/src/config.ts \
            apps/server/src/main.ts \
            apps/web/src/ApiHealthStatus.tsx \
            apps/web/src/runtime-config.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(free-pilot): aplicar formatação oficial"
            git push origin HEAD:implementation/rede-social-free-public-pilot
          fi
