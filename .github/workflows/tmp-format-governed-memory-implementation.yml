name: tmp governed memory implementation formatter

on:
  push:
    branches:
      - feat/governed-shared-memory-20260922

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/rede-social-agentes

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/governed-shared-memory-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/server/src/mcf-context/mcf-governed-memory.service.ts
          apps/server/src/mcf-context/mcf-governed-memory.service.test.ts
          apps/server/src/mcf-context/mcf-memory-policy.service.ts
          apps/server/src/mcf-context/mcf-memory-policy.service.test.ts
      - name: Commit formatting if needed
        shell: bash
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-context/mcf-governed-memory.service.ts
          git add apps/rede-social-agentes/apps/server/src/mcf-context/mcf-governed-memory.service.test.ts
          git add apps/rede-social-agentes/apps/server/src/mcf-context/mcf-memory-policy.service.ts
          git add apps/rede-social-agentes/apps/server/src/mcf-context/mcf-memory-policy.service.test.ts
          git commit -m "chore(memory): apply prettier to governed memory implementation"
          git push origin HEAD:feat/governed-shared-memory-20260922
