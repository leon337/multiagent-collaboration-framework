name: MCF Runtime 005 Lint Fix Once

on:
  push:
    branches:
      - feat/mcf-runtime-staging-deploy-recovery
    paths:
      - .github/workflows/mcf-runtime-005-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-staging-deploy-recovery

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply exact lint corrections
        run: |
          python3 <<'PY'
          from pathlib import Path

          script = Path('apps/rede-social-agentes/ops/render-staging-deploy.mjs')
          text = script.read_text()

          replacements = [
              (
                  "    let rollbackDeployId = null;\n    try {\n      const rollback = await triggerDeploy({",
                  "    let rollback;\n    try {\n      rollback = await triggerDeploy({",
              ),
              (
                  "      rollbackDeployId = rollback.deployId;\n      await waitForRuntimeCommit({",
                  "      await waitForRuntimeCommit({",
              ),
              (
                  "      throw new Error(\n        `Deployment failed and recovery failed. deployment=${deploymentMessage}; recovery=${rollbackMessage}`,\n      );",
                  "      throw new Error(\n        `Deployment failed and recovery failed. deployment=${deploymentMessage}; recovery=${rollbackMessage}`,\n        { cause: rollbackError },\n      );",
              ),
              (
                  "      rollbackDeployId,\n      failure:",
                  "      rollbackDeployId: rollback.deployId,\n      failure:",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          script.write_text(text)

          test = Path('apps/rede-social-agentes/ops/render-staging-deploy.test.mjs')
          test_text = test.read_text()
          old_global = '/* global Response, setTimeout */'
          new_global = '/* global Response, setTimeout, URL */'
          if test_text.count(old_global) != 1:
              raise SystemExit('test global declaration did not match exactly once')
          test.write_text(test_text.replace(old_global, new_global, 1))
          PY

      - name: Format and lint corrected files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write ops/render-staging-deploy.mjs ops/render-staging-deploy.test.mjs
          pnpm exec eslint ops/render-staging-deploy.mjs ops/render-staging-deploy.test.mjs

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/ops/render-staging-deploy.mjs \
            apps/rede-social-agentes/ops/render-staging-deploy.test.mjs
          git commit -m "fix(mcf): preserve deploy recovery causes and lint tests"
          git push origin HEAD:feat/mcf-runtime-staging-deploy-recovery
