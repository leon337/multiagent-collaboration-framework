name: MCF Render Staging Build Command Repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-render-staging-build-command-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'leon337/multiagent-collaboration-framework' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mcf-human-authority-staging
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
      EXPECTED_SERVICE_ID: srv-d9p1r6vlk1mc73a7gtj0
      EXPECTED_WORKSPACE_ID: tea-d2u2msje5dus73eb6ehg
      BROKEN_BUILD_COMMAND: >-
        cd apps/rede-social-agentes && corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @rsa/contracts build && pnpm --filter @rsa/database build && pnpm --filter @rsa/server build
      DESIRED_BUILD_COMMAND: >-
        cd apps/rede-social-agentes && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @rsa/contracts build && pnpm --filter @rsa/database build && pnpm --filter @rsa/server build
    steps:
      - name: Validate bounded maintenance scope
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_STAGING_SERVICE_ID"
          test "$RENDER_STAGING_SERVICE_ID" = "$EXPECTED_SERVICE_ID"

      - name: Read exact staging service
        id: before
        run: |
          set -euo pipefail
          endpoint="https://api.render.com/v1/services/$EXPECTED_SERVICE_ID"
          status="$(curl --silent --show-error --output /tmp/service-before.json --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 60 \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$endpoint")"
          test "$status" = "200"
          jq -e --arg id "$EXPECTED_SERVICE_ID" --arg owner "$EXPECTED_WORKSPACE_ID" '
            .id == $id and
            .ownerId == $owner and
            .name == "mcf-runtime-staging-api" and
            .branch == "main" and
            .autoDeploy == "no"
          ' /tmp/service-before.json >/dev/null
          current="$(jq -er '.serviceDetails.envSpecificDetails.buildCommand' /tmp/service-before.json)"
          if [ "$current" = "$DESIRED_BUILD_COMMAND" ]; then
            echo "already_repaired=true" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$BROKEN_BUILD_COMMAND" ]; then
            echo "already_repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=UNEXPECTED_BUILD_COMMAND::Staging build command drifted from both the known broken and desired forms."
            exit 1
          fi

      - name: Repair build command through exact Render API resource
        if: steps.before.outputs.already_repaired != 'true'
        run: |
          set -euo pipefail
          endpoint="https://api.render.com/v1/services/$EXPECTED_SERVICE_ID"
          jq -cn --arg desired "$DESIRED_BUILD_COMMAND"             '{serviceDetails:{envSpecificDetails:{buildCommand:$desired}}}' >/tmp/update-payload.json
          status="$(curl --silent --show-error --output /tmp/update-response.json --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 60 \
            --request PATCH \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data-binary @/tmp/update-payload.json \
            "$endpoint")"
          test "$status" = "200"
          jq -e --arg id "$EXPECTED_SERVICE_ID" --arg expected "$DESIRED_BUILD_COMMAND" '
            .id == $id and
            .serviceDetails.envSpecificDetails.buildCommand == $expected
          ' /tmp/update-response.json >/dev/null

      - name: Verify exact repaired configuration
        run: |
          set -euo pipefail
          endpoint="https://api.render.com/v1/services/$EXPECTED_SERVICE_ID"
          status="$(curl --silent --show-error --output /tmp/service-after.json --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 60 \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            "$endpoint")"
          test "$status" = "200"
          jq -e --arg id "$EXPECTED_SERVICE_ID" --arg owner "$EXPECTED_WORKSPACE_ID" --arg expected "$DESIRED_BUILD_COMMAND" '
            .id == $id and
            .ownerId == $owner and
            .name == "mcf-runtime-staging-api" and
            .branch == "main" and
            .autoDeploy == "no" and
            .serviceDetails.envSpecificDetails.buildCommand == $expected
          ' /tmp/service-after.json >/dev/null
          echo "Staging build command repaired and verified; no deploy was triggered by this workflow."
