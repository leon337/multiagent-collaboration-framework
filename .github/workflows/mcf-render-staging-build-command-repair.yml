name: MCF Render Staging Build Command Repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-render-staging-build-command-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'leon337/multiagent-collaboration-framework' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: mcf-human-authority-staging
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
      EXPECTED_SERVICE_ID: srv-d9p1r6vlk1mc73a7gtj0
      EXPECTED_WORKSPACE_ID: tea-d2u2msje5dus73eb6ehg
      BROKEN_BUILD_COMMAND: >-
        cd apps/rede-social-agentes && corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @rsa/contracts build && pnpm --filter @rsa/database build && pnpm --filter @rsa/server build
      DESIRED_BUILD_COMMAND: >-
        cd apps/rede-social-agentes && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @rsa/contracts build && pnpm --filter @rsa/database build && pnpm --filter @rsa/server build
    steps:
      - name: Validate bounded maintenance scope
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_STAGING_SERVICE_ID"
          test "$RENDER_STAGING_SERVICE_ID" = "$EXPECTED_SERVICE_ID"

      - name: Install pinned Render CLI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output /tmp/render-cli.zip \
            https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip
          echo '6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec  /tmp/render-cli.zip' | sha256sum --check
          unzip -q /tmp/render-cli.zip -d /tmp/render-cli
          cli_path="/tmp/render-cli/cli_v2.22.0"
          test -f "$cli_path"
          chmod +x "$cli_path"
          "$cli_path" --version
          echo "RENDER_CLI=$cli_path" >> "$GITHUB_ENV"

      - name: Select exact staging workspace
        run: |
          set -euo pipefail
          "$RENDER_CLI" workspace set "$EXPECTED_WORKSPACE_ID" --confirm --output json >/tmp/workspace.json

      - name: Verify current service configuration
        id: before
        run: |
          set -euo pipefail
          "$RENDER_CLI" services --confirm --output json >/tmp/services-before.json
          current="$(jq -er --arg id "$EXPECTED_SERVICE_ID" '
            [ .[] | select(.id == $id) ] as $matches |
            if ($matches|length) != 1 then error("expected exactly one staging service") else
              $matches[0].serviceDetails.envSpecificDetails.buildCommand
            end
          ' /tmp/services-before.json)"
          auto_deploy="$(jq -er --arg id "$EXPECTED_SERVICE_ID" '
            [ .[] | select(.id == $id) ][0].autoDeploy
          ' /tmp/services-before.json)"
          test "$auto_deploy" = "no"
          if [ "$current" = "$DESIRED_BUILD_COMMAND" ]; then
            echo "already_repaired=true" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$BROKEN_BUILD_COMMAND" ]; then
            echo "already_repaired=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=UNEXPECTED_BUILD_COMMAND::Staging build command drifted from both the known broken and desired forms."
            exit 1
          fi

      - name: Repair build command
        if: steps.before.outputs.already_repaired != 'true'
        run: |
          set -euo pipefail
          "$RENDER_CLI" services update "$EXPECTED_SERVICE_ID" \
            --build-command "$DESIRED_BUILD_COMMAND" \
            --confirm \
            --output json >/tmp/update.json

      - name: Verify exact repaired configuration
        run: |
          set -euo pipefail
          "$RENDER_CLI" services --confirm --output json >/tmp/services-after.json
          jq -e --arg id "$EXPECTED_SERVICE_ID" --arg expected "$DESIRED_BUILD_COMMAND" '
            [ .[] | select(.id == $id) ] as $matches |
            ($matches|length) == 1 and
            $matches[0].autoDeploy == "no" and
            $matches[0].branch == "main" and
            $matches[0].serviceDetails.envSpecificDetails.buildCommand == $expected
          ' /tmp/services-after.json >/dev/null
          echo "Staging build command repaired and verified; no deploy was triggered by this workflow."
