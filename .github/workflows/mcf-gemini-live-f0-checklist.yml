name: Gemini Live F0 — checklist integrity
on:
  pull_request:
    paths:
      - "ops/gemini-live/**"
      - ".github/workflows/mcf-gemini-live-f0-checklist.yml"
      - "docs/missions/gemini-live-evolution-20261116/**"
  workflow_dispatch:
    inputs:
      publish_status_comment:
        description: "Opt in: publish PR/CI signal as comment on Issue #527 (never checkboxes)"
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test ops/gemini-live/checklist-sync.test.mjs
  publish_signal:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_status_comment == true
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Post a factual PR/CI signal (no checkbox changes)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MCF_CHECKLIST_APPLY: "1"
        run: node ops/gemini-live/checklist-sync.mjs --apply
