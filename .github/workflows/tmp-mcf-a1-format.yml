name: Temporary MCF A1 formatting

on:
  push:
    branches:
      - feat/mcf-runtime-006-a1-code-review-adapter
    paths:
      - ".github/workflows/tmp-mcf-a1-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format A1 hardening files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/evidence-validator.ts \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/external-action-reservation.integration.test.ts \
            apps/server/src/mcf-runtime/github-code-review.adapter.test.ts \
            apps/server/src/mcf-runtime/postgres-mcf-runtime.repository.ts

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-mcf-a1-format.yml

      - name: Commit formatting
        run: |
          git config user.name "Leandro Carlos"
          git config user.email "leonpcsn@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "style(mcf): format A1 hardening"
          git push origin "HEAD:${GITHUB_REF_NAME}"
