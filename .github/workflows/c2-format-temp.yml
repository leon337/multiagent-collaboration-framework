name: C2 temporary formatter

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-c2-pr-collaboration-write
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format C2 files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/github-pr-collaboration.adapter.test.ts \
            apps/server/src/mcf-runtime/github-pr-collaboration.adapter.ts \
            apps/server/src/mcf-runtime/github-pr-collaboration.evidence.ts \
            apps/server/src/mcf-runtime/github-pr-collaboration.permission.test.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.adapter.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.adapter.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.evidence.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.permission.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/mcf-runtime.module.ts
          git commit -m 'style(c2): apply prettier formatting'
          git push origin HEAD:feat/mcf-runtime-006-c2-pr-collaboration-write
