name: C2 format extract

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write
    paths:
      - '.github/workflows/c2-format-extract.yml'
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.global-recovery-deadlock.integration.test.ts'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: apps/rede-social-agentes
      - run: pnpm exec prettier --write apps/server/src/mcf-runtime/github-pr-collaboration.global-recovery-deadlock.integration.test.ts
        working-directory: apps/rede-social-agentes
      - uses: actions/upload-artifact@v4
        with:
          name: c2-prettier-output
          path: apps/rede-social-agentes/apps/server/src/mcf-runtime/github-pr-collaboration.global-recovery-deadlock.integration.test.ts
