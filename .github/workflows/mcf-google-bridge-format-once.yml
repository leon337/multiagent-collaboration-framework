name: MCF Google Bridge Format Once
on:
  push:
    branches:
      - feat/mcf-google-bridge-runtime-readonly-20261120
    paths:
      - .github/workflows/mcf-google-bridge-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-google-bridge-runtime-readonly-20261120
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
      - name: Format four files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/google-bridge-read.adapter.ts \
            apps/server/src/mcf-runtime/google-bridge-read.adapter.test.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/server/src/mcf-runtime/permission-engine.ts
      - name: Commit formatting and remove temporary CI helper
        run: |
          rm .github/workflows/mcf-google-bridge-format-once.yml
          git add -A -- \
            .github/workflows/mcf-google-bridge-format-once.yml \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/google-bridge-read.adapter.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/google-bridge-read.adapter.test.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/permission-engine.ts
          git -c user.name='MCF CI formatter' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(mcf): format Google Bridge runtime integration'
          git push origin HEAD:refs/heads/feat/mcf-google-bridge-runtime-readonly-20261120
