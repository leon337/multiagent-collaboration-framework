name: MCF Gate D One-Shot Dispatcher
run-name: MCF Gate D one-shot c787

on:
  push:
    branches:
      - ops/gate-d-dispatch-c787
    paths:
      - .github/workflows/mcf-gate-d-one-shot-dispatch.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: mcf-gate-d-one-shot-c787
  cancel-in-progress: false

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: mcf-runtime-staging-deploy.yml
      TARGET_REF: ops/gate-d-release-c787
      RELEASE_SHA: c787179e126a93af96dd67604cb24f91235c4320
      REQUEST_ID: c4-gated-real-proof-c787-001
      MISSION_ID: 4eabb8b1-f7fe-54fb-9cbd-8001c83d1574
      PHASE_ID: ea24fe78-7101-514c-8cf0-d79546fcc7c8
      EXPECTED_TITLE: MCF staging deploy c4-gated-real-proof-c787-001 c787179e126a93af96dd67604cb24f91235c4320 4eabb8b1-f7fe-54fb-9cbd-8001c83d1574 ea24fe78-7101-514c-8cf0-d79546fcc7c8

    steps:
      - name: Prove immutable release ref
        shell: bash
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_REF" --jq '.object.sha')"
          test "$observed" = "$RELEASE_SHA"

      - name: Refuse duplicate correlated dispatch
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&branch=$TARGET_REF&per_page=100" \
            --jq '[.workflow_runs[] | select(.display_title == env.EXPECTED_TITLE)] | length')"
          test "$count" = "0"

      - name: Dispatch exact reviewed staging workflow once
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -f "ref=$TARGET_REF" \
            -f "inputs[release_sha]=$RELEASE_SHA" \
            -f "inputs[request_id]=$REQUEST_ID" \
            -f "inputs[mission_id]=$MISSION_ID" \
            -f "inputs[phase_id]=$PHASE_ID"

      - name: Confirm correlated workflow exists
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&branch=$TARGET_REF&per_page=100" \
              --jq '[.workflow_runs[] | select(.display_title == env.EXPECTED_TITLE)][0].id // empty')"
            if [ -n "$run_id" ]; then
              echo "workflow_run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
              echo "release_sha=$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo "target_ref=$TARGET_REF" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo 'Correlated staging workflow was not observed.' >&2
          exit 1
