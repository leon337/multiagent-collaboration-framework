name: MCF Gate E RC1 Final One-Shot Qualification

on:
  push:
    branches:
      - ops/gate-e-rc1-final-13b5cb4
    paths:
      - ".github/workflows/mcf-gate-e-rc1-final-one-shot.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: mcf-gate-e-rc1-final-13b5cb4
  cancel-in-progress: false

env:
  TARGET_SHA: 13b5cb4f6b7a8369b0493fc3a51367d64b09c705
  BASELINE_SHA: c5758c2e38b599ae1673cda2691ef2ce0dc2a411
  REQUEST_ID: gate-e-rc1-final-13b5cb4-001
  MISSION_UUID: 00000000-0000-4000-8000-000000000121
  PHASE_UUID: 00000000-0000-4000-8000-000000000122

jobs:
  qualify-final-and-dispatch-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact final Gate E candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Bind qualification to exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"
          test "$(git status --porcelain)" = ""
          gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.sha' | grep -Fx "$TARGET_SHA"
          echo "final_candidate_sha=$TARGET_SHA"
          echo "baseline_sha=$BASELINE_SHA"

      - name: Validate Class C PRF manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/phases/PHASE-006-GATE-E-RELEASE-CANDIDATE
          sha256sum -c PHASE-006-GATE-E-RELEASE-CANDIDATE-ARTIFACT-MANIFEST.sha256

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply migrations twice
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Run complete final MCF validation
        working-directory: apps/rede-social-agentes
        run: pnpm verify

      - name: Verify 16 registered equals 16 executable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          registry = Path('skills/registry.yaml').read_text(encoding='utf-8')
          executor = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts').read_text(encoding='utf-8')
          registered = re.findall(r'^\s+- skill_id:\s+(MCF-[A-Z0-9-]+)\s*$', registry, re.M)
          match = re.search(r'const executableSkills = new Set\(\[(.*?)\]\);', executor, re.S)
          if not match:
              raise SystemExit('executableSkills set not found')
          executable = re.findall(r"'(MCF-[A-Z0-9-]+)'", match.group(1))
          if len(registered) != 16 or len(set(registered)) != 16:
              raise SystemExit(f'registry count mismatch: {len(registered)} total / {len(set(registered))} unique')
          if len(executable) != 16 or len(set(executable)) != 16:
              raise SystemExit(f'executable count mismatch: {len(executable)} total / {len(set(executable))} unique')
          if set(registered) != set(executable):
              raise SystemExit(f'skill sets differ: missing={sorted(set(registered)-set(executable))} extra={sorted(set(executable)-set(registered))}')
          print('skills_registered=16')
          print('skills_executable=16')
          print('skills_documental=0')
          PY

      - name: Dispatch official final staging exactly once
        id: staging
        shell: bash
        run: |
          set -euo pipefail

          existing="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow mcf-runtime-staging-deploy.yml \
            --event workflow_dispatch \
            --limit 100 \
            --json databaseId,displayTitle \
            --jq '.[] | select(.displayTitle | contains(env.REQUEST_ID)) | .databaseId' \
            | head -n1)"

          if [ -n "$existing" ]; then
            echo "Duplicate dispatch prevented; reusing run $existing"
            run_id="$existing"
          else
            gh workflow run mcf-runtime-staging-deploy.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f release_sha="$TARGET_SHA" \
              -f request_id="$REQUEST_ID" \
              -f mission_id="$MISSION_UUID" \
              -f phase_id="$PHASE_UUID"

            run_id=""
            for attempt in $(seq 1 30); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow mcf-runtime-staging-deploy.yml \
                --event workflow_dispatch \
                --limit 100 \
                --json databaseId,displayTitle \
                --jq '.[] | select(.displayTitle | contains(env.REQUEST_ID)) | .databaseId' \
                | head -n1)"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
            done
            test -n "$run_id"
            echo "Created staging run $run_id"
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for official final staging verification
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.staging.outputs.run_id }}'
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

          details="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion,displayTitle,event,status,url,jobs)"
          echo "$details" | jq '{conclusion,displayTitle,event,status,url,jobs:[.jobs[]|{name,conclusion,steps:[.steps[]|{name,conclusion}]}]}'

          echo "$details" | jq -e --arg request "$REQUEST_ID" --arg sha "$TARGET_SHA" '
            .conclusion == "success" and
            .status == "completed" and
            .event == "workflow_dispatch" and
            (.displayTitle | contains($request)) and
            (.displayTitle | contains($sha)) and
            any(.jobs[];
              .conclusion == "success" and
              any(.steps[]; .name == "Deploy exact revision and verify or recover" and .conclusion == "success") and
              (
                (any(.steps[]; .name == "Deployment result DEPLOYED" and .conclusion == "success") and
                 any(.steps[]; .name == "Deployment result NOOP" and .conclusion == "skipped"))
                or
                (any(.steps[]; .name == "Deployment result NOOP" and .conclusion == "success") and
                 any(.steps[]; .name == "Deployment result DEPLOYED" and .conclusion == "skipped"))
              ) and
              any(.steps[]; .name == "Deployment result RECOVERED" and .conclusion == "skipped")
            )
          '

          echo "staging_exact_sha=PASS"
          echo "staging_recovery=false"

      - name: Emit final Gate E candidate receipt
        shell: bash
        run: |
          cat <<EOF
          GATE_E_FINAL_CANDIDATE_RECEIPT
          target_sha=$TARGET_SHA
          baseline_sha=$BASELINE_SHA
          request_id=$REQUEST_ID
          manifest=PASS
          validation=PASS
          migrations_twice=PASS
          skills_registered=16
          skills_executable=16
          skills_documental=0
          staging_run=${{ steps.staging.outputs.run_id }}
          staging_exact_sha=PASS
          staging_recovery=false
          duplicate_external_dispatches=0
          human_operator_actions=0
          production=BLOCKED
          stable_release=BLOCKED
          EOF
