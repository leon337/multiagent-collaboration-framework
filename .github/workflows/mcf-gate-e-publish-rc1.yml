name: MCF Gate E Publish RC1 One-Shot

on:
  push:
    branches:
      - ops/gate-e-publish-rc1-9b4a759
    paths:
      - ".github/workflows/mcf-gate-e-publish-rc1.yml"

permissions:
  contents: write

concurrency:
  group: mcf-gate-e-publish-rc1-9b4a759
  cancel-in-progress: false

env:
  TARGET_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
  TAG: v1.0.0-RC1

jobs:
  publish-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Bind publication to exact verified main
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TARGET_SHA"
          echo "main_sha=$current_main"

      - name: Prepare RC1 release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rc1-notes.md" <<'EOF'
          # MCF v1.0.0-RC1

          Primeira Release Candidate formal do Multiagent Collaboration Framework, aprovada no **Gate E**.

          ## Identidade da release

          - Gate E mission: `MCF-RELEASE-CANDIDATE-GATE-E` / Issue #121
          - Technical PR: #122
          - Audited candidate: `13b5cb4f6b7a8369b0493fc3a51367d64b09c705`
          - Verified merge/main target: `9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8`
          - Candidate→merge tree equivalence: PASS

          ## Evidência material

          - Skills: `16 registradas / 16 executáveis / 0 documentais`
          - Final candidate native CI: PASS
          - Class C PRF manifest: PASS
          - Full validation + migrations twice: PASS
          - Final candidate staging: PASS / DEPLOYED / no recovery
          - Emily independent audit: PASS
          - Léo Gate E decision: PASS
          - Post-merge documentation: PASS
          - Post-merge read-only exact-main qualification: PASS
          - Post-merge staging exact-main: PASS / DEPLOYED / no recovery
          - Critical findings open: 0
          - High findings open: 0

          ## Limitações obrigatórias

          - **Produção permanece BLOCKED.**
          - **`v1.0.0` estável permanece BLOCKED.**
          - Esta RC não concede autoridade de produção.
          - `live_staging_adapter` permanece `DISABLED` no estado canônico de entrada.
          - Recovery deve ser interpretado apenas nas semânticas comprovadas/documentadas; não inferir rollback nativo onde ele não foi provado.
          EOF

      - name: Create or verify exact RC1 tag
        shell: bash
        run: |
          set -euo pipefail

          if gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag ref already exists; verifying exact target."
          else
            echo "Tag ref is absent; creating $TAG at $TARGET_SHA."
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA"
          fi

          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$ref_sha" = "$TARGET_SHA"
          echo "tag_ref_sha=$ref_sha"

      - name: Create or verify exact RC1 prerelease
        shell: bash
        run: |
          set -euo pipefail

          if gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release already exists; verification will follow."
          else
            echo "Release is absent; creating prerelease $TAG."
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f name="MCF v1.0.0-RC1" \
              -F body=@"$RUNNER_TEMP/rc1-notes.md" \
              -F draft=false \
              -F prerelease=true
          fi

      - name: Verify published RC1
        shell: bash
        run: |
          set -euo pipefail
          ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$ref_sha" = "$TARGET_SHA"

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          echo "$release" | jq '{tag_name,target_commitish,name,draft,prerelease,html_url}'
          echo "$release" | jq -e --arg tag "$TAG" --arg sha "$TARGET_SHA" '
            .tag_name == $tag and
            .target_commitish == $sha and
            .name == "MCF v1.0.0-RC1" and
            .draft == false and
            .prerelease == true
          '

          echo "GATE_E_RC1_PUBLICATION_RECEIPT"
          echo "tag=$TAG"
          echo "target_sha=$TARGET_SHA"
          echo "release_candidate=PASS"
          echo "prerelease=true"
          echo "production=BLOCKED"
          echo "stable_release=BLOCKED"
