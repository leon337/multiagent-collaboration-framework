name: MCF A1 Format Preview

on:
  pull_request:
    paths:
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/github-code-review.adapter.ts'
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/github-code-review.adapter.test.ts'
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/mcf-runtime.module.ts'
      - 'apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.external-action.test.ts'
      - '.github/workflows/mcf-a1-format-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Print formatted files
        working-directory: apps/rede-social-agentes
        run: |
          for file in \
            apps/server/src/mcf-runtime/github-code-review.adapter.ts \
            apps/server/src/mcf-runtime/github-code-review.adapter.test.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/server/src/mcf-runtime/skill-executor.external-action.test.ts
          do
            echo "===== ${file} ====="
            pnpm exec prettier "${file}"
          done
