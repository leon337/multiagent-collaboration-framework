name: MCF Runtime 004 Lifecycle Script Once

on:
  push:
    branches:
      - feat/mcf-runtime-executable-skills-batch-1
    paths:
      - .github/workflows/mcf-runtime-004-lifecycle-script-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-executable-skills-batch-1

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply exact lifecycle changes
        run: python3 scripts/mcf-runtime-004-lifecycle-fix.py

      - name: Format changed files
        working-directory: apps/rede-social-agentes
        run: pnpm exec prettier --write apps/server/src/mcf-runtime packages/contracts/src/mcf-runtime.ts

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts
          git commit -m "fix(mcf): close missions only at verified final trace"
          git push origin HEAD:feat/mcf-runtime-executable-skills-batch-1
