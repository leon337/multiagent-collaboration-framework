name: MCF A1 Hardening Apply

on:
  push:
    branches:
      - feat/mcf-runtime-006-a1-code-review-adapter
    paths:
      - '.github/workflows/mcf-a1-hardening-apply.yml'
      - '.github/scripts/apply_mcf_a1_hardening.py.gz'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-a1-code-review-adapter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Apply hardening patch
        run: |
          gzip -dc .github/scripts/apply_mcf_a1_hardening.py.gz > .github/scripts/apply_mcf_a1_hardening.py
          python .github/scripts/apply_mcf_a1_hardening.py
      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/apply_mcf_a1_hardening.py
          rm .github/scripts/apply_mcf_a1_hardening.py.gz
          rm .github/workflows/mcf-a1-hardening-apply.yml
      - name: Format changed files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/external-action.contracts.ts \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/external-action-dispatcher.ts \
            apps/server/src/mcf-runtime/skill-executor.ts \
            apps/server/src/mcf-runtime/mission-runtime.service.ts \
            apps/server/src/mcf-runtime/mcf-runtime.module.ts \
            apps/server/src/mcf-runtime/github-code-review.adapter.ts \
            apps/server/src/mcf-runtime/github-code-review.adapter.test.ts \
            apps/server/src/mcf-runtime/skill-executor.external-action.test.ts \
            apps/server/src/mcf-runtime/external-action-ledger.integration.test.ts
      - name: Commit hardened implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mcf): harden external action reservation and review coverage"
          git push origin HEAD:feat/mcf-runtime-006-a1-code-review-adapter
