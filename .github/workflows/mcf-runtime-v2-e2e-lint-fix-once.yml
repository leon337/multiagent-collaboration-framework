name: MCF Runtime V2 E2E Lint Fix Once

on:
  push:
    branches:
      - test/mcf-runtime-004-eight-skills-e2e
    paths:
      - .github/workflows/mcf-runtime-v2-e2e-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/mcf-runtime-004-eight-skills-e2e

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply structural lint corrections
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/rede-social-agentes/ops/mcf-runtime-v2-e2e.mjs')
          text = path.read_text()

          if not text.startswith('/* global console, fetch */'):
              text = '/* global console, fetch */\n\n' + text

          fs_import = "import { appendFileSync } from 'node:fs';\n"
          process_import = "import process from 'node:process';\n"
          if process_import not in text:
              if text.count(fs_import) != 1:
                  raise SystemExit('appendFileSync import did not match exactly once')
              text = text.replace(fs_import, fs_import + process_import, 1)

          main_start = text.index('async function main() {')
          try_marker = '\n  try {\n'
          finally_marker = '\n  } finally {\n'
          main_end_marker = '\n}\n\nmain().catch'

          try_start = text.index(try_marker, main_start)
          finally_start = text.index(finally_marker, try_start)
          main_end = text.index(main_end_marker, finally_start)
          execution_body = text[try_start + len(try_marker):finally_start]

          replacement = (
              '\n  let executionError = null;\n'
              '  try {\n'
              + execution_body
              + '\n  } catch (error) {\n'
              '    executionError = error;\n'
              '  }\n\n'
              '  let revocationError = null;\n'
              '  if (sessionToken) {\n'
              "    const revoked = await request('/v1/sessions/current', { method: 'DELETE' });\n"
              '    if (!revoked.response.ok) {\n'
              '      revocationError = new Error(\n'
              '        `Session revocation failed (${revoked.response.status}): ${revoked.text}`,\n'
              '      );\n'
              '    } else {\n'
              "      summarize(['- Technical session revoked: `PASS`', '']);\n"
              '    }\n'
              '  }\n\n'
              '  if (executionError) throw executionError;\n'
              '  if (revocationError) throw revocationError;'
          )

          text = text[:try_start] + replacement + text[main_end:]
          path.write_text(text)
          PY

      - name: Format and lint corrected script
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write ops/mcf-runtime-v2-e2e.mjs
          pnpm exec eslint ops/mcf-runtime-v2-e2e.mjs

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes/ops/mcf-runtime-v2-e2e.mjs
          git commit -m "fix(mcf): satisfy E2E lint and safe session cleanup"
          git push origin HEAD:test/mcf-runtime-004-eight-skills-e2e
