name: Temporary MCF A1 hardening patch

on:
  push:
    branches:
      - feat/mcf-runtime-006-a1-code-review-adapter
    paths:
      - ".github/workflows/tmp-mcf-a1-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled hardening patch
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('.github/scripts/apply-mcf-a1-hardening.py'); s=p.read_text(encoding='utf-8'); hm=base64.b64decode('ICAgIHdyaXRlKHBhdGgsIGNvbnRlbnQucmVwbGFjZShvbGQsIG5ldywgMSkpCgoKTUlHUkFUSU9O').decode(); hr=base64.b64decode('').decode(); cm=base64.b64decode('cmVwbGFjZV9vbmNlKAogICAgQURBUFRFUiwKICAgICcnJyAgICAgICAgY2hhbmdlZEZpbGVzLnB1c2goLi4uYmF0Y2gpOw==').decode(); cr=base64.b64decode('cmVwbGFjZV9maXJzdCgKICAgIEFEQVBURVIsCiAgICAnJycgICAgICAgIGNoYW5nZWRGaWxlcy5wdXNoKC4uLmJhdGNoKTs=').decode(); assert s.count(hm)==1; assert s.count(cm)==1; s=s.replace(hm,hr,1).replace(cm,cr,1); p.write_text(s,encoding='utf-8')"
          sed -i 's/if "normalize(" in permissions or "normalizeProvider" in permissions:/if "function normalize(" in permissions or "function normalizeProvider(" in permissions:/' .github/scripts/apply-mcf-a1-hardening.py
          python3 .github/scripts/apply-mcf-a1-hardening.py

      - name: Remove temporary patch mechanism
        run: |
          rm .github/scripts/apply-mcf-a1-hardening.py
          rm .github/workflows/tmp-mcf-a1-hardening.yml

      - name: Commit hardening
        run: |
          git config user.name "Leandro Carlos"
          git config user.email "leonpcsn@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mcf): close A1 integration blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
