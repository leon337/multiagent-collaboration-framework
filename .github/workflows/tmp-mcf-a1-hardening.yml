name: Temporary MCF A1 hardening patch

on:
  push:
    branches:
      - feat/mcf-runtime-006-a1-code-review-adapter
    paths:
      - ".github/workflows/tmp-mcf-a1-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled hardening patch
        run: |
          sed -i '329s/replace_once/replace_first/' .github/scripts/apply-mcf-a1-hardening.py
          sed -i '23i\
\
def replace_first(path: str, old: str, new: str) -> None:\
    content = read(path)\
    count = content.count(old)\
    if count < 1:\
        raise RuntimeError(f"{path}: expected at least one occurrence: {old[:80]!r}")\
    write(path, content.replace(old, new, 1))\
' .github/scripts/apply-mcf-a1-hardening.py
          sed -i 's/if "normalize(" in permissions or "normalizeProvider" in permissions:/if "function normalize(" in permissions or "function normalizeProvider(" in permissions:/' .github/scripts/apply-mcf-a1-hardening.py
          python3 .github/scripts/apply-mcf-a1-hardening.py

      - name: Remove temporary patch mechanism
        run: |
          rm .github/scripts/apply-mcf-a1-hardening.py
          rm .github/workflows/tmp-mcf-a1-hardening.yml

      - name: Commit hardening
        run: |
          git config user.name "Leandro Carlos"
          git config user.email "leonpcsn@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(mcf): close A1 integration blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
