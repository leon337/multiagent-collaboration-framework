name: Lot 4B Implementation

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-b-evaluate-agents

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-lot4-b-evaluate-agents
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply Lot 4B implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          contracts = 'apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts'
          replace_once(
              contracts,
              "  | 'MCF-TRACE-MISSION';",
              "  | 'MCF-TRACE-MISSION'\n  | 'MCF-EVALUATE-AGENTS';",
          )

          planner = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts'
          trace_block = """  'MCF-TRACE-MISSION': {
    agentId: 'Augusto',
    handoffTo: 'Beatriz',
    toolProvider: 'internal',
    toolOperation: 'inspect-mission',
    internal: true,
    requiredEvidence: ['chronological_trace', 'handoff_status', 'recovery_status'],
  },
};
"""
          eval_block = """  'MCF-TRACE-MISSION': {
    agentId: 'Augusto',
    handoffTo: 'Beatriz',
    toolProvider: 'internal',
    toolOperation: 'inspect-mission',
    internal: true,
    requiredEvidence: ['chronological_trace', 'handoff_status', 'recovery_status'],
  },
  'MCF-EVALUATE-AGENTS': {
    agentId: 'Beatriz',
    handoffTo: 'Emily',
    toolProvider: 'internal',
    toolOperation: 'evaluate-agents',
    internal: false,
    requiredEvidence: ['test_cases', 'scores', 'regressions'],
  },
};
"""
          replace_once(planner, trace_block, eval_block)
          replace_once(
              planner,
              "const validationTerms = ['testar', 'validar', 'auditar', 'verificar', 'smoke', 'ci'];",
              "const validationTerms = ['testar', 'validar', 'auditar', 'verificar', 'smoke', 'ci'];\nconst evaluationTerms = [\n  'avaliar agentes',\n  'avaliar agente',\n  'benchmark',\n  'regressão de prompt',\n  'regressao de prompt',\n  'scorecard',\n];",
          )
          replace_once(
              planner,
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, deploymentTerms)) {",
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, evaluationTerms)) {\n    return [\n      'MCF-START-MISSION',\n      'MCF-SELECT-AGENTS',\n      'MCF-EVALUATE-AGENTS',\n      'MCF-TRACE-MISSION',\n    ];\n  }\n  if (includesAny(normalized, deploymentTerms)) {",
          )

          executor = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts'
          replace_once(
              executor,
              "  'MCF-TRACE-MISSION',\n]);",
              "  'MCF-TRACE-MISSION',\n  'MCF-EVALUATE-AGENTS',\n]);",
          )
          replace_once(
              executor,
              "  'MCF-TRACE-MISSION',\n]);\n\ntype CiQueryConclusion",
              "  'MCF-TRACE-MISSION',\n  'MCF-EVALUATE-AGENTS',\n]);\n\ntype CiQueryConclusion",
          )
          replace_once(
              executor,
              "`${skill.skillId} Lot 4A execution is restricted to the governed internal provider`,",
              "`${skill.skillId} governed execution is restricted to the internal provider`,",
          )

          evidence = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts'
          replace_once(
              evidence,
              "  'MCF-DESIGN-ARCHITECTURE',\n]);",
              "  'MCF-DESIGN-ARCHITECTURE',\n  'MCF-EVALUATE-AGENTS',\n]);",
          )
          reference_anchor = """function requireReference(
  record: Record<string, unknown>,
  key: string,
  message: string,
): string | Record<string, unknown> {
"""
          score_helpers = """function isMeaningfulScoreValue(value: unknown): boolean {
  if (typeof value === 'number') return Number.isFinite(value);
  if (typeof value === 'string') return value.trim().length > 0;
  if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
    return Object.keys(value as Record<string, unknown>).length > 0;
  }
  return false;
}

function requireScores(
  record: Record<string, unknown>,
  key: string,
  message: string,
): unknown[] | Record<string, unknown> {
  const value = record[key];
  if (Array.isArray(value)) {
    if (value.length > 0 && value.every(isMeaningfulScoreValue)) return value;
    return reject(message);
  }
  if (typeof value === 'object' && value !== null) {
    const scores = value as Record<string, unknown>;
    const entries = Object.entries(scores);
    if (entries.length > 0 && entries.every(([, score]) => isMeaningfulScoreValue(score))) {
      return scores;
    }
  }
  return reject(message);
}

""" + reference_anchor
          replace_once(evidence, reference_anchor, score_helpers)
          architecture_case = """    case 'MCF-DESIGN-ARCHITECTURE':
      return {
        architecture_diagram: requireReference(
          evidence,
          'architecture_diagram',
          'MCF-DESIGN-ARCHITECTURE requires architecture_diagram evidence',
        ),
        decisions: requireArray(
          evidence,
          'decisions',
          'MCF-DESIGN-ARCHITECTURE requires non-empty decisions evidence',
        ),
        risks: requireArray(
          evidence,
          'risks',
          'MCF-DESIGN-ARCHITECTURE requires risks evidence, even when empty',
          { allowEmpty: true },
        ),
      };
    default:
"""
          eval_case = """    case 'MCF-DESIGN-ARCHITECTURE':
      return {
        architecture_diagram: requireReference(
          evidence,
          'architecture_diagram',
          'MCF-DESIGN-ARCHITECTURE requires architecture_diagram evidence',
        ),
        decisions: requireArray(
          evidence,
          'decisions',
          'MCF-DESIGN-ARCHITECTURE requires non-empty decisions evidence',
        ),
        risks: requireArray(
          evidence,
          'risks',
          'MCF-DESIGN-ARCHITECTURE requires risks evidence, even when empty',
          { allowEmpty: true },
        ),
      };
    case 'MCF-EVALUATE-AGENTS':
      return {
        test_cases: requireArray(
          evidence,
          'test_cases',
          'MCF-EVALUATE-AGENTS requires non-empty test_cases evidence',
        ),
        scores: requireScores(
          evidence,
          'scores',
          'MCF-EVALUATE-AGENTS requires non-empty scores evidence',
        ),
        regressions: requireArray(
          evidence,
          'regressions',
          'MCF-EVALUATE-AGENTS requires regressions evidence, even when empty',
          { allowEmpty: true },
        ),
      };
    default:
"""
          replace_once(evidence, architecture_case, eval_case)
          replace_once(
              evidence,
              "reject(`${skill.skillId} Lot 4A execution requires the governed internal provider`);",
              "reject(`${skill.skillId} governed execution requires the internal provider`);",
          )

          Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor-lot4-evaluate-agents.test.ts').write_text("""import { describe, expect, it } from 'vitest';

import { EvidenceValidator } from './evidence-validator.js';
import { McfPermissionDeniedError } from './mcf-runtime.errors.js';
import { PermissionEngine } from './permission-engine.js';
import { SkillExecutor } from './skill-executor.js';
import { SkillRegistryLoader } from './skill-registry.loader.js';

function createExecutor(): SkillExecutor {
  return new SkillExecutor(
    new SkillRegistryLoader(),
    new PermissionEngine(),
    new EvidenceValidator(),
  );
}

function validInputs(): Record<string, unknown> {
  return {
    behavior_or_configuration: 'Evaluate routing behavior for the current agent contract.',
    criteria: ['consistent handoff', 'evidence fidelity'],
    execution_evidence: {
      test_cases: [
        { id: 'routing-1', input: 'handoff after evaluation', expected: 'Emily' },
        { id: 'evidence-1', input: 'missing scorecard', expected: 'RECOVERING' },
      ],
      scores: { consistency: 0.96, evidence_fidelity: 0.94 },
      regressions: [],
    },
  };
}

describe('SkillExecutor Lot 4B MCF-EVALUATE-AGENTS', () => {
  it('completes a reproducible governed agent evaluation and hands off to Emily', async () => {
    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Beatriz',
      inputs: validInputs(),
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result).toMatchObject({
      evidenceStatus: 'VALID',
      phaseState: 'COMPLETED',
      missionState: 'EXECUTING',
      handoffTo: 'Emily',
      rejectionReason: null,
    });
    expect(result.receipt?.metadata.executionEvidence).toMatchObject({
      scores: { consistency: 0.96, evidence_fidelity: 0.94 },
      regressions: [],
    });
  });

  it('accepts Tiago as a canonical owner', async () => {
    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Tiago',
      inputs: validInputs(),
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result.evidenceStatus).toBe('VALID');
  });

  it('moves to recovery when execution evidence is absent', async () => {
    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Beatriz',
      inputs: {
        behavior_or_configuration: 'Evaluate behavior.',
        criteria: ['reproducible'],
      },
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result).toMatchObject({ evidenceStatus: 'INVALID', phaseState: 'RECOVERING', handoffTo: null });
    expect(result.rejectionReason).toMatch(/execution_evidence/u);
  });

  it('rejects placeholder test cases', async () => {
    const inputs = validInputs();
    inputs.execution_evidence = {
      test_cases: [''],
      scores: { consistency: 0.9 },
      regressions: [],
    };

    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Beatriz',
      inputs,
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result.phaseState).toBe('RECOVERING');
    expect(result.rejectionReason).toMatch(/test_cases/u);
  });

  it('rejects an empty scorecard', async () => {
    const inputs = validInputs();
    inputs.execution_evidence = {
      test_cases: [{ id: 'case-1', expected: 'pass' }],
      scores: {},
      regressions: [],
    };

    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Beatriz',
      inputs,
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result.phaseState).toBe('RECOVERING');
    expect(result.rejectionReason).toMatch(/scores/u);
  });

  it('requires regressions evidence even when no regression exists', async () => {
    const inputs = validInputs();
    inputs.execution_evidence = {
      test_cases: [{ id: 'case-1', expected: 'pass' }],
      scores: { consistency: 1 },
    };

    const result = await createExecutor().execute({
      skillId: 'MCF-EVALUATE-AGENTS',
      agentId: 'Beatriz',
      inputs,
      tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
    });

    expect(result.phaseState).toBe('RECOVERING');
    expect(result.rejectionReason).toMatch(/regressions/u);
  });

  it('rejects a non-owner evaluator', async () => {
    await expect(
      createExecutor().execute({
        skillId: 'MCF-EVALUATE-AGENTS',
        agentId: 'Rafael',
        inputs: validInputs(),
        tool: { provider: 'internal', operation: 'evaluate-agents', resource: 'mcf-agent-runtime' },
      }),
    ).rejects.toBeInstanceOf(McfPermissionDeniedError);
  });

  it('rejects external provider execution for the governed evaluation skill', async () => {
    await expect(
      createExecutor().execute({
        skillId: 'MCF-EVALUATE-AGENTS',
        agentId: 'Beatriz',
        inputs: validInputs(),
        tool: { provider: 'github', operation: 'inspect-code', resource: 'repository' },
      }),
    ).rejects.toBeInstanceOf(McfPermissionDeniedError);
  });
});
""")

          Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner-lot4-evaluate-agents.test.ts').write_text("""import { describe, expect, it } from 'vitest';

import { ChatMissionPlanner } from './chat-mission-planner.js';

describe('ChatMissionPlanner Lot 4B MCF-EVALUATE-AGENTS', () => {
  it('infers agent evaluation as READY_AGENT owned by Beatriz', () => {
    const plan = new ChatMissionPlanner().plan({
      objective: 'Avaliar agentes com benchmark e scorecard reproduzível.',
    });

    const evaluation = plan.steps.find((step) => step.skillId === 'MCF-EVALUATE-AGENTS');
    expect(evaluation).toMatchObject({
      agentId: 'Beatriz',
      handoffTo: 'Emily',
      toolProvider: 'internal',
      toolOperation: 'evaluate-agents',
      toolResource: 'mcf-agent-runtime',
      state: 'READY_AGENT',
      requiredEvidence: ['test_cases', 'scores', 'regressions'],
    });
    expect(plan.contract.selectedSkills).toContain('MCF-EVALUATE-AGENTS');
  });

  it('keeps explicitly requested evaluation governed by the same READY_AGENT contract', () => {
    const plan = new ChatMissionPlanner().plan({
      objective: 'Run the requested evaluation.',
      requestedSkills: ['MCF-EVALUATE-AGENTS'],
    });

    const evaluation = plan.steps.find((step) => step.skillId === 'MCF-EVALUATE-AGENTS');
    expect(evaluation?.state).toBe('READY_AGENT');
    expect(evaluation?.agentId).toBe('Beatriz');
  });
});
""")

          Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/mission-runtime-lot4-evaluate-agents.integration.test.ts').write_text("""import { randomUUID } from 'node:crypto';

import { afterAll, beforeAll, describe, expect, it } from 'vitest';

import { DatabaseService } from '../database.service.js';
import { EvidenceValidator } from './evidence-validator.js';
import { MissionRuntimeService } from './mission-runtime.service.js';
import { OrderedMcfRuntimeRepository } from './ordered-mcf-runtime.repository.js';
import { PermissionEngine } from './permission-engine.js';
import { PostgresMcfRuntimeRepository } from './postgres-mcf-runtime.repository.js';
import { SkillExecutor } from './skill-executor.js';
import { SkillRegistryLoader } from './skill-registry.loader.js';

describe('MissionRuntime Lot 4B agent evaluation persistence', () => {
  let database: DatabaseService;
  let service: MissionRuntimeService;

  beforeAll(() => {
    process.env.MCF_RECEIPT_SECRET = 'test-only-mcf-receipt-secret-lot4b-evaluation-0001';
    database = new DatabaseService();
    const postgres = new PostgresMcfRuntimeRepository(database);
    const repository = new OrderedMcfRuntimeRepository(database, postgres);
    const registry = new SkillRegistryLoader();
    const evidence = new EvidenceValidator();
    const executor = new SkillExecutor(registry, new PermissionEngine(), evidence);
    service = new MissionRuntimeService(repository, executor, registry, evidence);
  });

  afterAll(async () => {
    await database.onModuleDestroy();
  });

  it('persists validated evaluation evidence, Emily handoff and version progression', async () => {
    const mission = await service.createMission({
      contract: {
        title: 'Lot 4B evaluation persistence proof',
        objective: 'Evaluate agent behavior with reproducible evidence.',
        expectedOutcome: 'Validated scorecard survives the MissionRuntime persistence boundary.',
        scope: ['MCF-EVALUATE-AGENTS'],
        outOfScope: ['production', 'external write'],
        acceptanceCriteria: ['evaluation evidence persists and version advances'],
        riskClass: 'C',
        selectedAgents: ['Beatriz', 'Emily'],
        selectedSkills: ['MCF-EVALUATE-AGENTS'],
        sourceOfTruth: ['skills/registry.yaml', 'docs/agentes/BEATRIZ.md'],
      },
    });

    try {
      const result = await service.executePhase(mission.id, {
        phaseId: randomUUID(),
        skillId: 'MCF-EVALUATE-AGENTS',
        agentId: 'Beatriz',
        expectedMissionVersion: 1,
        inputs: {
          behavior_or_configuration: 'Evaluate agent handoff behavior.',
          criteria: ['handoff consistency', 'evidence fidelity'],
          execution_evidence: {
            test_cases: [{ id: 'handoff-1', expected: 'Emily receives the evaluation' }],
            scores: { handoff_consistency: 1, evidence_fidelity: 0.95 },
            regressions: [],
          },
        },
        tool: {
          provider: 'internal',
          operation: 'evaluate-agents',
          resource: 'mcf-agent-runtime',
        },
      });

      expect(result).toMatchObject({
        phaseState: 'COMPLETED',
        evidenceStatus: 'VALID',
        handoffTo: 'Emily',
      });
      expect(result.mission.version).toBe(2);
      expect(result.mission.currentAgentId).toBe('Emily');
      expect(result.receipt?.metadata.executionEvidence).toMatchObject({
        scores: { handoff_consistency: 1, evidence_fidelity: 0.95 },
        regressions: [],
      });

      const timeline = await service.timeline(mission.id);
      expect(timeline.mission.version).toBe(2);
      expect(timeline.events.some((event) => event.eventType === 'TOOL_RECEIPT_RECORDED')).toBe(true);
      expect(timeline.events.some((event) => event.eventType === 'EVIDENCE_VALIDATED')).toBe(true);
      expect(timeline.events.some((event) => event.eventType === 'HANDOFF_CREATED')).toBe(true);
      expect(timeline.events.some((event) => event.eventType === 'PHASE_COMPLETED')).toBe(true);
    } finally {
      await database.query('delete from "mcf_missions" where "id" = $1', [mission.id]);
    }
  });
});
""")
