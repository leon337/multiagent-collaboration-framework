name: Lot 4B Implementation

on:
  push:
    branches:
      - feat/mcf-runtime-006-lot4-b-evaluate-agents

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-lot4-b-evaluate-agents
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply runtime changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          contracts = 'apps/rede-social-agentes/packages/contracts/src/mcf-runtime.ts'
          replace_once(contracts, "  | 'MCF-TRACE-MISSION';", "  | 'MCF-TRACE-MISSION'\n  | 'MCF-EVALUATE-AGENTS';")

          planner = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/chat-mission-planner.ts'
          replace_once(
              planner,
              "  'MCF-TRACE-MISSION': {\n    agentId: 'Augusto',\n    handoffTo: 'Beatriz',\n    toolProvider: 'internal',\n    toolOperation: 'inspect-mission',\n    internal: true,\n    requiredEvidence: ['chronological_trace', 'handoff_status', 'recovery_status'],\n  },\n};",
              "  'MCF-TRACE-MISSION': {\n    agentId: 'Augusto',\n    handoffTo: 'Beatriz',\n    toolProvider: 'internal',\n    toolOperation: 'inspect-mission',\n    internal: true,\n    requiredEvidence: ['chronological_trace', 'handoff_status', 'recovery_status'],\n  },\n  'MCF-EVALUATE-AGENTS': {\n    agentId: 'Beatriz',\n    handoffTo: 'Emily',\n    toolProvider: 'internal',\n    toolOperation: 'evaluate-agents',\n    internal: false,\n    requiredEvidence: ['test_cases', 'scores', 'regressions'],\n  },\n};",
          )
          replace_once(
              planner,
              "const validationTerms = ['testar', 'validar', 'auditar', 'verificar', 'smoke', 'ci'];",
              "const validationTerms = ['testar', 'validar', 'auditar', 'verificar', 'smoke', 'ci'];\nconst evaluationTerms = [\n  'avaliar agentes',\n  'avaliar agente',\n  'benchmark',\n  'regressão de prompt',\n  'regressao de prompt',\n  'scorecard',\n];",
          )
          replace_once(
              planner,
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, deploymentTerms)) {",
              "  const normalized = request.objective.toLowerCase();\n  if (includesAny(normalized, evaluationTerms)) {\n    return [\n      'MCF-START-MISSION',\n      'MCF-SELECT-AGENTS',\n      'MCF-EVALUATE-AGENTS',\n      'MCF-TRACE-MISSION',\n    ];\n  }\n  if (includesAny(normalized, deploymentTerms)) {",
          )

          executor = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/skill-executor.ts'
          replace_once(
              executor,
              "  'MCF-TRACE-MISSION',\n]);",
              "  'MCF-TRACE-MISSION',\n  'MCF-EVALUATE-AGENTS',\n]);",
          )
          replace_once(
              executor,
              "  'MCF-TRACE-MISSION',\n]);\n\ntype CiQueryConclusion",
              "  'MCF-TRACE-MISSION',\n  'MCF-EVALUATE-AGENTS',\n]);\n\ntype CiQueryConclusion",
          )
          replace_once(
              executor,
              "`${skill.skillId} Lot 4A execution is restricted to the governed internal provider`,",
              "`${skill.skillId} governed execution is restricted to the internal provider`,",
          )

          evidence = 'apps/rede-social-agentes/apps/server/src/mcf-runtime/internal-skill-evidence.ts'
          replace_once(
              evidence,
              "  'MCF-DESIGN-ARCHITECTURE',\n]);",
              "  'MCF-DESIGN-ARCHITECTURE',\n  'MCF-EVALUATE-AGENTS',\n]);",
          )
          anchor = "function requireReference(\n  record: Record<string, unknown>,"
          helpers = """function isMeaningfulScoreValue(value: unknown): boolean {
  if (typeof value === 'number') return Number.isFinite(value);
  if (typeof value === 'string') return value.trim().length > 0;
  if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
    return Object.keys(value as Record<string, unknown>).length > 0;
  }
  return false;
}

function requireScores(
  record: Record<string, unknown>,
  key: string,
  message: string,
): unknown[] | Record<string, unknown> {
  const value = record[key];
  if (Array.isArray(value)) {
    if (value.length > 0 && value.every(isMeaningfulScoreValue)) return value;
    return reject(message);
  }
  if (typeof value === 'object' && value !== null) {
    const scores = value as Record<string, unknown>;
    const entries = Object.entries(scores);
    if (entries.length > 0 && entries.every(([, score]) => isMeaningfulScoreValue(score))) {
      return scores;
    }
  }
  return reject(message);
}

""" + anchor
          replace_once(evidence, anchor, helpers)
          replace_once(
              evidence,
              "    default:\n      return evidence;",
              "    case 'MCF-EVALUATE-AGENTS':\n      return {\n        test_cases: requireArray(\n          evidence,\n          'test_cases',\n          'MCF-EVALUATE-AGENTS requires non-empty test_cases evidence',\n        ),\n        scores: requireScores(\n          evidence,\n          'scores',\n          'MCF-EVALUATE-AGENTS requires non-empty scores evidence',\n        ),\n        regressions: requireArray(\n          evidence,\n          'regressions',\n          'MCF-EVALUATE-AGENTS requires regressions evidence, even when empty',\n          { allowEmpty: true },\n        ),\n      };\n    default:\n      return evidence;",
          )
          replace_once(
              evidence,
              "reject(`${skill.skillId} Lot 4A execution requires the governed internal provider`);",
              "reject(`${skill.skillId} governed execution requires the internal provider`);",
          )
          PY

      - name: Format changed files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            packages/contracts/src/mcf-runtime.ts \
            apps/server/src/mcf-runtime/chat-mission-planner.ts \
            apps/server/src/mcf-runtime/skill-executor.ts \
            apps/server/src/mcf-runtime/internal-skill-evidence.ts \
            apps/server/src/mcf-runtime/skill-executor-lot4-evaluate-agents.test.ts \
            apps/server/src/mcf-runtime/chat-mission-planner-lot4-evaluate-agents.test.ts \
            apps/server/src/mcf-runtime/mission-runtime-lot4-evaluate-agents.integration.test.ts

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/lot4b-implementation.yml
          git diff --check
          git config user.name "MCF Runtime Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(runtime): execute agent evaluation skill"
          git push origin HEAD:feat/mcf-runtime-006-lot4-b-evaluate-agents
