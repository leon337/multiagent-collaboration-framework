name: Lot 4E PRF Manifest Audit

on:
  push:
    branches:
      - audit/mcf-runtime-006-lot4e-prf-9e3f0db

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact PRF manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/phases/PHASE-006-LOT-4-E-CLOSE-PHASE
          sha256sum -c PHASE-006-LOT-4-E-CLOSE-PHASE-ARTIFACT-MANIFEST.sha256
