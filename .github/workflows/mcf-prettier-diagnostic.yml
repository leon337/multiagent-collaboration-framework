name: MCF Prettier Diagnostic

on:
  push:
    branches:
      - fix/issue-140-disable-production-autodeploy

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print canonical Prettier diff
        run: |
          pnpm exec prettier --write apps/server/src/mcf-runtime/render-production-promotion.adapter.ts
          git -C ../.. diff -- apps/rede-social-agentes/apps/server/src/mcf-runtime/render-production-promotion.adapter.ts
          exit 1
