name: MCF 427 Security Lockfile Regeneration

on:
  push:
    branches:
      - security/mcf-427-cve-remediation
    paths:
      - .github/workflows/mcf-427-security-lockfile.yml

permissions:
  contents: write

jobs:
  regen-locked-security-tree:
    if: github.repository == 'leon337/multiagent-collaboration-framework' && github.ref == 'refs/heads/security/mcf-427-cve-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/rede-social-agentes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.17.0'
      - name: Regenerate compatible security lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit security lockfile without modifying main
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(security): resolve lockfile for patched runtime dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify locked installation
        run: pnpm install --frozen-lockfile
      - name: Run production dependency audit without exceptions
        run: pnpm audit --prod --audit-level high
