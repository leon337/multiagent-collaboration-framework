name: MCF Runtime Format Once

on:
  push:
    branches:
      - feat/mcf-runtime-five-sprints

permissions:
  contents: write

concurrency:
  group: mcf-runtime-format-once
  cancel-in-progress: false

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore(mcf): apply prettier formatting') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-five-sprints
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier
        working-directory: apps/rede-social-agentes
        run: pnpm format

      - name: Commit deterministic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/rede-social-agentes
          git commit -m "chore(mcf): apply prettier formatting"
          git push origin HEAD:feat/mcf-runtime-five-sprints
