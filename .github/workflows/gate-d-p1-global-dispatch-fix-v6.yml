name: Gate D P1 Global Dispatch Fix V6

on:
  push:
    branches:
      - feat/mcf-runtime-006-gate-d-staging-deploy-adapter
    paths:
      - ".github/workflows/gate-d-p1-global-dispatch-fix-v6.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile
      - name: Extend persistent global scope to Gate D
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts')
          text = path.read_text()

          old_constants = """const globallySerializedOperations = new Set([
            'comment-pr',
            'review-pr-comment',
            'update-pr-text-metadata',
          ]);
          """
          new_constants = old_constants + """const globallySerializedStagingDeployAdapter = 'github-actions-staging-deploy-v1';
          const globallySerializedStagingDeployOperation = 'deploy-staging';
          """
          if text.count(old_constants) != 1:
              raise SystemExit(f'expected one constants block, found {text.count(old_constants)}')
          text = text.replace(old_constants, new_constants, 1)

          old_head = """  if (!idempotencyKey || adapterId !== globallySerializedAdapter) return null;

            const operation = canonicalizeToolValue(request.tool.operation);
            if (!globallySerializedOperations.has(operation)) return null;

            const pullRequestNumber = request.inputs.pull_request_number;
          """
          new_head = """  if (!idempotencyKey) return null;

            const operation = canonicalizeToolValue(request.tool.operation);
            if (
              adapterId === globallySerializedStagingDeployAdapter &&
              operation === globallySerializedStagingDeployOperation
            ) {
              const repository = request.inputs.repository;
              if (typeof repository !== 'string' || repository.trim().length === 0) return null;

              const payload = {
                adapterId,
                provider: canonicalizeProvider(request.tool.provider),
                operation,
                resource: request.tool.resource.trim().toLowerCase(),
                repository: repository.trim().toLowerCase(),
                idempotencyKey,
              };
              return createHash('sha256').update(JSON.stringify(payload)).digest('hex');
            }

            if (adapterId !== globallySerializedAdapter || !globallySerializedOperations.has(operation)) {
              return null;
            }

            const pullRequestNumber = request.inputs.pull_request_number;
          """
          if text.count(old_head) != 1:
              raise SystemExit(f'expected one scope head, found {text.count(old_head)}')
          text = text.replace(old_head, new_head, 1)
          path.write_text(text)
          PY
      - name: Add Gate D concurrent reservation regression
        run: |
          cat > apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts <<'EOF'
          import { randomUUID } from 'node:crypto';

          import type { McfSkillDefinition } from '@rsa/contracts';
          import { afterAll, beforeAll, describe, expect, it } from 'vitest';

          import { DatabaseService } from '../database.service.js';
          import { ExternalActionLedger } from './external-action-ledger.js';
          import type { ExternalActionRequest } from './external-action.contracts.js';

          const REPOSITORY = 'leon337/multiagent-collaboration-framework';
          const IDEMPOTENCY_KEY = 'mcf-gate-d-global-idempotency-0001';
          const RELEASE_SHA = 'b'.repeat(40);

          const skill: McfSkillDefinition = {
            skillId: 'MCF-DEPLOY-VALIDATE',
            name: 'Deploy Validate',
            version: '1.0.0',
            purpose: 'verified staging deployment',
            ownerAgents: ['Gabriel'],
            requiredInputs: ['artifact_or_commit', 'target_environment'],
            allowedTools: ['GitHub', 'Render'],
            forbiddenTools: ['public_production_without_gate'],
            permissionProfile: 'SCOPED_WRITE',
            executionSteps: [],
            requiredEvidence: [],
            acceptanceCriteria: [],
            failureModes: [],
            fallback: 'Mestre',
            handoffTo: 'Mestre',
          };

          function missionContract(title: string) {
            return JSON.stringify({
              title,
              objective: 'Serialize concurrent Gate D staging dispatches.',
              expectedOutcome: 'Only one mission may claim the same deploy idempotency key.',
              scope: ['Gate D persistent global idempotency'],
              outOfScope: ['real provider write'],
              acceptanceCriteria: ['one durable global reservation'],
              riskClass: 'C',
              selectedAgents: ['Gabriel', 'Mestre'],
              selectedSkills: ['MCF-DEPLOY-VALIDATE'],
              sourceOfTruth: ['MCF-RUNTIME-006-GATE-D'],
            });
          }

          function request(missionId: string, phaseId: string): ExternalActionRequest {
            return {
              skill,
              agentId: 'Gabriel',
              inputs: {
                authorizedScope: true,
                repository: REPOSITORY,
                artifact_or_commit: RELEASE_SHA,
                target_environment: 'staging',
                idempotency_key: IDEMPOTENCY_KEY,
              },
              tool: {
                provider: 'github',
                operation: 'deploy-staging',
                resource: REPOSITORY,
              },
              context: { missionId, phaseId, expectedMissionVersion: 1 },
            };
          }

          describe('Gate D global staging deploy idempotency', () => {
            let database: DatabaseService;
            let ledgerA: ExternalActionLedger;
            let ledgerB: ExternalActionLedger;

            beforeAll(() => {
              database = new DatabaseService();
              ledgerA = new ExternalActionLedger(database);
              ledgerB = new ExternalActionLedger(database);
            });

            afterAll(async () => {
              await database.onModuleDestroy();
            });

            it('allows exactly one reservation across concurrent missions using the same deploy key', async () => {
              const missionA = randomUUID();
              const missionB = randomUUID();
              const phaseA = randomUUID();
              const phaseB = randomUUID();
              const now = new Date();

              try {
                await database.query(
                  `insert into "mcf_missions" (
                    "id", "contract", "state", "current_phase_id", "current_agent_id",
                    "version", "created_at", "updated_at"
                  ) values
                    ($1, $2::jsonb, 'EXECUTING', null, 'Gabriel', 1, $5, $5),
                    ($3, $4::jsonb, 'EXECUTING', null, 'Gabriel', 1, $5, $5)`,
                  [
                    missionA,
                    missionContract('Gate D concurrent mission A'),
                    missionB,
                    missionContract('Gate D concurrent mission B'),
                    now,
                  ],
                );

                const outcomes = await Promise.allSettled([
                  ledgerA.reserve(request(missionA, phaseA), 'github-actions-staging-deploy-v1'),
                  ledgerB.reserve(request(missionB, phaseB), 'github-actions-staging-deploy-v1'),
                ]);

                const fulfilled = outcomes.filter(
                  (outcome): outcome is PromiseFulfilledResult<string> => outcome.status === 'fulfilled',
                );
                const rejected = outcomes.filter(
                  (outcome): outcome is PromiseRejectedResult => outcome.status === 'rejected',
                );

                expect(fulfilled).toHaveLength(1);
                expect(rejected).toHaveLength(1);
                expect(rejected[0]?.reason).toMatchObject({
                  code: 'RESERVATION_CONFLICT',
                  retryable: false,
                });

                const attempts = await database.query<{
                  missionId: string;
                  scopeKey: string | null;
                  status: string;
                }>(
                  `select "mission_id" as "missionId", "idempotency_scope_key" as "scopeKey", "status"
                   from "mcf_external_action_attempts"
                   where "mission_id" = any($1::text[])`,
                  [[missionA, missionB]],
                );

                expect(attempts.rows).toHaveLength(1);
                expect(attempts.rows[0]?.scopeKey).not.toBeNull();
                expect(attempts.rows[0]?.status).toBe('ALLOWED');
              } finally {
                await database.query(
                  `delete from "mcf_external_action_attempts" where "mission_id" = any($1::text[])`,
                  [[missionA, missionB]],
                );
                await database.query(
                  `delete from "mcf_events" where "mission_id" = any($1::text[])`,
                  [[missionA, missionB]],
                );
                await database.query(
                  `delete from "mcf_missions" where "id" = any($1::text[])`,
                  [[missionA, missionB]],
                );
              }
            });
          });
          EOF
      - name: Format and validate Gate D global reservation
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          pnpm exec prettier --check \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          pnpm build:packages
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/server typecheck
          pnpm --filter @rsa/server exec vitest run \
            src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts \
            src/mcf-runtime/external-action-dispatcher.staging-deploy.test.ts
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/gate-d-p1-global-dispatch-fix.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v2.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v3.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v4.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v5.yml
          git rm .github/workflows/gate-d-p1-global-dispatch-fix-v6.yml
      - name: Enforce exact changed path set
        run: |
          git add apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<'EOF'
          .github/workflows/gate-d-p1-global-dispatch-fix-v2.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v3.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v4.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v5.yml
          .github/workflows/gate-d-p1-global-dispatch-fix-v6.yml
          .github/workflows/gate-d-p1-global-dispatch-fix.yml
          apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts
          apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          EOF
          git diff HEAD --name-only | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          git diff HEAD --check
      - name: Commit P1 global dispatch remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/github-staging-deploy.global-idempotency.integration.test.ts
          git commit -m 'fix(gate-d): serialize concurrent staging dispatches'
          git push origin HEAD:feat/mcf-runtime-006-gate-d-staging-deploy-adapter
