name: MCF v1.0.0-RC2 Publication

on:
  workflow_run:
    workflows:
      - MCF Production Readiness
    types:
      - completed

permissions:
  contents: write

jobs:
  publish-rc2:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify publication boundary
        env:
          RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-list -n 1 v1.0.0-RC1)" = "$RC1_SHA"
          test -f docs/releases/MCF-v1.0.0-RC2.md

      - name: Create or verify immutable RC2 tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RC2_TAG: v1.0.0-RC2
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_ref="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/git/ref/tags/$RC2_TAG" --jq '.object.sha' 2>/dev/null || true)"

          if [ -n "$existing_ref" ]; then
            existing_release="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/releases/tags/$RC2_TAG" --jq '.target_commitish' 2>/dev/null || true)"
            test -n "$existing_release"
            test "$existing_release" = "$existing_ref"
            echo "RC2 already exists at $existing_ref; refusing to retarget and completing as immutable NOOP."
            exit 0
          fi

          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$RC2_TAG" \
            -f sha="$TARGET_SHA" >/dev/null

          existing_release_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/releases/tags/$RC2_TAG" --jq '.id' 2>/dev/null || true)"
          if [ -z "$existing_release_id" ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' \
              "/repos/$REPOSITORY/releases" \
              -f tag_name="$RC2_TAG" \
              -f target_commitish="$TARGET_SHA" \
              -f name='MCF v1.0.0-RC2' \
              -f body='Production candidate pós-RC1. RC1 preservada; produção e v1.0.0 estável permanecem milestones separados.' \
              -F draft=false \
              -F prerelease=true >/dev/null
          fi

          test "$(git ls-remote origin "refs/tags/$RC2_TAG" | cut -f1)" = "$TARGET_SHA"
          release_target="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/releases/tags/$RC2_TAG" --jq '.target_commitish')"
          test "$release_target" = "$TARGET_SHA"
