name: MCF v1.0.0-RC2 Publication

on:
  workflow_run:
    workflows:
      - MCF Production Readiness
    types:
      - completed

permissions:
  contents: write

jobs:
  publish-rc2:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualified main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify publication boundary
        env:
          RC1_SHA: 9b4a759a4c2f1318adb0d3a09a2462f6b1c735a8
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-list -n 1 v1.0.0-RC1)" = "$RC1_SHA"
          test -f docs/releases/MCF-v1.0.0-RC2.md

      - name: Create or verify immutable RC2 tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RC2_TAG: v1.0.0-RC2
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_ref="$(git ls-remote origin "refs/tags/$RC2_TAG" | cut -f1)"

          if [ -n "$existing_ref" ]; then
            test "$existing_ref" != "$RC1_SHA"
            existing_release_target="$(gh release view "$RC2_TAG" --repo "$REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            test -n "$existing_release_target"
            echo "RC2 already exists at $existing_ref; refusing to retarget and completing as immutable NOOP."
            exit 0
          fi

          git tag "$RC2_TAG" "$TARGET_SHA"
          git push origin "refs/tags/$RC2_TAG"
          test "$(git ls-remote origin "refs/tags/$RC2_TAG" | cut -f1)" = "$TARGET_SHA"

          if ! gh release view "$RC2_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RC2_TAG" \
              --repo "$REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'MCF v1.0.0-RC2' \
              --notes 'Production candidate pós-RC1. RC1 preservada; produção e v1.0.0 estável permanecem milestones separados.' \
              --prerelease
          fi

          gh release view "$RC2_TAG" --repo "$REPOSITORY" --json isPrerelease,tagName --jq 'select(.isPrerelease == true and .tagName == "v1.0.0-RC2") | .tagName' | grep -qx "$RC2_TAG"
