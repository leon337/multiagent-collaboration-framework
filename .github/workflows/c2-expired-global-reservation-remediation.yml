name: C2 Expired Global Reservation Remediation

on:
  push:
    branches:
      - feat/mcf-runtime-006-c2-pr-collaboration-write

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mcf-runtime-006-c2-pr-collaboration-write
          fetch-depth: 0

      - name: Patch ledger global lease preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts')
          text = path.read_text()

          import_anchor = "} from './external-action.contracts.js';\n"
          import_line = "import { reconcileExpiredGlobalIdempotencyReservation } from './external-action-global-reservation.js';\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('external-action contracts import anchor mismatch')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = """    const attemptId = randomUUID();
    const occurredAt = new Date();
    const leaseExpiresAt = new Date(occurredAt.getTime() + EXTERNAL_ACTION_LEASE_MS);

    try {
"""
          new = """    const attemptId = randomUUID();
    const occurredAt = new Date();
    const leaseExpiresAt = new Date(occurredAt.getTime() + EXTERNAL_ACTION_LEASE_MS);

    if (idempotencyScopeKey) {
      await this.database.transaction(async (client) => {
        await reconcileExpiredGlobalIdempotencyReservation(client, idempotencyScopeKey, occurredAt);
      });
    }

    try {
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('reserve preflight anchor mismatch')

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        working-directory: apps/rede-social-agentes
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Format remediation files
        working-directory: apps/rede-social-agentes
        run: |
          pnpm exec prettier --write \
            apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/server/src/mcf-runtime/external-action-global-reservation.ts

      - name: Commit remediation if needed
        run: |
          if git diff --quiet; then
            echo "Expired-global-reservation remediation already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-ledger.ts \
            apps/rede-social-agentes/apps/server/src/mcf-runtime/external-action-global-reservation.ts
          git commit -m "fix(mcf): reconcile expired global C2 reservations"
          git push origin HEAD:feat/mcf-runtime-006-c2-pr-collaboration-write
