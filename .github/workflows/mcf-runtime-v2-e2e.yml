name: MCF Runtime V2 E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-runtime-v2-e2e
  cancel-in-progress: false

jobs:
  validate-runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      MCF_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}
      MCF_RUNTIME_TOKEN: ${{ secrets.MCF_RUNTIME_TOKEN }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Validate runtime configuration
        run: |
          test -n "$MCF_RUNTIME_URL"
          test -n "$MCF_RUNTIME_TOKEN"

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply CI database migrations twice
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Bootstrap staging mission and phase
        env:
          TECHNICAL_EMAIL: mcf-v2-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          (async () => {
            const api = async (path, method, body, token) => {
              const response = await fetch(`${process.env.MCF_RUNTIME_URL}${path}`, {
                method,
                headers: {
                  'content-type': 'application/json',
                  ...(token ? { authorization: `Bearer ${token}` } : {}),
                },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              const text = await response.text();
              let data;
              try {
                data = text ? JSON.parse(text) : {};
              } catch {
                data = { raw: text };
              }
              if (!response.ok) {
                throw new Error(`${method} ${path} failed (${response.status}): ${JSON.stringify(data)}`);
              }
              return data;
            };

            const password = `${crypto.randomBytes(36).toString('base64url')}Aa1!`;
            await api('/v1/accounts', 'POST', {
              email: process.env.TECHNICAL_EMAIL,
              password,
              displayName: 'MCF Runtime V2 E2E',
            });

            const session = await api('/v1/sessions', 'POST', {
              email: process.env.TECHNICAL_EMAIL,
              password,
            });
            if (!session.token) throw new Error('Session response did not contain a token.');

            const mission = await api('/v1/mcf/missions', 'POST', {
              contract: {
                title: 'MCF Runtime Staging V2 E2E',
                objective: 'Provar uma execução externa completa no PostgreSQL de staging v2.',
                expectedOutcome: 'Validação completa, callback autenticado, recibo persistido e idempotência confirmada.',
                scope: ['staging-v2', 'github-actions', 'callback', 'event-ledger'],
                outOfScope: ['production', 'skill-expansion', 'social-publication'],
                acceptanceCriteria: [
                  'pnpm verify executado com sucesso',
                  'callback autenticado aceito',
                  'missão concluída',
                  'callback repetido tratado como duplicado',
                ],
                riskClass: 'B',
                selectedAgents: ['Renato'],
                selectedSkills: ['MCF-RUN-TESTS'],
                sourceOfTruth: [
                  'skills/registry.yaml',
                  '.github/workflows/mcf-runtime-v2-e2e.yml',
                ],
              },
            }, session.token);

            const phase = await api(`/v1/mcf/missions/${mission.id}/phases/execute`, 'POST', {
              skillId: 'MCF-RUN-TESTS',
              agentId: 'Renato',
              inputs: {
                acceptance_criteria: ['pnpm verify passa'],
                test_target: `main@${process.env.TARGET_SHA}`,
                authorizedScope: true,
              },
              tool: {
                provider: 'github-actions',
                operation: 'workflow-result',
                resource: process.env.GITHUB_REPOSITORY,
              },
              expectedMissionVersion: mission.version,
            }, session.token);

            console.log(`::add-mask::${session.token}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `SESSION_TOKEN=${session.token}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `MISSION_ID=${mission.id}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `PHASE_ID=${phase.phaseId}\n`);
            fs.appendFileSync(process.env.GITHUB_ENV, `TECHNICAL_ACCOUNT_EMAIL=${process.env.TECHNICAL_EMAIL}\n`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `## Bootstrap\n\n- Mission: \`${mission.id}\`\n- Phase: \`${phase.phaseId}\`\n- State: \`${phase.mission.state}\`\n- Evidence: \`${phase.evidenceStatus}\`\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Execute complete MCF validation
        id: verify
        continue-on-error: true
        working-directory: apps/rede-social-agentes
        run: pnpm verify

      - name: Prepare immutable callback timestamp
        if: always()
        run: echo "CALLBACK_COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Send primary callback
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const conclusion = process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failure';
            const payload = {
              missionId: process.env.MISSION_ID,
              phaseId: process.env.PHASE_ID,
              workflowName: process.env.WORKFLOW_NAME,
              workflowRunId: process.env.WORKFLOW_RUN_ID,
              repository: process.env.REPOSITORY,
              commitSha: process.env.TARGET_SHA,
              conclusion,
              completedAt: process.env.CALLBACK_COMPLETED_AT,
            };
            const response = await fetch(`${process.env.MCF_RUNTIME_URL}/v1/mcf/callbacks/github-actions`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-mcf-runtime-token': process.env.MCF_RUNTIME_TOKEN,
                'x-correlation-id': `github-actions-${process.env.WORKFLOW_RUN_ID}`,
              },
              body: JSON.stringify(payload),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Primary callback failed (${response.status}): ${body}`);
            const result = JSON.parse(body);
            if (result.duplicate !== false) throw new Error(`Expected duplicate=false, got ${body}`);
            if (conclusion === 'success' && (result.evidenceStatus !== 'VALID' || result.missionState !== 'COMPLETED')) {
              throw new Error(`Unexpected successful callback result: ${body}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `\n## Primary callback\n\n- Duplicate: \`${result.duplicate}\`\n- Evidence: \`${result.evidenceStatus}\`\n- Mission state: \`${result.missionState}\`\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Repeat identical callback for idempotency
        if: steps.verify.outcome == 'success'
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const payload = {
              missionId: process.env.MISSION_ID,
              phaseId: process.env.PHASE_ID,
              workflowName: process.env.WORKFLOW_NAME,
              workflowRunId: process.env.WORKFLOW_RUN_ID,
              repository: process.env.REPOSITORY,
              commitSha: process.env.TARGET_SHA,
              conclusion: 'success',
              completedAt: process.env.CALLBACK_COMPLETED_AT,
            };
            const response = await fetch(`${process.env.MCF_RUNTIME_URL}/v1/mcf/callbacks/github-actions`, {
              method: 'POST',
              headers: {
                'content-type': 'application/json',
                'x-mcf-runtime-token': process.env.MCF_RUNTIME_TOKEN,
                'x-correlation-id': `github-actions-${process.env.WORKFLOW_RUN_ID}`,
              },
              body: JSON.stringify(payload),
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`Duplicate callback failed (${response.status}): ${body}`);
            const result = JSON.parse(body);
            if (result.duplicate !== true || result.evidenceStatus !== 'VALID' || result.missionState !== 'COMPLETED') {
              throw new Error(`Unexpected duplicate callback result: ${body}`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `\n## Idempotency\n\n- Duplicate: \`${result.duplicate}\`\n- Evidence: \`${result.evidenceStatus}\`\n- Mission state: \`${result.missionState}\`\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Confirm persisted mission and timeline
        if: steps.verify.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const request = async (path) => {
              const response = await fetch(`${process.env.MCF_RUNTIME_URL}${path}`, {
                headers: { authorization: `Bearer ${process.env.SESSION_TOKEN}` },
              });
              const body = await response.text();
              if (!response.ok) throw new Error(`GET ${path} failed (${response.status}): ${body}`);
              return JSON.parse(body);
            };

            const mission = await request(`/v1/mcf/missions/${process.env.MISSION_ID}`);
            const timeline = await request(`/v1/mcf/missions/${process.env.MISSION_ID}/timeline`);
            if (mission.state !== 'COMPLETED') throw new Error(`Mission is ${mission.state}, expected COMPLETED.`);
            const callbackEvents = timeline.events.filter((event) => event.eventType === 'CI_CALLBACK_RECEIVED');
            if (callbackEvents.length < 1) throw new Error('No CI_CALLBACK_RECEIVED event was persisted.');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `\n## Persistence\n\n- Mission state: \`${mission.state}\`\n- Version: \`${mission.version}\`\n- Timeline events: \`${timeline.events.length}\`\n- Callback events: \`${callbackEvents.length}\`\n`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Revoke technical session
        if: always() && env.SESSION_TOKEN != ''
        continue-on-error: true
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch(`${process.env.MCF_RUNTIME_URL}/v1/sessions/current`, {
              method: 'DELETE',
              headers: { authorization: `Bearer ${process.env.SESSION_TOKEN}` },
            });
            if (!response.ok) {
              const body = await response.text();
              throw new Error(`Session revocation failed (${response.status}): ${body}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Preserve validation failure
        if: steps.verify.outcome != 'success'
        run: exit 1
