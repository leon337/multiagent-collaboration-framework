name: MCF Runtime V2 E2E

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mcf-runtime-v2-e2e.yml
      - apps/rede-social-agentes/ops/mcf-runtime-v2-e2e.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcf-runtime-v2-e2e
  cancel-in-progress: false

jobs:
  validate-runtime-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: rsa
          POSTGRES_USER: rsa
          POSTGRES_PASSWORD: rsa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsa -d rsa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgresql://rsa:rsa_ci_only@127.0.0.1:5432/rsa
      LOG_LEVEL: error
      MCF_RUNTIME_URL: ${{ secrets.MCF_RUNTIME_URL }}
      MCF_RUNTIME_TOKEN: ${{ secrets.MCF_RUNTIME_TOKEN }}

    steps:
      - name: Validate runtime configuration
        run: |
          test -n "$MCF_RUNTIME_URL"
          test -n "$MCF_RUNTIME_TOKEN"

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: apps/rede-social-agentes
        run: pnpm install --frozen-lockfile

      - name: Apply CI database migrations twice
        working-directory: apps/rede-social-agentes
        run: |
          pnpm --filter @rsa/database db:migrate
          pnpm --filter @rsa/database db:migrate

      - name: Validate eight executable skills in staging
        run: node apps/rede-social-agentes/ops/mcf-runtime-v2-e2e.mjs
