registry:
  name: MCF Skill Registry
  version: 1.0.0
  status: ACTIVE
  authority_human: Leandro
  authority_operational: Leo
  coordinator: Mestre
  decision_baseline:
    - MCF-DEC-050
    - MCF-DEC-051
    - MCF-DEC-052

permission_profiles:
  - READ_ONLY
  - READ_AND_PROPOSE
  - SCOPED_WRITE
  - SENSITIVE_CONTROLLED
  - HUMAN_GATE

skills:
  - skill_id: MCF-START-MISSION
    name: Iniciar missão
    version: 1.0.0
    purpose: Definir contrato, fase, objetivo, risco, critérios e equipe.
    owner_agents: [Mestre]
    trigger_phrases: ["iniciar missão", "iniciar projeto", "assumir projeto"]
    required_inputs: [objective]
    optional_inputs: [scope, constraints, source_of_truth]
    allowed_tools: [GitHub, Linear, Notion, Google_Drive]
    forbidden_tools: [public_deployment, destructive_write]
    permission_profile: READ_AND_PROPOSE
    execution_steps:
      - classificar_missao
      - definir_contrato
      - selecionar_agentes
      - abrir_primeira_passagem
    required_evidence: [mission_id, phase_id, selected_agents, acceptance_criteria]
    expected_outputs: [mission_contract, initial_handoff]
    acceptance_criteria: [objective_verifiable, agents_have_real_delivery]
    failure_modes: [objective_ambiguous, missing_authorization]
    fallback: Executar somente descoberta e registrar lacunas.
    handoff_to: Miriam

  - skill_id: MCF-SELECT-AGENTS
    name: Selecionar agentes por competência
    version: 1.0.0
    purpose: Convocar somente agentes com entrega necessária.
    owner_agents: [Mestre, Leo]
    trigger_phrases: ["chame os agentes", "selecione a equipe", "quem participa"]
    required_inputs: [mission_contract]
    optional_inputs: [risk_class]
    allowed_tools: [Notion, GitHub]
    forbidden_tools: [decorative_participation]
    permission_profile: READ_ONLY
    execution_steps: [mapear_competencias, justificar_selecao, ordenar_fluxo]
    required_evidence: [selection_justifications]
    expected_outputs: [selected_agents, initial_execution_order]
    acceptance_criteria: [no_agent_without_delivery]
    failure_modes: [role_overlap, missing_competence]
    fallback: Ampliar equipe por lacuna objetiva e registrar motivo.
    handoff_to: selected_domain_agent

  - skill_id: MCF-RECOVER-CONTEXT
    name: Recuperar contexto e fonte de verdade
    version: 1.0.0
    purpose: Retomar missão sem reconstrução inventada.
    owner_agents: [Miriam]
    trigger_phrases: ["retomar projeto", "o que ficou decidido", "recuperar contexto"]
    required_inputs: [project_or_mission_reference]
    optional_inputs: [time_window, document_paths]
    allowed_tools: [GitHub, Google_Drive, Notion, Gmail, Granola, Fireflies, MeetGeek]
    forbidden_tools: [invent_missing_content]
    permission_profile: READ_ONLY
    execution_steps: [localizar_fontes, validar_precedencia, detectar_contradicoes, montar_context_package]
    required_evidence: [source_references, precedence_decisions, contradictions]
    expected_outputs: [context_package, source_of_truth_map]
    acceptance_criteria: [provenance_preserved, gaps_declared]
    failure_modes: [source_missing, conflicting_sources]
    fallback: Declarar lacuna e transferir decisão de precedência para Léo.
    handoff_to: Mestre

  - skill_id: MCF-DEFINE-PRODUCT
    name: Definir produto e requisitos
    version: 1.0.0
    purpose: Transformar ideia em problema, público, escopo, requisitos e aceite.
    owner_agents: [Leonardo, Carlos]
    trigger_phrases: ["nova ideia", "definir produto", "requisitos"]
    required_inputs: [idea_or_problem]
    optional_inputs: [target_users, constraints, metrics]
    allowed_tools: [Notion, Linear, Product_Design, PostHog, Amplitude, Consensus, Sider_Scholar]
    forbidden_tools: [implementation_without_scope]
    permission_profile: READ_AND_PROPOSE
    execution_steps: [definir_problema, identificar_publico, separar_mvp, mapear_riscos, criar_aceite]
    required_evidence: [problem_statement, requirements, acceptance_criteria]
    expected_outputs: [product_brief, mvp_scope, roadmap]
    acceptance_criteria: [problem_clear, mvp_bounded]
    failure_modes: [solution_first, scope_unbounded]
    fallback: Produzir hipóteses marcadas e perguntas de alta alavancagem.
    handoff_to: Sofia

  - skill_id: MCF-DESIGN-EXPERIENCE
    name: Projetar experiência e interface
    version: 1.0.0
    purpose: Definir jornadas, fluxos, UI e acessibilidade.
    owner_agents: [Evelyn, Laura, Isabela, Marina]
    trigger_phrases: ["wireframe", "fluxo do usuário", "design", "acessibilidade"]
    required_inputs: [product_requirements]
    optional_inputs: [brand, platform, accessibility_target]
    allowed_tools: [Figma, Canva, Product_Design, Mermaid_Chart]
    forbidden_tools: [production_code]
    permission_profile: READ_AND_PROPOSE
    execution_steps: [mapear_jornada, criar_fluxo, definir_telas, revisar_acessibilidade]
    required_evidence: [flow_reference, screen_reference, accessibility_findings]
    expected_outputs: [user_flow, wireframe_or_prototype, accessibility_report]
    acceptance_criteria: [critical_paths_covered, accessibility_reviewed]
    failure_modes: [decorative_design, missing_states]
    fallback: Entregar diagrama textual e especificação de componentes.
    handoff_to: Sofia

  - skill_id: MCF-DESIGN-ARCHITECTURE
    name: Projetar arquitetura
    version: 1.0.0
    purpose: Definir componentes, integrações, dados, infraestrutura e limites.
    owner_agents: [Sofia, Rafael]
    trigger_phrases: ["arquitetura", "componentes", "integrações", "escalabilidade"]
    required_inputs: [requirements, constraints]
    optional_inputs: [existing_system, deployment_target]
    allowed_tools: [Mermaid_Chart, Figma, GitHub, Notion, OpenAI_Developers, MCP_Precheck]
    forbidden_tools: [irreversible_deployment]
    permission_profile: READ_AND_PROPOSE
    execution_steps: [mapear_componentes, definir_contratos, identificar_riscos, planejar_validacao]
    required_evidence: [architecture_diagram, decisions, risks]
    expected_outputs: [architecture_document, integration_contracts]
    acceptance_criteria: [boundaries_clear, risks_controlled]
    failure_modes: [overengineering, hidden_dependency]
    fallback: Entregar arquitetura textual com hipóteses explícitas.
    handoff_to: Rafael

  - skill_id: MCF-IMPLEMENT-CHANGE
    name: Implementar mudança autorizada
    version: 1.0.0
    purpose: Produzir alteração de código dentro do escopo aprovado.
    owner_agents: [Rafael, Eduardo, Helena, Andre, Tiago, Daniela]
    trigger_phrases: ["implementar", "corrigir", "integrar", "criar funcionalidade"]
    required_inputs: [approved_scope, acceptance_criteria, repository, allowed_paths]
    optional_inputs: [branch, issue, design_reference]
    allowed_tools: [GitHub, Linear, Supabase, Neon_Postgres, Render, Vercel, Cloudflare, OpenAI_Developers, Figma, CodeBuddy]
    forbidden_tools: [direct_main_write, public_release_without_gate]
    permission_profile: SCOPED_WRITE
    execution_steps: [preparar_workspace, implementar, coletar_diff, registrar_handoff_de_testes, passar_para_revisao]
    required_evidence: [changed_files, base_commit_sha, diff_digest, test_results_or_handoff]
    expected_outputs: [implementation, technical_notes]
    acceptance_criteria: [scope_respected, tests_or_handoff_proven]
    failure_modes: [scope_creep, unsafe_write, missing_tests]
    fallback: Produzir patch ou plano executável sem alegar aplicação.
    handoff_to: Vinicius

  - skill_id: MCF-DEBUG-INCIDENT
    name: Diagnosticar incidente
    version: 1.0.0
    purpose: Reproduzir falha, localizar causa raiz e recuperar fluxo.
    owner_agents: [Patricia, Bruno, Rafael]
    trigger_phrases: ["bug", "incidente", "travamento", "falha", "erro em produção"]
    required_inputs: [symptom_or_evidence]
    optional_inputs: [logs, screenshots, commit, environment]
    allowed_tools: [Sentry, GitHub, PostHog, Amplitude, Render, Vercel, Supabase, Neon_Postgres]
    forbidden_tools: [blind_retry, destructive_fix_without_backup]
    permission_profile: SCOPED_WRITE
    execution_steps: [capturar, reproduzir, classificar, identificar_causa, corrigir_ou_isolar, validar]
    required_evidence: [reproduction, root_cause, recovery_result]
    expected_outputs: [incident_report, fix_or_mitigation]
    acceptance_criteria: [cause_supported, regression_test_added]
    failure_modes: [non_reproducible, insufficient_logs]
    fallback: Instrumentar diagnóstico e declarar dependência externa.
    handoff_to: Renato

  - skill_id: MCF-REVIEW-CODE
    name: Revisar código e refatoração
    version: 1.0.0
    purpose: Avaliar qualidade estrutural, segurança e manutenção.
    owner_agents: [Vinicius, Lucas, Ricardo]
    trigger_phrases: ["revisar código", "code review", "refatorar", "performance"]
    required_inputs: [diff_or_commit]
    optional_inputs: [quality_targets, performance_budget]
    allowed_tools: [GitHub, Codex_Security, Sentry]
    forbidden_tools: [merge_without_gate]
    permission_profile: READ_AND_PROPOSE
    execution_steps: [inspecionar_diff, classificar_achados, propor_correcao, validar_risco]
    required_evidence: [file_and_line_references, severity, recommendation]
    expected_outputs: [review_report, refactoring_plan]
    acceptance_criteria: [findings_actionable, no_unverified_claims]
    failure_modes: [style_only_review, missing_context]
    fallback: Solicitar evidência mínima e limitar veredito.
    handoff_to: Rafael

  - skill_id: MCF-RUN-TESTS
    name: Executar validação e testes
    version: 1.0.0
    purpose: Verificar critérios de aceite e regressões.
    owner_agents: [Renato]
    trigger_phrases: ["testar", "validar", "rodar CI", "smoke test"]
    required_inputs: [acceptance_criteria, test_target]
    optional_inputs: [workflow, environment]
    allowed_tools: [GitHub, Sentry, PostHog, Vercel, Render, Supabase]
    forbidden_tools: [fabricated_pass]
    permission_profile: SCOPED_WRITE
    execution_steps: [definir_casos, executar, coletar_evidencia, corrigir_teste_obsoleto_quando_autorizado, emitir_veredito]
    required_evidence: [commands_or_workflows, passed, failed, logs]
    expected_outputs: [validation_summary, validation_full, smoke_result]
    acceptance_criteria: [all_critical_tests_pass]
    failure_modes: [environment_unavailable, flaky_test]
    fallback: Registrar bloqueio verificável e checkpoint.
    handoff_to: Emily

  - skill_id: MCF-SECURITY-REVIEW
    name: Revisar segurança
    version: 1.0.0
    purpose: Avaliar ameaças, vulnerabilidades, permissões e dados.
    owner_agents: [Ricardo, Julia]
    trigger_phrases: ["segurança", "ameaças", "permissões", "privacidade", "compliance"]
    required_inputs: [system_or_change]
    optional_inputs: [data_classification, threat_model]
    allowed_tools: [Codex_Security, MCP_Precheck, AccessOwl, Neura_Relay_MCP, PrivacyHawk, GitHub, Notion]
    forbidden_tools: [secret_exposure, unrestricted_write]
    permission_profile: SENSITIVE_CONTROLLED
    execution_steps: [classificar_dados, mapear_ameacas, revisar_permissoes, definir_controles, emitir_veredito]
    required_evidence: [threats, controls, residual_risk]
    expected_outputs: [security_report, governance_verdict]
    acceptance_criteria: [critical_risks_addressed_or_blocked]
    failure_modes: [missing_data_flow, unknown_permissions]
    fallback: Bloquear ação sensível e solicitar evidência específica.
    handoff_to: Emily

  - skill_id: MCF-GIT-PR-RELEASE
    name: Versionar, abrir PR e integrar
    version: 1.0.0
    purpose: Controlar branch, commits, PR, CI, merge e release autorizada.
    owner_agents: [Gabriel]
    trigger_phrases: ["criar PR", "versionar", "merge", "release"]
    required_inputs: [repository, branch, acceptance_state]
    optional_inputs: [issue, release_target]
    allowed_tools: [GitHub]
    forbidden_tools: [force_push_without_authorization, merge_with_red_ci]
    permission_profile: SCOPED_WRITE
    execution_steps: [verificar_diff, criar_pr, acompanhar_ci, registrar_evidencia, integrar_quando_autorizado]
    required_evidence: [branch, head_sha, pr_number, ci_status, merge_sha]
    expected_outputs: [pull_request, integration_record]
    acceptance_criteria: [ci_green, gate_present]
    failure_modes: [head_moved, merge_conflict, red_ci]
    fallback: Manter PR aberto e registrar próxima ação.
    handoff_to: Mestre

  - skill_id: MCF-DEPLOY-VALIDATE
    name: Implantar e validar ambiente
    version: 1.0.0
    purpose: Executar deploy autorizado, smoke e rollback quando necessário.
    owner_agents: [Bruno, Gabriel]
    trigger_phrases: ["deploy", "publicar", "ambiente", "rollback"]
    required_inputs: [artifact_or_commit, target_environment]
    optional_inputs: [rollback_plan, release_notes]
    allowed_tools: [Vercel, Render, Cloudflare, Supabase, Neon_Postgres, GitHub, Sentry]
    forbidden_tools: [public_production_without_gate]
    permission_profile: SCOPED_WRITE
    execution_steps: [verificar_gate, implantar, executar_smoke, observar_erros, confirmar_ou_reverter]
    required_evidence: [deployment_id, target, smoke_result, rollback_state]
    expected_outputs: [deployment_record, validation_report]
    acceptance_criteria: [healthy_deployment, rollback_available]
    failure_modes: [quota_exhausted, build_failure, unhealthy_release]
    fallback: Manter último ambiente estável e registrar bloqueio.
    handoff_to: Augusto

  - skill_id: MCF-TRACE-MISSION
    name: Observar missão multiagente
    version: 1.0.0
    purpose: Verificar ordem, ferramentas, handoffs, loops, falhas e eficiência.
    owner_agents: [Augusto]
    trigger_phrases: ["mission trace", "observabilidade multiagente", "verificar fluxo"]
    required_inputs: [mission_execution]
    optional_inputs: [token_and_latency_metrics]
    allowed_tools: [GitHub, Linear, Notion, PostHog, Amplitude, Sentry]
    forbidden_tools: [alter_domain_deliverables]
    permission_profile: READ_ONLY
    execution_steps: [registrar_eventos, verificar_handoffs, detectar_loop, registrar_falhas, emitir_alertas]
    required_evidence: [chronological_trace, handoff_status, recovery_status]
    expected_outputs: [mission_trace]
    acceptance_criteria: [no_hidden_gap, flow_recoverable]
    failure_modes: [missing_event_data]
    fallback: Produzir trace textual baseado somente em evidências observadas.
    handoff_to: Beatriz

  - skill_id: MCF-EVALUATE-AGENTS
    name: Avaliar agentes e comportamento
    version: 1.0.0
    purpose: Medir qualidade, consistência, fidelidade e regressão de agentes.
    owner_agents: [Beatriz, Tiago]
    trigger_phrases: ["avaliar agentes", "benchmark", "regressão de prompt", "scorecard"]
    required_inputs: [behavior_or_configuration, criteria]
    optional_inputs: [baseline, scenarios]
    allowed_tools: [PostHog, Amplitude, Notion, GitHub, Consensus, Sider_Scholar]
    forbidden_tools: [self_approval_without_evidence]
    permission_profile: READ_ONLY
    execution_steps: [definir_cenarios, executar_avaliacao, comparar_baseline, emitir_veredito]
    required_evidence: [test_cases, scores, regressions]
    expected_outputs: [evaluation_scorecard]
    acceptance_criteria: [criteria_reproducible]
    failure_modes: [no_baseline, subjective_only]
    fallback: Emitir avaliação qualitativa limitada e declarar restrição.
    handoff_to: Emily

  - skill_id: MCF-CLOSE-PHASE
    name: Fechar fase com rastreabilidade
    version: 1.0.0
    purpose: Consolidar PRF, auditoria, gate e checkpoint.
    owner_agents: [Carmem, Emily, Leo, Mestre]
    trigger_phrases: ["fechar fase", "concluir fase", "gerar rastreabilidade"]
    required_inputs: [phase_execution, acceptance_results]
    optional_inputs: [branch, pr, deployment]
    allowed_tools: [GitHub, Google_Drive, Notion, Documents, PDF, Spreadsheets]
    forbidden_tools: [declare_delivered_with_pending_action]
    permission_profile: SCOPED_WRITE
    execution_steps: [consolidar_documentos, auditar_evidencias, decidir_gate, emitir_checkpoint, apresentar_entrega]
    required_evidence: [phase_pack, audit_verdict, leo_decision, checkpoint]
    expected_outputs: [PRF, phase_closeout]
    acceptance_criteria: [traceability_complete, objective_state_truthful]
    failure_modes: [missing_evidence, incomplete_checkpoint]
    fallback: Retornar para correção ou declarar dependência externa.
    handoff_to: Mestre

  - skill_id: MCF-AUDIT-VISUAL-DESKTOP
    name: Auditar superfícies visuais do desktop
    version: 1.0.0
    purpose: Capturar, identificar, anotar e verificar superfícies operacionais visíveis em um desktop autorizado sem inventar conteúdo.
    owner_agents: [Augusto, Beatriz]
    trigger_phrases: ["auditar desktop", "tirar print e anotar", "marcar navegadores", "auditoria visual"]
    required_inputs: [audit_request, requested_unit, output_directory, authorizedScope]
    optional_inputs: [expected_surface_count, time_budget_ms, open_surface_index, window_pattern]
    allowed_tools: [SentinelX, Remote_Desktop_Commander]
    forbidden_tools: [destructive_write, secret_exposure, fabricated_visual_evidence]
    permission_profile: SCOPED_WRITE
    execution_steps: [inventariar_superficies, capturar_raw, interpretar_observavel, delimitar_e_anotar, salvar_artefatos, abrir_resultado, verificar_abertura, medir_execucao]
    required_evidence: [raw_artifact, annotated_artifact, verification_artifact, surface_inventory, elapsed_ms, open_verified]
    expected_outputs: [visual_audit_result, annotated_screenshot, verification_screenshot]
    acceptance_criteria: [requested_unit_respected, annotations_observable_only, artifacts_traceable, open_verified, time_budget_respected_when_provided]
    failure_modes: [gui_unavailable, surface_count_mismatch, ocr_unreliable, artifact_missing, open_not_verified]
    fallback: Preferir fonte estruturada; usar OCR somente como fallback; se a sessão gráfica ou a evidência final não puder ser verificada, declarar bloqueio sem inventar sucesso.
    handoff_to: Beatriz

  - skill_id: MCF-EXECUTE-LOCAL-TEAM
    name: Executar time local multiagente governado
    version: 0.1.0
    purpose: Selecionar agentes canônicos por competência e executar workers locais não cognitivos em processos separados, com receipts individuais e consolidados.
    owner_agents: [Mestre]
    trigger_phrases: ["multiagente", "subagentes", "time de agentes", "mais agentes", "paralelismo"]
    required_inputs: [objective, mission_selected_agents]
    optional_inputs: []
    allowed_tools: [local-agent-runtime]
    forbidden_tools: [shell_arbitrary, public_deployment, production_action, secret_access]
    permission_profile: READ_AND_PROPOSE
    execution_steps:
      - selecionar_agentes_canonicos
      - validar_escopo_da_missao
      - executar_workers_locais_limitados
      - coletar_receipts_filhos
      - consolidar_receipt
    required_evidence: [selected_agents, process_ids, worker_receipts, consolidated_digest]
    expected_outputs: [local_team_result, consolidated_receipt]
    acceptance_criteria: [canonical_agents_only, unique_processes, receipts_valid, cognitive_non_claim_preserved]
    failure_modes: [executor_disabled, worker_timeout, duplicate_pid, invalid_receipt, mission_scope_mismatch]
    fallback: Falhar fechado e retornar ao Mestre sem alegar execução cognitiva independente.
    handoff_to: Mestre

  # Provider-agnostic web research skills.
  # EXPERIMENTAL: orchestration-ready; server runtime adapter pending.
  - skill_id: MCF-WEB-SEARCH
    status: EXPERIMENTAL
    name: Pesquisar fontes na web
    version: 0.1.0
    purpose: Descobrir fontes web relevantes e atuais sem depender de um único provedor externo.
    owner_agents: [Miriam, Mestre]
    trigger_phrases: ["pesquisar na web", "buscar fontes", "procurar na internet", "encontrar fontes atuais"]
    required_inputs: [query]
    optional_inputs: [recency, domains, source_type, max_results, language]
    allowed_tools: [Web_Native, GitHub, OpenAI_Developers, Exa, Consensus, Sider_Scholar, Firecrawl]
    forbidden_tools: [paid_fallback_without_authorization, fabricate_results, bypass_access_controls]
    permission_profile: READ_ONLY
    execution_steps: [classificar_consulta, selecionar_provider, executar_busca, deduplicar_resultados, priorizar_fontes_primarias, registrar_limitacoes]
    required_evidence: [query, provider_used, result_urls, observed_at, limitations]
    expected_outputs: [search_result_set, source_shortlist]
    acceptance_criteria: [sources_traceable, provider_declared, no_fabricated_result, limitations_explicit]
    failure_modes: [provider_unavailable, zero_results, stale_results, provider_rate_limited]
    fallback: Usar o próximo provider aprovado; Firecrawl é apenas fallback opcional; se todos falharem, declarar dependência externa.
    handoff_to: Miriam

  - skill_id: MCF-WEB-FETCH
    status: EXPERIMENTAL
    name: Recuperar página web conhecida
    version: 0.1.0
    purpose: Ler e extrair conteúdo de uma URL conhecida com proveniência, sem exigir Firecrawl.
    owner_agents: [Miriam]
    trigger_phrases: ["abrir esta página", "ler esta URL", "extrair conteúdo", "consultar esta página"]
    required_inputs: [url]
    optional_inputs: [freshness_requirement, extraction_goal, max_content, language]
    allowed_tools: [Web_Native, ChatGPT_Work, Firecrawl]
    forbidden_tools: [form_submission, credential_capture, access_control_bypass, paid_fallback_without_authorization]
    permission_profile: READ_ONLY
    execution_steps: [validar_url, selecionar_provider, recuperar_pagina, extrair_conteudo_relevante, registrar_metadados, declarar_limites]
    required_evidence: [url, provider_used, observed_at, content_reference, fetch_status, limitations]
    expected_outputs: [page_content, page_metadata]
    acceptance_criteria: [url_traceable, content_grounded, freshness_declared, no_hidden_side_effect]
    failure_modes: [blocked_by_site, authentication_required, javascript_only_content, provider_unavailable, content_too_large]
    fallback: Usar navegador autorizado somente para leitura; se indisponível, tentar provider alternativo e declarar falha se todos falharem.
    handoff_to: Miriam

  - skill_id: MCF-WEB-MAP
    status: EXPERIMENTAL
    name: Mapear URLs de um site
    version: 0.1.0
    purpose: Descobrir URLs relevantes de um domínio por sitemap, links observáveis e busca restrita ao site.
    owner_agents: [Miriam]
    trigger_phrases: ["mapear site", "listar páginas", "descobrir URLs", "achar páginas deste domínio"]
    required_inputs: [site_root]
    optional_inputs: [search_term, max_urls, include_subdomains, sitemap_policy]
    allowed_tools: [Web_Native, ChatGPT_Work, Firecrawl]
    forbidden_tools: [unbounded_crawl, access_control_bypass, fabricate_url_inventory]
    permission_profile: READ_ONLY
    execution_steps: [normalizar_dominio, consultar_sitemap_e_robots, coletar_links_observaveis, complementar_com_busca_site_scoped, deduplicar, classificar_cobertura]
    required_evidence: [site_root, provider_used, discovered_urls, discovery_methods, coverage_statement, observed_at]
    expected_outputs: [url_inventory, coverage_statement]
    acceptance_criteria: [urls_traceable, methods_declared, coverage_not_overclaimed]
    failure_modes: [no_sitemap, site_blocks_listing, provider_unavailable, excessive_url_count]
    fallback: Usar busca site-scoped e páginas-semente, marcando cobertura PARCIAL; nunca alegar inventário completo sem evidência.
    handoff_to: Miriam

  - skill_id: MCF-WEB-COLLECT
    status: EXPERIMENTAL
    name: Coletar conteúdo multi-página
    version: 0.1.0
    purpose: Coletar um conjunto limitado de páginas de um site ou lista de URLs com deduplicação e evidência por página.
