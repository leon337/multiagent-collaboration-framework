id: MCF-FULLSTACK-VISUAL-DEVELOPMENT
version: 0.2.0
status: EXPERIMENTAL
classification: orchestration_contract_only
runtime_adapter: PARTIAL_COMPONENT_TEMPLATE_DISCOVERY_AND_GOVERNED_CODEBUDDY_APPLICATION
receipt_validator: MCF_RUNTIME_EVIDENCE_VALIDATOR
provider:
  name: Astryx
  role: optional_visual_design_system
  repository: https://github.com/meta/astryx
  beta: true
  requirements:
    react: ">=19"
  cli:
    discovery:
      - "pnpm exec astryx --json component --list"
      - "pnpm exec astryx --json component <ComponentName> --detail compact"
      - "pnpm exec astryx --json template --list"
      - "pnpm exec astryx --json template <templateId>"
      - "pnpm exec astryx --json template <templateId> --skeleton"
    proposal:
      - "pnpm exec astryx --json template <templateId> <approved-repository-relative-file>"
      - "The command runs only in a unique disposable workspace; one source file and its diff are returned as a signed proposal."
    styling:
      - "StyleX is an internal authoring implementation; consumers use precompiled CSS and may customize with CSS or className."
    safety:
      - "Do not run arbitrary shell commands from model-generated strings."
      - "Install both @astryxdesign/cli and @astryxdesign/core as pinned project dependencies and commit the lockfile."
      - "Run CLI only in an isolated authorized workspace; proposal copies are limited to a disposable child workspace."
      - "Capture stdout, stderr, exit code, package versions, workspace, source/diff bytes and SHA-256 digests."
      - "The MCF Astryx adapter resolves the exact package-local CLI binary from the workspace and invokes it with process.execPath; no shell, PATH lookup, or global CLI fallback is allowed."
      - "The adapter is disabled by default; scaffold proposal never writes to the target checkout."
      - "Apply a signed proposal only through MCF-IMPLEMENT-CHANGE with SCOPED_WRITE, authorizedScope, explicit HDF v1.1 approval by LEANDRO, TEAM_FIRST evidence, exact base SHA and allowed_paths."
      - "CodeBuddy application runs in a disposable Git worktree and Bubblewrap sandbox; no commit or deploy; transactional rollback is verified."
scope:
  includes:
    - product_to_fullstack_plan
    - visual_component_discovery
    - visual_template_discovery
    - disposable_scaffold_proposal
    - governed_scaffold_application
    - frontend_implementation
    - backend_api_contracts
    - database_and_migrations
    - authentication_and_authorization
    - integration_testing
    - visual_regression
    - accessibility_review
    - security_review
  excludes:
    - production_deployment_without_gate
    - direct_main_writes
    - arbitrary_shell_execution
    - treating_ui_visibility_as_authorization
    - moving_business_rules_into_components
architecture_invariants:
  - astryx_is_visual_provider_not_fullstack_runtime
  - api_and_domain_contracts_are_provider_independent
  - server_side_authorization_is_mandatory
  - visual_provider_is_opt_in_per_project_or_route
  - css_reset_and_theme_changes_require_visual_regression
  - core_theme_cli_versions_must_be_compatible_and_locked
  - unsupported_stack_must_fallback_without_blocking_backend
evidence:
  required:
    - base_commit_sha
    - provider_version
    - local_cli_binary_provenance
    - receipt_signature_and_semantic_validation
    - scaffold_proposal_receipt
    - source_and_diff_sha256
    - approved_paths
    - hdf_approval_by_leandro
    - rollback_validation
    - lockfile
    - architecture_decisions
    - api_contracts
    - data_model_and_migration_plan
    - unit_api_integration_e2e_results
    - visual_regression_results
    - accessibility_findings
    - security_findings
    - ci_status
acceptance:
  - frontend_backend_contracts_consistent
  - critical_flows_pass
  - responsive_review_complete
  - server_side_authorization_verified
  - migrations_recovery_documented
  - hdf_scoped_write_and_rollback_proven
  - pilot_fullstack_e2e_pass
  - visual_baselines_committed_and_verified
  - autonomous_mcf_mission_e2e_pass
  - real_codebuddy_host_scoped_write_pass
  - no_secrets
  - ci_green
  - no_unapproved_production_effect
