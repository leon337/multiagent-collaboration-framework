mission_contract:
  mission_id: MCF-20260914-INTERACTIVE-BOOK-V3
  parent_mission_id: null
  phase_id: PHASE-IBV3-PHYSICAL-BOOK-ENGINE
  title: "Interactive Book V3 — Physical Book Engine"
  objective: "Entregar um prototipo interativo de livro digital fisico, validavel dentro do ChatGPT, com virada por arraste, curvatura visual, audio reativo, navegacao, acessibilidade e regressao controlada."
  expected_outcome: "Prototipo V3 funcional e validado pelo LEANDRO dentro do ChatGPT, pronto para um gate humano posterior de publicacao externa."
  scope:
    - page curl visual deformavel por segmentos
    - arraste por bordas e cantos com acompanhamento em tempo real
    - sombras dinamicas durante a dobra
    - Web Audio API reativa a velocidade e progresso
    - controle de som e volume
    - pilha visual de paginas lidas e restantes
    - corner lift e feedback de manipulacao
    - capa e contracapa
    - navegacao por capitulos
    - marcador, progresso e retomada local
    - selecao de texto sem conflito com gesto
    - acessibilidade, teclado e reduced motion
    - layout desktop e mobile
    - pagina de fontes e versao
    - validacao de regressao antes de publicacao
  out_of_scope:
    - deploy Vercel antes do HUMAN_GATE
    - merge em main antes da validacao humana
    - APIs pagas
    - telemetria remota
  inputs:
    - prototipo V2 criado nesta conversa
    - auditoria de melhorias acordada com LEANDRO
    - artigo oficial OpenAI sobre navegador padrao no ChatGPT Android
  source_of_truth:
    - project-instructions/MCF-PROJECT-OPERATING-INSTRUCTIONS.md
    - templates/MCF-UNIFIED-MISSION.yaml
    - artifacts/phases/PHASE-IBV3-PHYSICAL-BOOK-ENGINE/CHECKLIST.md
    - experimentos/interactive-book-v3/index.html
  assumptions:
    - o prototipo sera validado primeiro na superficie inline do ChatGPT
    - Web Audio depende de interacao do usuario para desbloqueio no navegador
  acceptance_criteria:
    - a folha acompanha mouse ou toque durante o arraste
    - arraste abaixo do limiar retorna; acima completa a virada
    - dobra possui curvatura visual e sombra progressiva
    - som de papel reage a velocidade do gesto e pode ser silenciado
    - texto continua selecionavel fora das zonas de pega
    - desktop e mobile apresentam conteudo sem corte critico
    - navegacao por botoes, teclado e capitulos funciona
    - estado de leitura pode ser retomado localmente
    - nenhuma publicacao externa ocorre sem autorizacao humana explicita
  authorizations:
    - LEANDRO autorizou criar a missao, checklist vivo e implementar o prototipo V3
    - LEANDRO autorizou validacao dentro do ChatGPT
  prohibitions:
    - nao publicar externamente antes do HUMAN_GATE
    - nao fazer merge em main sem decisao humana posterior
    - nao simular validacao que nao tenha sido realmente executada
  risk_class: B
  current_state: EM_EXECUCAO
  cycle: 1
  selected_agents:
    - Mestre
  decision_authority: Leo
  human_escalation_triggers:
    - publicacao externa
    - merge em main
    - mudanca material de escopo
  phase_artifact_directory: artifacts/phases/PHASE-IBV3-PHYSICAL-BOOK-ENGINE

